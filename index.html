/* índice do funil: até onde cada lead chegou */
const FUNIL=[
  {id:'novo',n:'Novo lead',c:'#8A8A8E'},
  {id:'contato_feito',n:'Contato feito',c:'#19408B'},
  {id:'respondeu',n:'Respondeu',c:'#2C5AB5'},
  {id:'experimental',n:'Experimental / Teste',c:'#B87500'},
  {id:'negociacao',n:'Negociação',c:'#E6143C'},
  {id:'fechado',n:'Matrícula fechada',c:'#1E7A46'}
];
const FIDX={novo:0,contato_feito:1,respondeu:2,experimental:3,negociacao:4,fechado:5};
const PERDA_IDX={'Sem retorno':1,'Contato inválido':1,'Fora da região':2,'Só robótica':2,'Preço':4,'Outro':1};

function maxIdx(s,histMap){
  let m=0;
  if(s.etapa==='perdido'){
    m=PERDA_IDX[s.motivo_perda]!=null?PERDA_IDX[s.motivo_perda]:1;
  }else{
    m=FIDX[s.etapa]!=null?FIDX[s.etapa]:0;
  }
  const hs=histMap[s.id];
  if(hs)hs.forEach(function(e){if(FIDX[e]!=null&&FIDX[e]>m)m=FIDX[e];});
  return m;
}

function renderReports(){
  const board=$('board');
  const all=DATA.leads||[];
  const meses={};
  all.forEach(function(s){if(s.data_entrada)meses[s.data_entrada.slice(0,7)]=1;});
  const listaMeses=Object.keys(meses).sort().reverse();
  const per=window._rper||'';

  const leads=all.filter(function(s){return !per||(s.data_entrada||'').slice(0,7)===per;});
  const histMap={};
  (ETAPAS_HIST||[]).forEach(function(e){(histMap[e.lead_id]=histMap[e.lead_id]||[]).push(e.etapa);});

  const total=leads.length;
  const fech=leads.filter(function(s){return s.etapa==='fechado';});
  const perd=leads.filter(function(s){return s.etapa==='perdido';});
  const ativos=total-fech.length-perd.length;

  // tempo médio de fechamento
  let tmed='—';
  const dias=fech.filter(function(s){return s.data_entrada&&s.data_fechamento;}).map(function(s){
    return Math.max(0,(new Date(s.data_fechamento)-new Date(s.data_entrada))/86400000);
  });
  if(dias.length)tmed=Math.round(dias.reduce(function(a,b){return a+b;},0)/dias.length)+' dias';

  // funil real: quantos chegaram a cada etapa
  const reached=FUNIL.map(function(f,i){
    return leads.filter(function(s){return maxIdx(s,histMap)>=i;}).length;
  });
  const atAtivo=FUNIL.map(function(f,i){
    return leads.filter(function(s){return s.etapa!=='perdido'&&s.etapa!=='fechado'&&FIDX[s.etapa]===i;}).length;
  });
  const perdAt=FUNIL.map(function(f,i){
    return perd.filter(function(s){return maxIdx(s,histMap)===i;}).length;
  });
  const mx=Math.max(reached[0],1);

  let funil='<div class="fnl">'+FUNIL.map(function(f,i){
    const w=Math.max(100*reached[i]/mx,10);
    const wn=i<FUNIL.length-1?Math.max(100*reached[i+1]/mx,10):w;
    const inset=w>0?Math.max(0,(w-wn)/2/w*100):0;
    const clip=i<FUNIL.length-1?'clip-path:polygon(0 0,100% 0,'+(100-inset)+'% 100%,'+inset+'% 100%);':'border-radius:0 0 10px 10px;';
    const info=[];
    if(atAtivo[i])info.push('<i>'+atAtivo[i]+' aguardando aqui</i>');
    if(perdAt[i])info.push('<b>'+perdAt[i]+' perdidos aqui</b>');
    return '<div class="fnlrow">'+
      '<div class="fnlbarwrap"><div class="fnlbar" style="width:'+w+'%;background:'+f.c+';'+clip+'">'+
        '<b>'+reached[i]+'</b><span>'+esc(f.n)+'</span></div></div>'+
      '<div class="fnlinfo">'+pct(reached[i],total)+' chegaram até aqui'+(info.length?'<br>'+info.join(' · '):'')+'</div>'+
    '</div>';
  }).join('')+'</div>';

  // evolução mensal
  const evAsc=Object.keys(meses).sort();
  let evo='';
  if(evAsc.length){
    const em=evAsc.map(function(m){
      const ls=all.filter(function(s){return (s.data_entrada||'').slice(0,7)===m;});
      return {m:m,n:ls.length,f:ls.filter(function(s){return s.etapa==='fechado';}).length};
    });
    const emx=Math.max.apply(null,em.map(function(x){return x.n;}).concat([1]));
    evo='<div class="rcard"><h3>Evolução mensal · leads x matrículas</h3><div class="mgrid">'+em.map(function(x){
      return '<div class="mcol"><div class="mv">'+x.n+' · '+x.f+'</div><div class="mbars">'+
        '<i class="ml" style="height:'+Math.max(100*x.n/emx,3)+'%"></i>'+
        '<i class="mf" style="height:'+Math.max(100*x.f/emx,3)+'%"></i>'+
        '</div><div class="mn">'+mesCurto(x.m)+'</div></div>';
    }).join('')+'</div><div class="mleg"><span><i style="background:var(--blue)"></i>Leads</span><span><i style="background:var(--ok)"></i>Matrículas</span></div></div>';
  }

  // tabelas de grupo
  function grupo(campo,titulo,rotulo){
    const g={};
    leads.forEach(function(s){
      const k=s[campo]||'—';
      if(!g[k])g[k]={n:0,f:0};
      g[k].n++;if(s.etapa==='fechado')g[k].f++;
    });
    const ks=Object.keys(g).sort(function(a,b){return g[b].n-g[a].n;});
    if(!ks.length)return '';
    return '<div class="rcard"><h3>'+titulo+'</h3><div class="rtabw"><table class="rtab">'+
      '<tr><th>'+rotulo+'</th><th class="num">Leads</th><th class="num">Matrículas</th><th class="num">Conversão</th></tr>'+
      ks.map(function(k){
        return '<tr><td>'+esc(k)+'</td><td class="num">'+g[k].n+'</td><td class="num">'+g[k].f+'</td><td class="num">'+pct(g[k].f,g[k].n)+'</td></tr>';
      }).join('')+'</table></div></div>';
  }

  // motivos de perda
  let motivos='';
  const gm={};
  perd.forEach(function(s){const k=s.motivo_perda||'Não informado';gm[k]=(gm[k]||0)+1;});
  const km=Object.keys(gm).sort(function(a,b){return gm[b]-gm[a];});
  if(km.length){
    const mm=Math.max.apply(null,km.map(function(k){return gm[k];}));
    motivos='<div class="rcard"><h3>Motivos de perda</h3><div class="fun">'+km.map(function(k){
      return '<div class="frow"><span class="fl">'+esc(k)+'</span>'+
        '<span class="fb"><i style="--bc:#B9B9BE;width:'+(100*gm[k]/mm)+'%"></i></span>'+
        '<span class="fn">'+gm[k]+' · '+pct(gm[k],perd.length)+'</span></div>';
    }).join('')+'</div></div>';
  }

  // leads esquecidos (sempre situação atual, ignora o período)
  const hoje=new Date();
  const esq=all.filter(function(s){
    if(s.etapa==='fechado'||s.etapa==='perdido')return false;
    if(!s.ultimo_contato)return true;
    return (hoje-new Date(s.ultimo_contato))/86400000>7;
  }).map(function(s){
    const d=s.ultimo_contato?Math.floor((hoje-new Date(s.ultimo_contato))/86400000):null;
    return {s:s,d:d};
  }).sort(function(a,b){return (b.d==null?9999:b.d)-(a.d==null?9999:a.d);});
  let alerta='';
  if(esq.length){
    alerta='<div class="rcard"><h3>⚠️ Precisam de follow-up · sem contato há mais de 7 dias</h3>'+esq.slice(0,15).map(function(x){
      const wa=waLink(x.s.whatsapp);
      return '<div class="alert"><span class="an">'+esc(x.s.nome)+' <span class="tag">'+esc(x.s.responsavel||'—')+'</span></span>'+
        '<span class="ad">'+(x.d==null?'nunca contatado':x.d+' dias')+'</span>'+
        (wa?'<a class="wa" aria-label="WhatsApp" style="display:inline-flex;align-items:center;border-radius:8px;padding:6px 9px;text-decoration:none" target="_blank" rel="noopener" href="'+wa+'">'+WAICO+'</a>':'<span></span>')+
      '</div>';
    }).join('')+(esq.length>15?'<div class="empty">+ '+(esq.length-15)+' outros — use o kanban pra ver todos</div>':'')+'</div>';
  }

  // comparativo com o mes anterior (so quando um mes esta selecionado)
  let prevYM='';
  if(per){
    const pp=per.split('-');
    const dt=new Date(parseInt(pp[0],10),parseInt(pp[1],10)-2,1);
    prevYM=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
  }
  const lprev=prevYM?all.filter(function(s){return (s.data_entrada||'').slice(0,7)===prevYM;}):null;
  const pTotal=lprev?lprev.length:null;
  const pFech=lprev?lprev.filter(function(s){return s.etapa==='fechado';}).length:null;
  function kd(cur,prev){
    if(prev==null)return '';
    const d=cur-prev;
    if(!d)return '<i class="kd">igual ao mês anterior</i>';
    return '<i class="kd '+(d>0?'up':'down')+'">'+(d>0?'▲ +'+d:'▼ '+d)+' vs mês anterior</i>';
  }

  // interacoes B2C do periodo, ja sem as notas internas
  const interB2C=((CANDATA&&CANDATA.b2c)?CANDATA.b2c:[]).filter(function(i){
    if(i.tipo==='nota')return false;
    return !per||String(i.data||'').slice(0,7)===per;
  });

  // tempo ate o primeiro contato
  const primeiro={};
  ((CANDATA&&CANDATA.b2c)?CANDATA.b2c:[]).forEach(function(i){
    if(!i.lead_id||!i.data||i.tipo==='nota')return;
    const dd=String(i.data).slice(0,10);
    if(!primeiro[i.lead_id]||dd<primeiro[i.lead_id])primeiro[i.lead_id]=dd;
  });
  const bks=[{n:'No mesmo dia',v:0},{n:'Em 1 dia',v:0},{n:'2 a 3 dias',v:0},{n:'4 a 7 dias',v:0},{n:'Mais de 7 dias',v:0},{n:'Ainda sem contato',v:0}];
  let somaE=0,comE=0;
  leads.forEach(function(s){
    const pr=primeiro[s.id];
    if(!pr){bks[5].v++;return;}
    const dd=Math.max(0,Math.round((new Date(pr+'T12:00:00')-new Date((s.data_entrada||pr)+'T12:00:00'))/86400000));
    somaE+=dd;comE++;
    if(dd===0)bks[0].v++;else if(dd===1)bks[1].v++;else if(dd<=3)bks[2].v++;else if(dd<=7)bks[3].v++;else bks[4].v++;
  });
  const mxb=Math.max.apply(null,bks.map(function(b){return b.v;}).concat([1]));
  const tprim=comE?(somaE/comE).toFixed(1).replace('.',',')+' dias':'—';
  const cardTempo='<div class="rcard"><h3>Tempo até o primeiro contato</h3>'+
    '<div class="rbig">'+tprim+'<small>média entre a entrada do lead e o primeiro contato registrado por um consultor</small></div>'+
    '<div class="fun">'+bks.map(function(b,i){
      return '<div class="frow"><span class="fl">'+b.n+'</span>'+
        '<span class="fb"><i style="--bc:'+(i>=4?'var(--red)':(i>=3?'#B87500':'var(--blue)'))+';width:'+(100*b.v/mxb)+'%"></i></span>'+
        '<span class="fn">'+b.v+'</span></div>';
    }).join('')+'</div>'+
    '<div class="rnote">Lead respondido no mesmo dia converte muito mais. Os dois blocos de baixo são a fila que está esfriando.</div></div>';

  // ranking de consultores: leads, contatos, efetividade e matriculas
  const rk={};
  function rkGet(k){if(!rk[k])rk[k]={n:0,f:0,p:0,ct:0,ef:0};return rk[k];}
  leads.forEach(function(s){
    const g=rkGet(s.responsavel||'—');
    g.n++;
    if(s.etapa==='fechado')g.f++;
    if(s.etapa==='perdido')g.p++;
  });
  interB2C.forEach(function(i){
    const g=rkGet(i.autor||'—');
    g.ct++;if(i.efetivo!==false)g.ef++;
  });
  const rkKeys=Object.keys(rk).sort(function(a,b){
    if(rk[b].f!==rk[a].f)return rk[b].f-rk[a].f;
    return rk[b].n-rk[a].n;
  });
  const cardRank=rkKeys.length?'<div class="rcard"><h3>Ranking de consultores</h3><div class="rtabw"><table class="rtab">'+
    '<tr><th>Consultor</th><th class="num">Leads</th><th class="num">Contatos</th><th class="num">Efetividade</th><th class="num">Matrículas</th><th class="num">Conversão</th></tr>'+
    rkKeys.map(function(k){
      const g=rk[k];
      return '<tr><td>'+esc(k)+(g.p?'<span class="sub">'+g.p+' perdidos</span>':'')+'</td>'+
        '<td class="num">'+g.n+'</td><td class="num">'+g.ct+'</td>'+
        '<td class="num">'+(g.ct?pct(g.ef,g.ct):'—')+'</td>'+
        '<td class="num'+(g.f?' hl':'')+'">'+g.f+'</td>'+
        '<td class="num">'+pct(g.f,g.n)+'</td></tr>';
    }).join('')+'</table></div>'+
    '<div class="rnote">Contatos e efetividade contam as interações registradas por cada um no período. Leads e matrículas contam quem está como responsável.</div></div>':'';

  $('stats').innerHTML='';
  board.innerHTML='<div class="rscreen"><div class="rwrap">'+
    '<div class="rtitle"><h1>Relatórios</h1>'+subnav()+'<div class="spacer"></div>'+
      '<select id="rperiodo" class="btn" style="font-weight:600;color:var(--blue)">'+
        '<option value="">Todos os períodos</option>'+
        listaMeses.map(function(m){return '<option value="'+m+'"'+(per===m?' selected':'')+'>'+mesLabel(m)+'</option>';}).join('')+
      '</select></div>'+
    '<div class="rkpis">'+
      '<div class="rkpi"><b>'+total+'</b><span>Leads</span>'+kd(total,pTotal)+'</div>'+
      '<div class="rkpi"><b>'+ativos+'</b><span>Ativos</span></div>'+
      '<div class="rkpi ok"><b>'+fech.length+'</b><span>Matrículas</span>'+kd(fech.length,pFech)+'</div>'+
      '<div class="rkpi bad"><b>'+perd.length+'</b><span>Perdidos</span></div>'+
      '<div class="rkpi"><b>'+pct(fech.length,total)+'</b><span>Conversão</span></div>'+
      '<div class="rkpi"><b>'+tmed+'</b><span>Tempo até matrícula</span></div>'+
    '</div>'+
    '<div class="rgrid">'+
      buildAnalise(all,histMap).replace('class="acard"','class="acard wide"')+
      '<div class="rcard wide"><h3>Funil · até onde os leads chegam</h3>'+funil+'</div>'+
      cardRank+
      cardTempo+
      evo+
      grupo('origem','Leads por origem','Origem')+
      grupo('curso','Cursos procurados','Curso')+
      motivos+
      (alerta?alerta.replace('class="rcard"','class="rcard wide"'):'')+
    '</div>'+
  '</div></div>';
  const sel=document.getElementById('rperiodo');
  if(sel)sel.onchange=function(){window._rper=sel.value;renderReports();};
  bindSubnav();
}


/* ================= Canais de contato ================= */
const CANAL_INFO={
  whatsapp:{n:'WhatsApp',c:'#1E7A46'},
  ligacao:{n:'Ligação',c:'#19408B'},
  email:{n:'E-mail',c:'#B87500'},
  visita:{n:'Visita',c:'#7A3E9D'},
  reuniao:{n:'Reunião',c:'#0E7490'},
  presencial:{n:'Presencial',c:'#C2410C'}
};
function canalLbl(k){return (CANAL_INFO[k]&&CANAL_INFO[k].n)||(k?String(k).charAt(0).toUpperCase()+String(k).slice(1):'Não informado');}
function canalCor(k){return (CANAL_INFO[k]&&CANAL_INFO[k].c)||'#8A8A8E';}
function diasAtrasISO(n){
  const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function openCanais(){
  $('stats').innerHTML='';
  $('board').innerHTML='<div class="loading">Montando o relatório de canais...</div>';
  try{
    await loadInteracoes();
    if(!DATA.leads)DATA.leads=await api('/crm_leads?select=*&order=nome.asc');
  }catch(e){
    $('board').innerHTML='<div class="loading">Não foi possível carregar o relatório de canais.<br>'+esc(e&&e.message?e.message:'')+'</div>';
    return;
  }
  renderCanais();
}

function renderCanais(){
  const per=window._cper==null?'30':window._cper;   /* '7' | '30' | '90' | '' */
  const escopo=window._cesc||'todos';               /* todos | b2c | b2b */
  const desde=per?diasAtrasISO(parseInt(per,10)):'';

  const rows=[];
  if(escopo!=='b2b')((CANDATA&&CANDATA.b2c)?CANDATA.b2c:[]).forEach(function(i){
    rows.push({d:String(i.data||'').slice(0,10),autor:i.autor||'—',tipo:i.tipo||'',ef:i.efetivo!==false,mot:i.motivo_nao_efetivo,lead:i.lead_id});
  });
  if(escopo!=='b2c')((CANDATA&&CANDATA.b2b)?CANDATA.b2b:[]).forEach(function(i){
    rows.push({d:String(i.data||'').slice(0,10),autor:i.autor||'—',tipo:i.tipo||'',ef:i.efetivo!==false,mot:i.motivo_nao_efetivo,lead:null});
  });

  const noPeriodo=rows.filter(function(r){return r.d&&(!desde||r.d>=desde);});
  const notas=noPeriodo.filter(function(r){return r.tipo==='nota';}).length;
  const cts=noPeriodo.filter(function(r){return r.tipo&&r.tipo!=='nota';});

  const totalCt=cts.length;
  const totalEf=cts.filter(function(r){return r.ef;}).length;

  /* por canal */
  const gc={};
  cts.forEach(function(r){
    if(!gc[r.tipo])gc[r.tipo]={n:0,ef:0};
    gc[r.tipo].n++;if(r.ef)gc[r.tipo].ef++;
  });
  const canais=Object.keys(gc).sort(function(a,b){return gc[b].n-gc[a].n;});

  /* melhores: volume e efetividade (minimo de 5 contatos pra nao virar ruido) */
  const maisUsado=canais.length?canais[0]:null;
  const elegiveis=canais.filter(function(k){return gc[k].n>=5;});
  const maisEfetivo=(elegiveis.length?elegiveis:canais).slice().sort(function(a,b){
    return (gc[b].ef/gc[b].n)-(gc[a].ef/gc[a].n);
  })[0]||null;

  /* por consultor */
  const gu={};
  cts.forEach(function(r){
    if(!gu[r.autor])gu[r.autor]={n:0,ef:0,c:{}};
    gu[r.autor].n++;if(r.ef)gu[r.autor].ef++;
    gu[r.autor].c[r.tipo]=(gu[r.autor].c[r.tipo]||0)+1;
  });
  const consult=Object.keys(gu).sort(function(a,b){return gu[b].n-gu[a].n;});

  /* motivos de contato nao efetivo */
  const gm={};
  cts.filter(function(r){return !r.ef;}).forEach(function(r){
    const k=MOTIVOS_NE[r.mot]||r.mot||'Não informado';
    gm[k]=(gm[k]||0)+1;
  });
  const motKeys=Object.keys(gm).sort(function(a,b){return gm[b]-gm[a];});

  /* conversao em matricula por canal (so B2C) */
  const leadsById={};
  (DATA.leads||[]).forEach(function(s){leadsById[s.id]=s;});
  const canalLead={};
  cts.forEach(function(r){
    if(!r.lead)return;
    if(!canalLead[r.tipo])canalLead[r.tipo]={};
    canalLead[r.tipo][r.lead]=1;
  });
  const convRows=Object.keys(canalLead).map(function(k){
    const ids=Object.keys(canalLead[k]);
    const f=ids.filter(function(id){return leadsById[id]&&leadsById[id].etapa==='fechado';}).length;
    return {k:k,n:ids.length,f:f};
  }).sort(function(a,b){return (b.f/(b.n||1))-(a.f/(a.n||1));});

  /* volume por dia, ultimos 14 dias com registro */
  const gd={};
  cts.forEach(function(r){
    if(!gd[r.d])gd[r.d]={n:0,ef:0};
    gd[r.d].n++;if(r.ef)gd[r.d].ef++;
  });
  const dias=Object.keys(gd).sort().slice(-14);

  /* ---------- montagem ---------- */
  const kpis='<div class="rkpis">'+
    '<div class="rkpi"><b>'+totalCt+'</b><span>Contatos no período</span></div>'+
    '<div class="rkpi ok"><b>'+totalEf+'</b><span>Efetivos</span></div>'+
    '<div class="rkpi"><b>'+pct(totalEf,totalCt)+'</b><span>Taxa de efetividade</span></div>'+
    '<div class="rkpi"><b style="font-size:18px">'+(maisUsado?esc(canalLbl(maisUsado)):'—')+'</b><span>Canal mais usado</span></div>'+
    '<div class="rkpi ok"><b style="font-size:18px">'+(maisEfetivo?esc(canalLbl(maisEfetivo)):'—')+'</b><span>Canal mais efetivo</span></div>'+
    '<div class="rkpi"><b>'+consult.length+'</b><span>Consultores ativos</span></div>'+
  '</div>';

  let cardCanais;
  if(!canais.length){
    cardCanais='<div class="rcard wide"><h3>Canais mais usados e efetividade</h3><div class="rempty">Nenhum contato registrado no período selecionado.</div></div>';
  }else{
    const mxn=gc[canais[0]].n;
    cardCanais='<div class="rcard wide"><h3>Canais mais usados e efetividade</h3>'+
      '<div class="chtop">'+canais.map(function(k){
        return '<span class="chpill"><i class="chdot" style="background:'+canalCor(k)+'"></i><b>'+esc(canalLbl(k))+'</b> '+pct(gc[k].ef,gc[k].n)+' efetivo</span>';
      }).join('')+'</div>'+
      '<div class="chn">'+canais.map(function(k){
        const g=gc[k],larg=100*g.n/mxn,pe=g.n?100*g.ef/g.n:0;
        return '<div class="chrow"><div class="chh"><i class="chdot" style="background:'+canalCor(k)+'"></i>'+
            '<span class="cnm">'+esc(canalLbl(k))+'</span>'+
            '<span class="cqt">'+g.n+' contatos · '+g.ef+' efetivos · '+pct(g.ef,g.n)+'</span></div>'+
          '<div class="chbar" style="width:'+Math.max(larg,12)+'%">'+
            '<i class="cef" style="width:'+pe+'%"></i><i class="cne" style="width:'+(100-pe)+'%"></i>'+
          '</div></div>';
      }).join('')+'</div>'+
      '<div class="chleg"><span><i style="background:var(--ok)"></i>Contato efetivo</span><span><i style="background:#D6D6DB"></i>Não efetivo</span></div>'+
      '<div class="rnote">A largura da barra é o volume de uso do canal. A parte verde é a fatia que virou conversa de verdade.'+
        (notas?' Não entram aqui '+notas+' anotação'+(notas>1?'ões':'')+' interna'+(notas>1?'s':'')+', que não são contato com o cliente.':'')+'</div></div>';
  }

  let cardMatriz='<div class="rcard wide"><h3>Quem usa qual canal</h3><div class="rempty">Sem contatos no período.</div></div>';
  if(consult.length&&canais.length){
    cardMatriz='<div class="rcard wide"><h3>Quem usa qual canal</h3><div class="rtabw"><table class="rtab">'+
      '<tr><th>Consultor</th>'+canais.map(function(k){return '<th class="num">'+esc(canalLbl(k))+'</th>';}).join('')+
      '<th class="num">Total</th><th class="num">Efetividade</th></tr>'+
      consult.map(function(u){
        const g=gu[u];
        return '<tr><td>'+esc(u)+'</td>'+canais.map(function(k){
          const v=g.c[k]||0;
          return '<td class="num">'+(v?v:'·')+'</td>';
        }).join('')+'<td class="num">'+g.n+'</td><td class="num'+(g.n&&g.ef/g.n>=0.7?' hl':'')+'">'+pct(g.ef,g.n)+'</td></tr>';
      }).join('')+
      '<tr><td><b>Total</b></td>'+canais.map(function(k){return '<td class="num"><b>'+gc[k].n+'</b></td>';}).join('')+
      '<td class="num"><b>'+totalCt+'</b></td><td class="num"><b>'+pct(totalEf,totalCt)+'</b></td></tr>'+
      '</table></div>'+
      '<div class="rnote">Cruze a linha do consultor com a coluna do canal para ver por onde cada um está puxando o cliente.</div></div>';
  }

  let cardConv='';
  if(convRows.length){
    cardConv='<div class="rcard"><h3>Canal x matrícula</h3><div class="rtabw"><table class="rtab">'+
      '<tr><th>Canal</th><th class="num">Leads tocados</th><th class="num">Matrículas</th><th class="num">Conversão</th></tr>'+
      convRows.map(function(x){
        return '<tr><td>'+esc(canalLbl(x.k))+'</td><td class="num">'+x.n+'</td>'+
          '<td class="num'+(x.f?' hl':'')+'">'+x.f+'</td><td class="num">'+pct(x.f,x.n)+'</td></tr>';
      }).join('')+'</table></div>'+
      '<div class="rnote">Leads B2C que receberam pelo menos um contato por aquele canal no período e hoje estão como matrícula fechada. O mesmo lead pode aparecer em mais de um canal.</div></div>';
  }

  let cardMot='';
  if(motKeys.length){
    const mm=gm[motKeys[0]];
    cardMot='<div class="rcard"><h3>Por que o contato não foi efetivo</h3><div class="fun">'+
      motKeys.map(function(k){
        return '<div class="frow"><span class="fl">'+esc(k)+'</span>'+
          '<span class="fb"><i style="--bc:#B9B9BE;width:'+(100*gm[k]/mm)+'%"></i></span>'+
          '<span class="fn">'+gm[k]+' · '+pct(gm[k],totalCt-totalEf)+'</span></div>';
      }).join('')+'</div>'+
      '<div class="rnote">Muito "não atendeu" na ligação e muito "mensagem não lida" no WhatsApp indicam horário de abordagem errado.</div></div>';
  }

  let cardDias='';
  if(dias.length){
    const mxd=Math.max.apply(null,dias.map(function(d){return gd[d].n;}).concat([1]));
    cardDias='<div class="rcard"><h3>Volume de contatos por dia</h3><div class="mgrid">'+
      dias.map(function(d){
        return '<div class="mcol"><div class="mv">'+gd[d].n+'</div><div class="mbars">'+
          '<i class="ml" style="height:'+Math.max(100*gd[d].n/mxd,3)+'%"></i>'+
          '<i class="mf" style="height:'+Math.max(100*gd[d].ef/mxd,3)+'%"></i>'+
          '</div><div class="mn">'+dLabel(d)+'</div></div>';
      }).join('')+'</div>'+
      '<div class="mleg"><span><i style="background:var(--blue)"></i>Contatos</span><span><i style="background:var(--ok)"></i>Efetivos</span></div></div>';
  }

  const filtros='<div class="rcard wide" style="padding:12px 16px;display:flex;gap:14px;flex-wrap:wrap;align-items:center">'+
    '<div class="rfil" id="cper">'+
      [['7','7 dias'],['30','30 dias'],['90','90 dias'],['','Tudo']].map(function(o){
        return '<button data-p="'+o[0]+'"'+(per===o[0]?' class="on"':'')+'>'+o[1]+'</button>';
      }).join('')+
    '</div><div class="spacer" style="flex:1"></div>'+
    '<div class="rfil" id="cesc">'+
      [['todos','Todos'],['b2c','Clientes B2C'],['b2b','Escolas e empresas']].map(function(o){
        return '<button data-e="'+o[0]+'"'+(escopo===o[0]?' class="on"':'')+'>'+o[1]+'</button>';
      }).join('')+
    '</div></div>';

  $('board').innerHTML='<div class="rscreen"><div class="rwrap">'+
    '<div class="rtitle"><h1>Relatórios</h1>'+subnav()+'</div>'+
    kpis+
    '<div class="rgrid">'+
      filtros+
      cardCanais+
      cardMatriz+
      cardConv+
      cardMot+
      cardDias+
    '</div>'+
  '</div></div>';

  bindSubnav();
  document.querySelectorAll('#cper button').forEach(function(b){
    b.onclick=function(){window._cper=b.dataset.p;renderCanais();};
  });
  document.querySelectorAll('#cesc button').forEach(function(b){
    b.onclick=function(){window._cesc=b.dataset.e;renderCanais();};
  });
}


/* ================= Relatório diário do consultor ================= */
let DIA={payload:null,serie:[]};
const DTIPO={lead:'B2C',escola:'Escola',empresa:'Empresa',tarefa:'Tarefa'};

function uInfo(nome){return USERS.find(function(x){return x.nome===nome;})||null;}
function consultoresLista(){
  const c=USERS.filter(function(u){return u.consultor;});
  return c.length?c:USERS;
}
function diaConsultor(){
  if(!isAdmin())return currentUser;
  if(window._dcons&&USERS.some(function(u){return u.nome===window._dcons;}))return window._dcons;
  const c=consultoresLista()[0];
  return c?c.nome:currentUser;
}
function diaData(){return window._ddata||hojeISO();}
function dLabel(iso){const p=String(iso).split('-');return p[2]+'/'+p[1];}
function minDe(t){const h=hhmm(t)||'00:00';return parseInt(h.slice(0,2),10)*60+parseInt(h.slice(3,5),10);}

async function openMeuDia(){
  $('stats').innerHTML='';
  $('board').innerHTML='<div class="loading">Montando o relatório do dia...</div>';
  const c=diaConsultor(),d=diaData();
  if(!c){$('board').innerHTML='<div class="empty">Nenhum consultor cadastrado.</div>';return;}
  try{
    const r=await Promise.all([
      api('/rpc/crm_relatorio_dia',{method:'POST',body:JSON.stringify({p_data:d,p_consultor:c})}),
      api('/crm_relatorio_diario?consultor=eq.'+encodeURIComponent(c)+'&select=data,agendados,realizados,efetivos,nao_efetivos,pendentes,matriculas,leads_novos,cumprimento,fechado_em,fechado_por&order=data.desc&limit=30')
    ]);
    DIA.payload=r[0]||{};DIA.serie=r[1]||[];
  }catch(e){
    $('board').innerHTML='<div class="loading">Não foi possível carregar o relatório do dia.<br>'+esc(e&&e.message?e.message:'')+'</div>';
    return;
  }
  renderMeuDia();
}

function dLista(arr,fn,vazio){
  if(!arr||!arr.length)return '<div class="empty">'+vazio+'</div>';
  return arr.map(fn).join('');
}

function renderMeuDia(){
  const p=DIA.payload||{},k=p.kpis||{},c=diaConsultor(),d=diaData(),hoje=hojeISO();
  const u=uInfo(c)||{},ini=hhmm(u.hora_inicio)||'09:00',fim=hhmm(u.hora_fim)||'18:00';
  const snap=(DIA.serie||[]).filter(function(x){return x.data===d;})[0];
  const ag=new Date(),agMin=ag.getHours()*60+ag.getMinutes();
  const encerrado=(d<hoje)||(d===hoje&&agMin>=minDe(fim));

    '<div class="rkpi"><b>'+cumpr+'%</b><span>Cumprimento</span></div>'+

    '<div class="rkpi"><b>'+(k.efetivos||0)+'</b><span>Efetivas</span></div>'+
    '<div class="rkpi"><b>'+(k.nao_efetivos||0)+'</b><span>Não efetivas</span></div>'+
    '<div class="rkpi"><b>'+(k.leads_novos||0)+'</b><span>Leads novos</span></div>'+
    '<div class="rkpi"><b>'+(k.movimentacoes||0)+'</b><span>Movimentações</span></div>'+
    '<div class="rkpi bad"><b>'+(k.perdidos||0)+'</b><span>Perdidos</span></div>'+
  '</div>';

  const agHtml=dLista(p.agendados,function(x){
    return '<div class="drow"><span class="dh">'+(hhmm(x.hora)||'--:--')+'</span>'+

  const reHtml=dLista(p.realizados,function(x){

    const sub=[canal,x.resumo?String(x.resumo).slice(0,110):''].filter(Boolean).join(' · ');
    const motivo=MOTIVOS_NE[x.motivo]||x.motivo||'sem retorno';
    return '<div class="drow"><span class="dh">'+(hhmm(x.hora)||'--:--')+'</span>'+
      '<span class="dn"><span class="dtipo">'+esc(DTIPO[x.tipo]||x.tipo||'')+'</span>'+esc(x.nome||'')+
        (sub?'<span class="dsub">'+esc(sub)+'</span>':'')+'</span>'+
      (x.efetivo?'<span class="dok">efetivo</span>':'<span class="dne">'+esc(motivo)+'</span>')+'</div>';
  },'Nenhuma interação registrada neste dia.');

  const amHtml=dLista(p.amanha,function(x){
    return '<div class="drow"><span class="dh">'+(hhmm(x.hora)||'--:--')+'</span>'+
      '<span class="dn"><span class="dtipo">'+esc(DTIPO[x.tipo]||x.tipo||'')+'</span>'+esc(x.nome||'')+'</span>'+
      '<span></span></div>';
  },'Nada agendado para o dia seguinte.');

  const serie=(DIA.serie||[]).map(function(x){
    return {data:x.data,ag:x.agendados,fe:x.agendados-x.pendentes,cp:x.cumprimento,mt:x.matriculas,ln:x.leads_novos};
  });
  if(!serie.some(function(x){return x.data===d;})){
    serie.push({data:d,ag:k.agendados||0,fe:k.cumpridos||0,cp:k.cumprimento||0,mt:k.matriculas||0,ln:k.leads_novos||0});

  const graf=serie.slice(-14);

        '<i class="mf" style="height:'+Math.max(100*x.fe/mx,3)+'%"></i>'+

    }).join('')+'</div><div class="mleg"><span><i style="background:var(--blue)"></i>Agendados</span><span><i style="background:var(--ok)"></i>Realizados</span></div>';

    serie.slice().reverse().map(function(x){
      return '<tr><td>'+brDate(x.data)+'</td><td class="num">'+x.ag+'</td><td class="num">'+x.fe+
        '</td><td class="num">'+String(x.cp==null?0:x.cp).replace('.',',')+'%</td><td class="num">'+x.mt+
        '</td><td class="num">'+x.ln+'</td></tr>';
    }).join('')+'</table></div>';

  const selCons=isAdmin()
    ? '<select id="dcons" class="dctl">'+consultoresLista().map(function(x){
        return '<option value="'+esc(x.nome)+'"'+(x.nome===c?' selected':'')+'>'+esc(x.nome)+'</option>';
      }).join('')+'</select>'
    : '';

  const btn='<button class="dbtn" id="dfechar"'+(d>hoje?' disabled':'')+'>'+(snap?'Refazer fechamento':'Fechar o dia')+'</button>';

  $('board').innerHTML='<div class="rscreen"><div class="rwrap">'+
    '<div class="rtitle"><h1>Relatórios</h1>'+subnav()+'<div class="spacer"></div>'+selCons+
      '<input type="date" id="ddata" class="dctl" value="'+esc(d)+'" max="'+hoje+'">'+btn+'</div>'+
    '<div class="dstat"><b style="color:var(--blue)">'+esc(c)+'</b> · jornada '+ini+' às '+fim+
      ' · '+brDate(d)+status+'</div>'+
    kpis+
    '<div class="rcard"><h3>Agenda do dia</h3>'+agHtml+'</div>'+
    '<div class="rcard"><h3>Contatos realizados</h3>'+reHtml+'</div>'+
    '<div class="rcard"><h3>Para o dia seguinte</h3>'+amHtml+'</div>'+
    '<div class="rcard"><h3>Evolução dia a dia</h3>'+evo+'</div>'+
    '<div class="rcard"><h3>Histórico</h3>'+tab+'</div>'+
  '</div></div>';

  bindSubnav();
  const sc=document.getElementById('dcons');
  if(sc)sc.onchange=function(){window._dcons=sc.value;openMeuDia();};
  const sd=document.getElementById('ddata');
  if(sd)sd.onchange=function(){window._ddata=sd.value||hojeISO();openMeuDia();};
  const bf=document.getElementById('dfechar');
  if(bf)bf.onclick=async function(){
    bf.disabled=true;bf.textContent='Fechando...';
    try{
      await api('/rpc/crm_fechar_dia',{method:'POST',body:JSON.stringify({p_data:d,p_consultor:c,p_por:currentUser})});
      toast('Dia fechado. Os números ficaram registrados no histórico.');
      DIAAVISADO=true;
      await openMeuDia();
    }catch(e){
      toast('Não foi possível fechar o dia.');
      bf.disabled=false;bf.textContent=snap?'Refazer fechamento':'Fechar o dia';
    }
  };
}

/* aviso de fim de expediente */
let DIAAVISADO=false;
async function checarFechamento(){
  if(!currentUser||DIAAVISADO)return;
  const u=uInfo(currentUser);
  if(!u||!u.consultor)return;
  const ag=new Date();
  if(ag.getHours()*60+ag.getMinutes()<minDe(u.hora_fim)-15)return;
  try{
    const r=await api('/crm_relatorio_diario?consultor=eq.'+encodeURIComponent(currentUser)+
                      '&data=eq.'+hojeISO()+'&select=id');
    if(r&&r.length){DIAAVISADO=true;return;}
  }catch(e){return;}
  DIAAVISADO=true;
  toast('Seu expediente está terminando. Abra Relatórios e feche o dia.');
}

/* ================= Análise do andamento ================= */
function buildAnalise(all,histMap){
  const hoje=new Date();
  function diasAtras(n){const d=new Date(hoje);d.setDate(d.getDate()-n);return d;}
  function entreDatas(campo,d1,d2){
    return all.filter(function(s){
      if(!s[campo])return false;
      const d=new Date(s[campo]);
      return d>=d1&&d<d2;
    });
  }
  const itens=[];

  // 1. ritmo de captação (últimos 7 dias vs 7 anteriores)
  const n7=entreDatas('data_entrada',diasAtras(7),hoje).length;
  const n14=entreDatas('data_entrada',diasAtras(14),diasAtras(7)).length;
  if(n7===0&&n14===0){
    itens.push({c:'neg',t:'<b>Nenhum lead novo nas últimas duas semanas.</b> A captação está parada — vale checar se os anúncios estão rodando e se os leads estão sendo registrados aqui no CRM.'});
  }else if(n7>n14){
    itens.push({c:'pos',t:'<i>'+n7+' leads novos nos últimos 7 dias</i>, acima dos '+n14+' da semana anterior. Captação acelerando.'});
  }else if(n7<n14){
    itens.push({c:'neg',t:'<i>'+n7+' leads novos nos últimos 7 dias</i>, contra '+n14+' na semana anterior. Ritmo de captação caindo.'});
  }else{
    itens.push({c:'',t:'<i>'+n7+' leads novos nos últimos 7 dias</i>, mesmo ritmo da semana anterior.'});
  }

  // 2. matrículas recentes
  const f30=entreDatas('data_fechamento',diasAtras(30),hoje).filter(function(s){return s.etapa==='fechado';}).length;
  if(f30>0)itens.push({c:'pos',t:'<i>'+f30+' matrícula'+(f30>1?'s':'')+'</i> fechada'+(f30>1?'s':'')+' nos últimos 30 dias.'});
  else itens.push({c:'neg',t:'<b>Nenhuma matrícula nos últimos 30 dias.</b>'});

  // 3. mês atual vs anterior
  const ym=hoje.toISOString().slice(0,7);
  const prev=new Date(hoje.getFullYear(),hoje.getMonth()-1,1).toISOString().slice(0,7);
  const lm=all.filter(function(s){return (s.data_entrada||'').slice(0,7)===ym;});
  const lp=all.filter(function(s){return (s.data_entrada||'').slice(0,7)===prev;});
  if(lm.length||lp.length){
    itens.push({c:lm.length>=lp.length?'':'neg',t:'Este mês: <i>'+lm.length+' leads</i> e <i>'+lm.filter(function(s){return s.etapa==='fechado';}).length+' matrículas</i>'+(lp.length?' (mês passado: '+lp.length+' leads, '+lp.filter(function(s){return s.etapa==='fechado';}).length+' matrículas)':'')+'.'});
  }

  // 4. atividade da equipe (movimentações registradas)
  const mov7=(ETAPAS_HIST||[]).filter(function(e){return e.data&&new Date(e.data)>=diasAtras(7);}).length;
  if(mov7>0)itens.push({c:'',t:'<i>'+mov7+' movimentaç'+(mov7>1?'ões':'ão')+' de etapa</i> registradas no funil nos últimos 7 dias.'});

  // 5. onde o funil mais vaza
  const perdTotal=all.filter(function(s){return s.etapa==='perdido';});
  if(perdTotal.length>=5){
    const porEtapa={};
    perdTotal.forEach(function(s){const i=maxIdx(s,histMap);porEtapa[i]=(porEtapa[i]||0)+1;});
    const pior=Object.keys(porEtapa).sort(function(a,b){return porEtapa[b]-porEtapa[a];})[0];
    itens.push({c:'neg',t:'Maior vazamento do funil: <b>'+porEtapa[pior]+' leads perdidos na etapa "'+FUNIL[pior].n+'"</b> ('+pct(porEtapa[pior],perdTotal.length)+' das perdas).'});
    const gm={};
    perdTotal.forEach(function(s){const k=s.motivo_perda||'Não informado';gm[k]=(gm[k]||0)+1;});
    const km=Object.keys(gm).sort(function(a,b){return gm[b]-gm[a];})[0];
    itens.push({c:'',t:'Principal motivo de perda: <b>'+esc(km)+'</b> ('+gm[km]+' leads). '+(km==='Sem retorno'?'Vale testar variações da primeira mensagem e um segundo toque mais cedo.':'')});
  }

  // 6. follow-up pendente
  const pend=all.filter(function(s){
    if(s.etapa==='fechado'||s.etapa==='perdido')return false;
    if(!s.ultimo_contato)return true;
    return (hoje-new Date(s.ultimo_contato))/86400000>7;
  });
  if(pend.length>0){
    itens.push({c:'neg',t:'<b>'+pend.length+' leads ativos sem contato há mais de 7 dias</b> — lista completa no bloco de follow-up abaixo. Lead esfriado raramente volta sozinho.'});
  }else{
    const at=all.filter(function(s){return s.etapa!=='fechado'&&s.etapa!=='perdido';}).length;
    if(at>0)itens.push({c:'pos',t:'Todos os '+at+' leads ativos tiveram contato na última semana. Funil em dia.'});
  }

  // 7. melhor origem (com volume mínimo)
  const go={};
  all.forEach(function(s){const k=s.origem||'—';if(!go[k])go[k]={n:0,f:0};go[k].n++;if(s.etapa==='fechado')go[k].f++;});
  const origens=Object.keys(go).filter(function(k){return go[k].n>=8;});
  if(origens.length>1){
    origens.sort(function(a,b){return (go[b].f/go[b].n)-(go[a].f/go[a].n);});
    const top=origens[0];
    if(go[top].f>0)itens.push({c:'pos',t:'Origem que melhor converte: <i>'+esc(top)+'</i> ('+pct(go[top].f,go[top].n)+' de '+go[top].n+' leads). Considere reforçar esse canal.'});
  }

  const agora=hoje.toLocaleDateString('pt-BR')+' às '+hoje.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return '<div class="acard"><h3>Análise do andamento</h3><div class="asub">Gerada agora, com a foto atual do funil · '+agora+'</div><ul>'+
    itens.map(function(x){return '<li class="'+x.c+'">'+x.t+'</li>';}).join('')+'</ul></div>';
}

/* ================= Mural (promoções, avisos e FAQ) ================= */
let MURAL={avisos:null,faq:null};
let faqQ='';
let mEdit=null;   /* {tipo:'aviso'|'faq', id:null|uuid} */

function hojeISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function brDate(s){return s?s.split('-').reverse().join('/'):'';}
function agoraHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function hhmm(h){return h?String(h).slice(0,5):'';}
function agLabel(d,h){if(!d)return '';const p=String(d).split('-');return p[2]+'/'+p[1]+(h?' '+hhmm(h):'');}
function vigente(a){
  const h=hojeISO();
  if(!a.ativo)return false;
  if(a.vigencia_inicio&&a.vigencia_inicio>h)return false;
  if(a.vigencia_fim&&a.vigencia_fim<h)return false;
  return true;
}

async function openMural(){
  $('stats').innerHTML='';
  $('board').innerHTML='<div class="loading">Carregando mural...</div>';
  try{
    const r=await Promise.all([
      api('/crm_avisos?select=*&order=destaque.desc,ordem.asc,criado_em.desc'),
      api('/crm_faq?select=*&order=categoria.asc,ordem.asc')
    ]);
    MURAL.avisos=r[0]||[];MURAL.faq=r[1]||[];
  }catch(e){
    $('board').innerHTML='<div class="loading">Não foi possível carregar o mural.</div>';return;
  }
  mEdit=null;renderMural();
}

function renderMural(){
  const adm=isAdmin();
  const avisos=MURAL.avisos.filter(function(a){return adm||vigente(a);});
  const q=faqQ.trim().toLowerCase();
  const faq=MURAL.faq.filter(function(f){
    if(!adm&&!f.ativo)return false;
    if(!q)return true;
    return (f.pergunta+' '+f.resposta+' '+f.categoria+' '+(f.tags||[]).join(' ')).toLowerCase().indexOf(q)>-1;
  });

  let h='<div class="pane">';

  /* --- Promoções e avisos --- */
  h+='<div class="rcard"><div class="paneh"><h3>Promoções e avisos do período</h3>'+
     (adm?'<button class="btn primary" id="addAviso">+ Nova</button>':'')+'</div>';
  if(!avisos.length){
    h+='<div style="color:var(--gray);font-size:13px;padding:6px 0">Nenhuma promoção ou aviso no ar agora.</div>';
  }else{
    avisos.forEach(function(a){
      const fora=!vigente(a);
      h+='<div class="promo'+(a.destaque?' hot':'')+'" style="'+(fora?'opacity:.55':'')+'">'+
        '<div class="pt">'+esc(a.titulo)+
          (a.tipo==='promocao'?'<span class="tag red">Promoção</span>':'<span class="tag">Aviso</span>')+
          (fora?'<span class="tag gray">'+(a.ativo?'Fora de vigência':'Inativo')+'</span>':'')+
        '</div>'+
        (a.corpo?'<div class="pb">'+esc(a.corpo)+'</div>':'')+
        '<div class="pv">Vigência: '+brDate(a.vigencia_inicio)+(a.vigencia_fim?' até '+brDate(a.vigencia_fim):' · sem prazo')+'</div>'+
        (adm?'<div class="pbtns"><button class="btn" data-ea="'+a.id+'">Editar</button>'+
             '<button class="btn danger" data-da="'+a.id+'">Excluir</button></div>':'')+
      '</div>';
    });
  }
  if(adm&&mEdit&&mEdit.tipo==='aviso')h+=formAviso();
  h+='</div>';

  /* --- FAQ --- */
  h+='<div class="rcard"><div class="paneh"><h3>Dúvidas frequentes</h3>'+
     (adm?'<button class="btn primary" id="addFaq">+ Nova</button>':'')+'</div>'+
     '<input id="faqq" type="search" placeholder="Buscar por palavra-chave: material, trancamento, reposição..." '+
     'value="'+esc(faqQ)+'" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:6px">';
  if(!faq.length){
    h+='<div style="color:var(--gray);font-size:13px;padding:10px 0">'+(q?'Nada encontrado para essa busca.':'Nenhuma pergunta cadastrada ainda.')+'</div>';
  }else{
    let cat='';
    faq.forEach(function(f){
      if(f.categoria!==cat){cat=f.categoria;h+='<div class="faqcat">'+esc(cat)+'</div>';}
      h+='<div class="faqq" data-fq="'+f.id+'">'+
        '<button type="button"><span>'+esc(f.pergunta)+(f.ativo?'':' <span class="tag gray">Inativa</span>')+'</span><span class="ar">▾</span></button>'+
        '<div class="fa">'+esc(f.resposta)+
          (adm?'<div class="pbtns"><button class="btn" data-ef="'+f.id+'">Editar</button>'+
               '<button class="btn danger" data-df="'+f.id+'">Excluir</button></div>':'')+
        '</div></div>';
    });
  }
  if(adm&&mEdit&&mEdit.tipo==='faq')h+=formFaq();
  h+='</div></div>';

  $('board').innerHTML=h;
  wireMural();
}

function formAviso(){
  const a=mEdit.id?MURAL.avisos.find(function(x){return x.id===mEdit.id;}):null;
  const g=function(k,d){return a&&a[k]!=null?a[k]:d;};
  return '<div class="mform" id="fav">'+
    '<div class="full"><label>Título</label><input id="av_titulo" value="'+esc(g('titulo',''))+'"></div>'+
    '<div><label>Tipo</label><select id="av_tipo">'+
      '<option value="promocao"'+(g('tipo','promocao')==='promocao'?' selected':'')+'>Promoção</option>'+
      '<option value="aviso"'+(g('tipo','promocao')==='aviso'?' selected':'')+'>Aviso</option></select></div>'+
    '<div><label>Ordem</label><input id="av_ordem" type="number" value="'+g('ordem',0)+'"></div>'+
    '<div class="full"><label>Texto</label><textarea id="av_corpo">'+esc(g('corpo',''))+'</textarea></div>'+
    '<div><label>Início da vigência</label><input id="av_ini" type="date" value="'+g('vigencia_inicio',hojeISO())+'"></div>'+
    '<div><label>Fim da vigência (vazio = sem prazo)</label><input id="av_fim" type="date" value="'+g('vigencia_fim','')+'"></div>'+
    '<div class="full row"><label style="margin:0"><input type="checkbox" id="av_destaque"'+(g('destaque',false)?' checked':'')+'> Destacar no topo</label>'+
      '<label style="margin:0 0 0 16px"><input type="checkbox" id="av_ativo"'+(g('ativo',true)?' checked':'')+'> Ativo</label></div>'+
    '<div class="full row"><button class="btn primary" id="av_save">Salvar</button>'+
      '<button class="btn" id="av_cancel">Cancelar</button><span id="av_msg" style="font-size:12px;color:var(--ok)"></span></div>'+
  '</div>';
}

function formFaq(){
  const f=mEdit.id?MURAL.faq.find(function(x){return x.id===mEdit.id;}):null;
  const g=function(k,d){return f&&f[k]!=null?f[k]:d;};
  return '<div class="mform" id="ffq">'+
    '<div><label>Categoria</label><input id="fq_cat" list="fqcats" value="'+esc(g('categoria','Geral'))+'">'+
      '<datalist id="fqcats"><option>Matrícula</option><option>Financeiro</option><option>Pedagógico</option>'+
      '<option>Material</option><option>Cancelamento</option><option>Geral</option></datalist></div>'+

function wireMural(){
  const fq=$('faqq');
  if(fq){
    fq.oninput=function(e){
      faqQ=e.target.value;
      const pos=e.target.selectionStart;
      renderMural();
      const n=$('faqq');if(n){n.focus();n.setSelectionRange(pos,pos);}
    };
  }
  document.querySelectorAll('.faqq>button').forEach(function(b){
    b.onclick=function(){b.parentNode.classList.toggle('open');};
  });
  if($('addAviso'))$('addAviso').onclick=function(){mEdit={tipo:'aviso',id:null};renderMural();};
  if($('addFaq'))$('addFaq').onclick=function(){mEdit={tipo:'faq',id:null};renderMural();};
  document.querySelectorAll('[data-ea]').forEach(function(b){
    b.onclick=function(){mEdit={tipo:'aviso',id:b.dataset.ea};renderMural();};
  });
  document.querySelectorAll('[data-ef]').forEach(function(b){
    b.onclick=function(e){e.stopPropagation();mEdit={tipo:'faq',id:b.dataset.ef};renderMural();};
  });
  document.querySelectorAll('[data-da]').forEach(function(b){
    b.onclick=async function(){
      if(!confirm('Excluir este item do mural?'))return;
      await api('/crm_avisos?id=eq.'+b.dataset.da,{method:'DELETE'});
      MURAL.avisos=MURAL.avisos.filter(function(x){return x.id!==b.dataset.da;});
      mEdit=null;renderMural();
    };
  });
  document.querySelectorAll('[data-df]').forEach(function(b){
    b.onclick=async function(e){
      e.stopPropagation();
      if(!confirm('Excluir esta pergunta?'))return;
      await api('/crm_faq?id=eq.'+b.dataset.df,{method:'DELETE'});
      MURAL.faq=MURAL.faq.filter(function(x){return x.id!==b.dataset.df;});
      mEdit=null;renderMural();
    };
  });

  if($('av_cancel'))$('av_cancel').onclick=function(){mEdit=null;renderMural();};
  if($('fq_cancel'))$('fq_cancel').onclick=function(){mEdit=null;renderMural();};

  if($('av_save'))$('av_save').onclick=async function(){
    const btn=$('av_save');if(btn.disabled)return;btn.disabled=true;
    try{
      const body={
        titulo:$('av_titulo').value.trim(),
        tipo:$('av_tipo').value,
        corpo:$('av_corpo').value,
        destaque:$('av_destaque').checked,
        ativo:$('av_ativo').checked,
        ordem:parseInt($('av_ordem').value||'0',10),
        vigencia_inicio:$('av_ini').value||hojeISO(),
        vigencia_fim:$('av_fim').value||null,
        atualizado_em:new Date().toISOString()
      };
      if(!body.titulo){alert('Coloque um título.');btn.disabled=false;return;}
      if(body.vigencia_fim&&body.vigencia_fim<body.vigencia_inicio){alert('A data final é anterior à inicial.');btn.disabled=false;return;}
      if(mEdit.id){
        const r=await api('/crm_avisos?id=eq.'+mEdit.id,{method:'PATCH',body:JSON.stringify(body)});
        const i=MURAL.avisos.findIndex(function(x){return x.id===mEdit.id;});
        if(i>-1&&r&&r[0])MURAL.avisos[i]=r[0];
      }else{
        body.criado_por=currentUser;
        const r=await api('/crm_avisos',{method:'POST',body:JSON.stringify(body)});
        if(r&&r[0])MURAL.avisos.unshift(r[0]);
      }
      mEdit=null;renderMural();
    }catch(e){alert('Erro ao salvar: '+(e&&e.message?e.message:e));btn.disabled=false;}
  };

  if($('fq_save'))$('fq_save').onclick=async function(){
    const btn=$('fq_save');if(btn.disabled)return;btn.disabled=true;
    try{
      const body={
        categoria:$('fq_cat').value.trim()||'Geral',
        pergunta:$('fq_perg').value.trim(),
        resposta:$('fq_resp').value,
        tags:$('fq_tags').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
        ativo:$('fq_ativo').checked,
        ordem:parseInt($('fq_ordem').value||'0',10),
        atualizado_em:new Date().toISOString()
      };
      if(!body.pergunta){alert('Escreva a pergunta.');btn.disabled=false;return;}
      if(mEdit.id){
        const r=await api('/crm_faq?id=eq.'+mEdit.id,{method:'PATCH',body:JSON.stringify(body)});
        const i=MURAL.faq.findIndex(function(x){return x.id===mEdit.id;});
        if(i>-1&&r&&r[0])MURAL.faq[i]=r[0];
      }else{
        body.criado_por=currentUser;
        const r=await api('/crm_faq',{method:'POST',body:JSON.stringify(body)});
        if(r&&r[0])MURAL.faq.push(r[0]);
      }
      MURAL.faq.sort(function(a,b){return a.categoria===b.categoria?a.ordem-b.ordem:(a.categoria<b.categoria?-1:1);});
      mEdit=null;renderMural();
    }catch(e){alert('Erro ao salvar: '+(e&&e.message?e.message:e));btn.disabled=false;}
  };
}

/* ================= Calculadora de valores ================= */
const ANO_PRECOS=2026;
const PARCELAS=[12,11,10,9,1];
let PRECOS={niveis:null,materiais:null,certs:null};
let CALC={n1:'',d1:0,dois:true,n2:'',d2:0,mat:true,dm1:0,dm2:0,
          parcC:12,parcM:12,matricula:15000,validade:''};

function fmtNum(c){
  const v=(Math.abs(Math.round(c))/100).toFixed(2).split('.');
  return v[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+v[1];
}
function money(c){return (c<0?'-':'')+'R$ '+fmtNum(c);}
/* mascara de moeda: le so os digitos e reposiciona o cursor no fim */
function maskMoeda(el){
  const d=String(el.value).replace(/\D/g,'');
  const cents=d?parseInt(d,10):0;
  el.value=fmtNum(cents);
  try{const n=el.value.length;el.setSelectionRange(n,n);}catch(e){}
  return cents;
}
function nivelBy(cod){return (PRECOS.niveis||[]).find(function(x){return x.codigo===cod;})||null;}
function matBy(cod){return cod?((PRECOS.materiais||[]).find(function(x){return x.codigo===cod;})||null):null;}
function maisDias(n){
  const d=new Date();d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function openCalc(){
  $('stats').innerHTML='';
  if(!PRECOS.niveis){
    $('board').innerHTML='<div class="loading">Carregando tabela de preços '+ANO_PRECOS+'...</div>';
    try{
      const r=await Promise.all([
        api('/crm_precos_niveis?select=*&ativo=eq.true&ano=eq.'+ANO_PRECOS+'&order=ordem.asc'),
        api('/crm_precos_materiais?select=*&ativo=eq.true&ano=eq.'+ANO_PRECOS+'&order=ordem.asc'),
        api('/crm_precos_certificacoes?select=*&ativo=eq.true&ano=eq.'+ANO_PRECOS+'&order=ordem.asc')
      ]);
      PRECOS.niveis=r[0]||[];PRECOS.materiais=r[1]||[];PRECOS.certs=r[2]||[];
    }catch(e){
      $('board').innerHTML='<div class="loading">Não foi possível carregar a tabela de preços.</div>';return;
    }
  }
  if(!CALC.n1&&PRECOS.niveis.length)CALC.n1=PRECOS.niveis[0].codigo;
  if(!CALC.n2)CALC.n2=CALC.n1;
  if(!CALC.validade)CALC.validade=maisDias(7);
  renderCalc();
}

function calcular(){
  const n1=nivelBy(CALC.n1);
  const n2=CALC.dois?(nivelBy(CALC.n2)||n1):null;
  /* fonte de verdade e o valor de 2 periodos; o periodo e metade dele
     (pode ter fracao de centavo). Arredonda uma vez so, no total. */
  const p1=n1?n1.valor_2periodos_cents/2:0;
  const p2=n2?n2.valor_2periodos_cents/2:0;
  const c1=p1*(1-CALC.d1/100);
  const c2=p2*(1-CALC.d2/100);
  const m1=CALC.mat?matBy(n1&&n1.material_codigo):null;
  const m2=CALC.mat&&n2?matBy(n2.material_codigo):null;
  const mc1=m1?m1.valor_cents:0, mc2=m2?m2.valor_cents:0;
  const md1=m1?mc1*(1-CALC.dm1/100):0;
  const md2=m2?mc2*(1-CALC.dm2/100):0;
  const cursoCheio=Math.round(p1+p2), cursoDesc=Math.round(c1+c2);
  const matCheio=mc1+mc2, matDesc=Math.round(md1+md2);
  const taxa=CALC.matricula||0;
  return {
    n1:n1,n2:n2,m1:m1,m2:m2,p1:p1,p2:p2,c1:c1,c2:c2,
    mc1:mc1,mc2:mc2,md1:md1,md2:md2,
    cursoCheio:cursoCheio,cursoDesc:cursoDesc,matCheio:matCheio,matDesc:matDesc,
    taxa:taxa,
    totalCheio:cursoCheio+matCheio+taxa,
    totalDesc:cursoDesc+matDesc+taxa,
    economia:(cursoCheio+matCheio)-(cursoDesc+matDesc),
    parcCurso:cursoDesc/CALC.parcC,
    parcMat:matDesc/CALC.parcM,
    mesmaParc:CALC.parcC===CALC.parcM,
    somaParc:(cursoDesc/CALC.parcC)+(matDesc/CALC.parcM)
  };
}

function optsNivel(sel){
  let ing='',esp='';
  (PRECOS.niveis||[]).forEach(function(n){
    const o='<option value="'+n.codigo+'"'+(n.codigo===sel?' selected':'')+'>'+esc(n.nome)+' · '+money(n.valor_2periodos_cents/2)+'</option>';
    if(n.idioma==='espanhol')esp+=o;else ing+=o;
  });
  return '<optgroup label="Inglês">'+ing+'</optgroup><optgroup label="Espanhol">'+esp+'</optgroup>';
}
function optsDesc(sel){
  let o='';
  for(let i=0;i<=100;i+=5)o+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+i+'%</option>';
  return o;
}
function optsParc(sel){
  return PARCELAS.map(function(n){
    return '<option value="'+n+'"'+(n===sel?' selected':'')+'>'+(n===1?'À vista':n+'x')+'</option>';
  }).join('');
}

function propostaTexto(R){
  const L=[];
  const periodos=CALC.dois?'2 períodos':'1 período';
  const nome=R.n2&&R.n1&&R.n2.codigo!==R.n1.codigo?(R.n1.nome+' + '+R.n2.nome):(R.n1?R.n1.nome:'');

  L.push('*Investimento*');
  L.push(nome+' — '+periodos);
  L.push(CALC.parcC>1?(CALC.parcC+'x de '+money(R.parcCurso)):('À vista: '+money(R.cursoDesc)));

  if(CALC.mat&&R.matDesc>0){
    L.push('');
    L.push('*Material didático*');
    L.push(CALC.parcM>1?(CALC.parcM+'x de '+money(R.parcMat)):('À vista: '+money(R.matDesc)));
  }

  if(R.taxa>0){
    L.push('');
    L.push('*Taxa de matrícula*');
    L.push(money(R.taxa));
  }

  if(CALC.validade){
    L.push('');
    L.push('Proposta válida até '+brDate(CALC.validade)+'.');
  }
  return L.join('\n');
}

function wireCalc(){
  const bind=function(id,ev,fn){
    const el=$(id);if(!el)return;
    el[ev]=function(e){fn(e.target);renderCalc();};
  };
  bind('c_n1','onchange',function(t){CALC.n1=t.value;if(!CALC.dois)CALC.n2=t.value;});
  bind('c_d1','onchange',function(t){CALC.d1=parseInt(t.value,10);});
  bind('c_dois','onchange',function(t){CALC.dois=t.checked;if(t.checked&&!CALC.n2)CALC.n2=CALC.n1;});
  bind('c_n2','onchange',function(t){CALC.n2=t.value;});
  bind('c_d2','onchange',function(t){CALC.d2=parseInt(t.value,10);});
  bind('c_mat','onchange',function(t){CALC.mat=t.checked;});
  bind('c_dm1','onchange',function(t){CALC.dm1=parseInt(t.value,10);});
  bind('c_dm2','onchange',function(t){CALC.dm2=parseInt(t.value,10);});
  bind('c_parcC','onchange',function(t){CALC.parcC=parseInt(t.value,10);});
  bind('c_parcM','onchange',function(t){CALC.parcM=parseInt(t.value,10);});
  /* taxa e validade nao reconstroem os campos, so o bloco de resultado */
  const taxa=$('c_taxa');
  if(taxa)taxa.oninput=function(e){CALC.matricula=maskMoeda(e.target);atualizaResultado();};
  const val=$('c_val');
  if(val)val.onchange=function(e){CALC.validade=e.target.value;};

  wireResultado();
}

function atualizaResultado(){
  const box=$('cresult');
  if(!box)return;
  box.innerHTML=resultadoHTML(calcular());
  wireResultado();
}

function wireResultado(){
  if($('c_reset'))$('c_reset').onclick=function(){CALC.d1=0;CALC.d2=0;CALC.dm1=0;CALC.dm2=0;renderCalc();};

  if($('c_copy'))$('c_copy').onclick=function(){
    const txt=propostaTexto(calcular());
    const done=function(){const m=$('c_msg');if(m){m.textContent='Copiado ✓';setTimeout(function(){if($('c_msg'))$('c_msg').textContent='';},2200);}};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){fallbackCopy(txt);done();});
    }else{fallbackCopy(txt);done();}
  };
}

function fallbackCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}

  $('stats').innerHTML='';
  const board=$('board');
  board.innerHTML='<div class="loading">Carregando equipe...</div>';
  let users;
  try{
    users=await api('/crm_usuarios?select=*&order=nome.asc');
  }catch(e){
    board.innerHTML='<div class="loading">Não foi possível carregar a equipe.</div>';return;
  }
  board.innerHTML='<div class="eq">'+
    '<div class="rcard"><h3>Equipe · quem acessa o CRM</h3><div id="eqlist">'+
    users.map(function(u){
      return '<div class="eqrow'+(u.ativo?'':' inativo')+'" data-id="'+u.id+'">'+
        '<span class="avatar" style="background:'+(u.cor||'#5A5A5A')+'">'+esc(u.nome[0])+'</span>'+
        '<span class="en">'+esc(u.nome)+'</span>'+
        (u.admin?'<span class="badge">Admin</span>':'')+
        (u.ativo?'':'<span class="badge off">Inativo</span>')+
        '<span class="ebtns">'+
          '<button class="btn" data-a="pin">Trocar PIN</button>'+
          '<button class="btn" data-a="cor">Cor</button>'+
          (u.nome!==currentUser?'<button class="btn" data-a="admin">'+(u.admin?'Tirar admin':'Tornar admin')+'</button>':'')+
          (u.nome!==currentUser?'<button class="btn" data-a="ativo">'+(u.ativo?'Desativar':'Reativar')+'</button>':'')+
        '</span>'+
        '<input type="color" data-a="corpick" value="'+(u.cor||'#5A5A5A')+'" style="position:absolute;opacity:0;width:1px;height:1px;border:0;padding:0">'+
      '</div>';
    }).join('')+
    '</div></div>'+
    '<div class="rcard"><h3>Adicionar pessoa</h3>'+
      '<div class="eqform">'+
        '<input type="text" id="nun" placeholder="Nome">'+
        '<input type="password" id="nup" inputmode="numeric" maxlength="8" placeholder="PIN">'+
        '<input type="color" id="nuc" value="#1E7A46">'+
        '<button class="btn primary" id="nuok">Adicionar à equipe</button>'+
      '</div>'+
      '<p class="eqnote">O nome é a assinatura da pessoa nos registros e não pode ser alterado depois (pra não descasar do histórico). Quem sai da equipe deve ser <b>desativado</b>, não excluído: o histórico continua no nome dela, mas o acesso é bloqueado na hora. Todas as ações aqui gravam direto no banco.</p>'+
    '</div>'+
  '</div>';

  const list=board.querySelector('#eqlist');
  users.forEach(function(u){
    const row=list.querySelector('[data-id="'+u.id+'"]');
    row.querySelectorAll('button').forEach(function(b){
      b.onclick=async function(){
        const a=b.dataset.a;
        try{
          if(a==='pin'){
            const pin=window.prompt('Novo PIN de '+u.nome+' (números, 4 a 8 dígitos):');
            if(pin==null)return;
            if(!/^[0-9]{4,8}$/.test(pin.trim())){toast('PIN inválido: use de 4 a 8 números.');return;}
            const hash=await sha256(pin.trim());
            await api('/crm_usuarios?id=eq.'+u.id,{method:'PATCH',body:JSON.stringify({pin_hash:hash})});
            toast('PIN de '+u.nome+' atualizado.');
          }else if(a==='cor'){
            const pick=row.querySelector('[data-a=corpick]');
            pick.onchange=async function(){
              await api('/crm_usuarios?id=eq.'+u.id,{method:'PATCH',body:JSON.stringify({cor:pick.value})});
              await loadUsers();openTeam();
            };
            pick.click();
          }else if(a==='admin'){
            await api('/crm_usuarios?id=eq.'+u.id,{method:'PATCH',body:JSON.stringify({admin:!u.admin})});
            await loadUsers();openTeam();
          }else if(a==='ativo'){
            if(u.ativo&&!window.confirm('Desativar '+u.nome+'? A pessoa perde o acesso na hora; o histórico dela continua registrado.'))return;
            await api('/crm_usuarios?id=eq.'+u.id,{method:'PATCH',body:JSON.stringify({ativo:!u.ativo})});
            await loadUsers();openTeam();
          }
        }catch(e){toast('Não foi possível salvar. Tente de novo.');}
      };
    });
  });

  board.querySelector('#nuok').onclick=async function(){
    const nome=board.querySelector('#nun').value.trim();
    const pin=board.querySelector('#nup').value.trim();
    const cor=board.querySelector('#nuc').value;
    if(!nome){toast('Digite o nome.');return;}
    if(!/^[0-9]{4,8}$/.test(pin)){toast('PIN inválido: use de 4 a 8 números.');return;}
    if(USERS.some(function(x){return x.nome.toLowerCase()===nome.toLowerCase();})){toast('Já existe alguém com esse nome.');return;}
    try{
      const hash=await sha256(pin);
      await api('/crm_usuarios',{method:'POST',body:JSON.stringify({nome:nome,pin_hash:hash,cor:cor})});
      toast(nome+' agora faz parte da equipe.');
      await loadUsers();openTeam();
    }catch(e){toast('Não foi possível adicionar. Tente de novo.');}
  };
}

BOOT();

/* ================= Turmas (mapa de turmas) ================= */
var TURMAS=[], tFiltroDia='', tFiltroProf='', tBusca='', tSoVaga=false, tEdit=null, tSemestre='2026.2';
var T_DIAS=['SEG/QUA','TER/QUI','SEX','SÁB'];

function tVagas(t){
  if(t.sem_vaga)return 0;
  return Math.max(0,(t.capacidade||16)-(t.alunos||0));
}

async function openTurmas(){
  $('stats').innerHTML='';
  $('board').innerHTML='<div class="loading">Carregando mapa de turmas...</div>';
  try{
    TURMAS=await api('/crm_turmas?select=*&ativa=eq.true&order=dias.asc,horario.asc,sala.asc')||[];
  }catch(e){
    $('board').innerHTML='<div class="loading">Não foi possível carregar o mapa de turmas.</div>';return;
  }
  tEdit=null;renderTurmas();
}

function tFiltradas(){
  var q=tBusca.trim().toLowerCase();
  return TURMAS.filter(function(t){
    if(t.semestre!==tSemestre)return false;
    if(tFiltroDia&&t.dias!==tFiltroDia)return false;
    if(tFiltroProf&&(t.professor||'')!==tFiltroProf)return false;
    if(tSoVaga&&tVagas(t)<=0)return false;
    if(!q)return true;
    return ((t.curso||'')+' '+(t.codigo||'')+' '+(t.professor||'')+' '+(t.sala||'')+' '+(t.horario||'')).toLowerCase().indexOf(q)>-1;
  });
}

var tView='grade';
var T_SALAS=['SALA 1','SALA 2','SALA 3','SALA 4','SALA 5','SALA 6','AUDITÓRIO','GARDEN'];

function tMin(hr){
  var m=String(hr||'').match(/(\d{1,2}):(\d{2})/);
  return m?(parseInt(m[1],10)*60+parseInt(m[2],10)):0;
}

/* agrupa horarios proximos na mesma linha, como na planilha
   (ex.: "17:45 - 19:10" e "18:00 - 19:00" sao a mesma faixa) */
function tFaixas(turmas){
  var hs=[];
  turmas.forEach(function(t){if(hs.indexOf(t.horario)<0)hs.push(t.horario);});
  hs.sort(function(a,b){return tMin(a)-tMin(b);});
  var out=[];
  hs.forEach(function(h){
    var ult=out[out.length-1];
    if(ult&&tMin(h)-tMin(ult.horarios[0])<=20){ult.horarios.push(h);}
    else{out.push({horarios:[h]});}
  });
  return out;
}

function renderTurmas(){
  var adm=isAdmin();
  var lista=tFiltradas();
  var profs=[];
  TURMAS.forEach(function(t){if(t.professor&&profs.indexOf(t.professor)<0)profs.push(t.professor);});
  profs.sort();

  var totAl=0,comVaga=0,vagasTot=0;
  lista.forEach(function(t){totAl+=(t.alunos||0);var v=tVagas(t);if(v>0){comVaga++;vagasTot+=v;}});

  var h='<div class="pane">';
  h+='<div class="paneh"><h3>Mapa de turmas '+esc(tSemestre)+'</h3>';
  h+='<div class="tviews">';
  h+='<button class="tchip'+(tView==='grade'?' on':'')+'" data-view="grade">Grade</button>';
  h+='<button class="tchip'+(tView==='lista'?' on':'')+'" data-view="lista">Lista</button>';
  h+='</div>';
  if(adm)h+='<button class="btn primary" id="tnova" style="margin-left:8px">+ Nova turma</button>';
  h+='</div>';

  h+='<div class="tfilters">';
  h+='<input type="text" id="tq" placeholder="Buscar curso, código, professor ou sala..." value="'+esc(tBusca)+'">';
  h+='<select id="tprof"><option value="">Todos os professores</option>';
  profs.forEach(function(p){h+='<option value="'+esc(p)+'"'+(tFiltroProf===p?' selected':'')+'>'+esc(p)+'</option>';});
  h+='</select></div>';

  h+='<div class="tchips" style="margin-bottom:14px">';
  h+='<button class="tchip'+(tFiltroDia===''?' on':'')+'" data-dia="">Todos os dias</button>';
  T_DIAS.forEach(function(d){
    var n=TURMAS.filter(function(t){return t.semestre===tSemestre&&t.dias===d;}).length;
    if(!n)return;
    h+='<button class="tchip'+(tFiltroDia===d?' on':'')+'" data-dia="'+esc(d)+'">'+esc(d)+' ('+n+')</button>';
  });
  h+='<button class="tchip'+(tSoVaga?' on':'')+'" id="tvaga">Só com vaga</button>';
  h+='</div>';

  h+='<div class="tsum"><b>'+lista.length+'</b> turmas · <b>'+totAl+'</b> alunos · <b>'+comVaga+'</b> turmas com vaga (<b>'+vagasTot+'</b> vagas livres)</div>';

  if(tEdit&&tView==='grade'){
    var alvo=TURMAS.filter(function(x){return x.id===tEdit;})[0];
    if(alvo){
      h+='<div class="tformpanel"><h5>'+(alvo.__nova?'Nova turma':'Editando '+esc(alvo.curso)+(alvo.codigo?' · '+esc(alvo.codigo):''))+'</h5>';
      h+=tCardForm(alvo)+'</div>';
    }
  }

  if(!lista.length){
    h+='<div class="empty">Nenhuma turma encontrada com esses filtros.</div>';
  }else if(tView==='grade'){
    h+=tGrade(lista,adm);
  }else{
    h+=tLista(lista,adm);
  }
  h+='</div>';
  $('board').innerHTML=h;
  tBind();
}

/* ---- visão grade: uma tabela por bloco de dias, salas nas colunas ---- */
function tGrade(lista,adm){
  var h='';
  T_DIAS.forEach(function(d){
    /* usa TODAS as turmas do dia para montar a moldura, e marca as
       filtradas como atenuadas — assim a grade nao "pula" com filtro */
    var todas=TURMAS.filter(function(t){return t.semestre===tSemestre&&t.dias===d&&!t.__nova;});
    if(!todas.length)return;
    var ids={};lista.forEach(function(t){ids[t.id]=1;});
    if(!todas.some(function(t){return ids[t.id];}))return;

    var salas=T_SALAS.filter(function(sl){
      return todas.some(function(t){return t.sala===sl;});
    });
    todas.forEach(function(t){if(salas.indexOf(t.sala)<0)salas.push(t.sala);});

    var faixas=tFaixas(todas);
    var nDia=todas.filter(function(t){return ids[t.id];}).length;

    h+='<div class="tcap">'+esc(d)+' <span>'+nDia+' turma'+(nDia>1?'s':'')+'</span></div>';
    h+='<div class="twrap"><table class="tmap" style="min-width:'+(112+salas.length*158)+'px"><thead><tr><th class="thr">Horários</th>';
    salas.forEach(function(sl){h+='<th>'+esc(sl)+'</th>';});
    h+='</tr></thead><tbody>';

    faixas.forEach(function(f){
      h+='<tr><td class="thr">'+f.horarios.map(esc).join('<br>')+'</td>';
      salas.forEach(function(sl){
        var nesta=todas.filter(function(t){
          return t.sala===sl && f.horarios.indexOf(t.horario)>-1;
        });
        if(!nesta.length){h+='<td><div class="tcell empty"></div></td>';return;}
        h+='<td>';
        nesta.forEach(function(t){h+=tCelula(t,adm,!ids[t.id]);});
        h+='</td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table></div>';
  });
  return h;
}

function tCelula(t,adm,dim){
  var v=tVagas(t);
  var cls=t.sem_vaga?'cheia':(v>=9?'vaga':'');
  if(tEdit===t.id)cls='editando';
  else if(dim)cls+=' dim';
  var badge=t.sem_vaga
    ? '<span class="tbadge no">Sem vaga</span>'
    : (v>0?'<span class="tbadge'+(v>=9?' ok':'')+'">'+v+'</span>':'<span class="tbadge no">Lotada</span>');
  var h='<div class="tcell '+cls+'">';
  h+='<div class="cn">'+esc(t.curso)+(t.codigo?' <span class="cc">'+esc(t.codigo)+'</span>':'')+'</div>';
  h+='<div class="cp">'+esc(t.professor||'sem professor')+'</div>';
  h+='<div class="cb"><span class="cq">'+(t.alunos||0)+'/'+(t.capacidade||16)+'</span>'+badge+'</div>';
  if(t.obs)h+='<div class="tobs">'+esc(t.obs)+'</div>';
  if(adm)h+='<div class="ce"><button class="btn" data-ed="'+t.id+'">Editar</button></div>';
  h+='</div>';
  return h;
}

/* ---- visão lista (mantida) ---- */
function tLista(lista,adm){
  var h='';
  T_DIAS.forEach(function(d){
    var doDia=lista.filter(function(t){return t.dias===d;});
    if(!doDia.length)return;
    h+='<div class="tblock"><h4>'+esc(d)+'</h4>';
    var horas=[];
    doDia.forEach(function(t){if(horas.indexOf(t.horario)<0)horas.push(t.horario);});
    horas.sort(function(a,b){return tMin(a)-tMin(b);});
    horas.forEach(function(hr){
      h+='<div class="thora">'+esc(hr)+'</div><div class="tgrid">';
      doDia.filter(function(t){return t.horario===hr;}).forEach(function(t){h+=tCard(t,adm);});
      h+='</div>';
    });
    h+='</div>';
  });
  return h;
}

function tCard(t,adm){
  if(tEdit===t.id)return '<div class="tcard" style="grid-column:1/-1">'+tCardForm(t)+'</div>';
  var v=tVagas(t);
  var cls=t.sem_vaga?'cheia':(v>=9?'vaga':'');
  var badge=t.sem_vaga
    ? '<span class="tbadge no">Sem vaga</span>'
    : (v>0?'<span class="tbadge'+(v>=9?' ok':'')+'">'+v+' vaga'+(v>1?'s':'')+'</span>':'<span class="tbadge no">Lotada</span>');
  var h='<div class="tcard '+cls+'">';
  h+='<div class="tc1"><span class="tcurso">'+esc(t.curso)+'</span>';
  if(t.codigo)h+='<span class="tcod">'+esc(t.codigo)+'</span>';
  h+='</div>';
  h+='<div class="tc2"><span>'+esc(t.sala)+'</span><span>·</span><span>'+esc(t.professor||'sem professor')+'</span><span>·</span><span>'+(t.alunos||0)+'/'+(t.capacidade||16)+'</span>'+badge+'</div>';
  if(t.obs)h+='<div class="tobs">'+esc(t.obs)+'</div>';
  if(adm)h+='<div class="tedit"><button class="btn" data-ed="'+t.id+'">Editar</button></div>';
  h+='</div>';
  return h;
}

function tCardForm(t){
  var nova=!t.id;
  function inp(k,l,tipo,full){
    return '<label class="'+(full?'full':'')+'">'+l+'<input type="'+(tipo||'text')+'" data-f="'+k+'" value="'+esc(t[k]==null?'':t[k])+'"></label>';
  }
  var h='<div class="tform">';
  h+='<label>Dias<select data-f="dias">';
  T_DIAS.forEach(function(d){h+='<option value="'+d+'"'+(t.dias===d?' selected':'')+'>'+d+'</option>';});
  h+='</select></label>';
  h+=inp('horario','Horário');
  h+=inp('sala','Sala');
  h+=inp('curso','Curso');
  h+=inp('codigo','Código');
  h+=inp('professor','Professor');
  h+=inp('alunos','Alunos','number');
  h+=inp('capacidade','Capacidade','number');
  h+='<label>Vagas<select data-f="sem_vaga"><option value="false"'+(t.sem_vaga?'':' selected')+'>Aceita aluno</option><option value="true"'+(t.sem_vaga?' selected':'')+'>Sem vaga</option></select></label>';
  h+=inp('obs','Observação','text',true);
  h+='<div class="tfbtns">';
  h+='<button class="btn primary" id="tsave">Salvar</button>';
  h+='<button class="btn" id="tcancel">Cancelar</button>';
  h+='<div class="spacer"></div>';
  if(!nova)h+='<button class="btn" id="tdel" style="color:var(--red)">Excluir</button>';
  h+='</div></div>';
  return h;
}

function tBind(){
  var q=$('tq');
  if(q)q.oninput=function(){tBusca=q.value;var p=q.selectionStart;renderTurmas();var n=$('tq');if(n){n.focus();try{n.setSelectionRange(p,p);}catch(_){}}};
  var pr=$('tprof');
  if(pr)pr.onchange=function(){tFiltroProf=pr.value;renderTurmas();};
  document.querySelectorAll('.tchip[data-view]').forEach(function(b){
    b.onclick=function(){tView=b.dataset.view;renderTurmas();};
  });
  var vg=$('tvaga');
  if(vg)vg.onclick=function(){tSoVaga=!tSoVaga;renderTurmas();};
  document.querySelectorAll('.tchip[data-dia]').forEach(function(b){
    b.onclick=function(){tFiltroDia=b.dataset.dia;renderTurmas();};
  });
  var nv=$('tnova');
  if(nv)nv.onclick=function(){
    tEdit='__nova__';
    TURMAS.unshift({id:'__nova__',semestre:tSemestre,dias:'SEG/QUA',horario:'',sala:'',curso:'',codigo:'',professor:'',alunos:0,capacidade:16,sem_vaga:false,obs:'',ativa:true,__nova:true});
    renderTurmas();
  };
  document.querySelectorAll('[data-ed]').forEach(function(b){
    b.onclick=function(){tEdit=b.dataset.ed;renderTurmas();};
  });
  var sv=$('tsave');
  if(sv)sv.onclick=tSalvar;
  var cc=$('tcancel');
  if(cc)cc.onclick=function(){
    TURMAS=TURMAS.filter(function(t){return !t.__nova;});
    tEdit=null;renderTurmas();
  };
  var dl=$('tdel');
  if(dl)dl.onclick=tExcluir;
}

function tColeta(){
  var o={};
  document.querySelectorAll('.tform [data-f]').forEach(function(el){
    var k=el.dataset.f,v=el.value;
    if(k==='alunos'||k==='capacidade')v=parseInt(v,10)||0;
    else if(k==='sem_vaga')v=(v==='true');
    else v=(v===''?null:v);
    o[k]=v;
  });
  return o;
}

async function tSalvar(){
  var o=tColeta();
  if(!o.curso||!o.horario||!o.sala){toast('Curso, horário e sala são obrigatórios.');return;}
  var atual=TURMAS.filter(function(t){return t.id===tEdit;})[0];
  var btn=$('tsave');if(btn){btn.disabled=true;btn.textContent='Salvando...';}
  try{
    if(atual&&atual.__nova){
      o.semestre=tSemestre;o.ativa=true;
      TCACHE=null;
      await api('/crm_turmas',{method:'POST',body:JSON.stringify(o)});
      toast('Turma criada.');
    }else{
      o.atualizado_em=new Date().toISOString();
      TCACHE=null;
      await api('/crm_turmas?id=eq.'+tEdit,{method:'PATCH',body:JSON.stringify(o)});
      toast('Turma atualizada.');
    }
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Salvar';}
    toast('Erro ao salvar: '+e.message);return;
  }
  tEdit=null;openTurmas();
}

async function tExcluir(){
  if(!confirm('Excluir esta turma do mapa?'))return;
  try{
    TCACHE=null;
    await api('/crm_turmas?id=eq.'+tEdit,{method:'DELETE'});
    toast('Turma excluída.');
  }catch(e){toast('Erro ao excluir: '+e.message);return;}
  tEdit=null;openTurmas();
}

</script>
