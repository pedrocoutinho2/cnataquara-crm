<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM CNA Taquara · Escolas, Empresas e Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E6143C; --redDark:#A30E2A; --blue:#19408B; --ink:#1A1A1A;
  --gray:#5A5A5A; --line:#E4E4E7; --surface:#F7F7F9; --white:#FFFFFF;
  --ok:#1E7A46; --off:#8A8A8E;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
@supports(height:100dvh){html,body{height:100dvh}}
body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--ink);font-size:14px;display:flex;flex-direction:column;max-width:100vw}
html,body{overflow-x:hidden}
@supports(overflow:clip){html,body{overflow-x:clip}}
body.modal-open{overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* ===== Header ===== */
header{background:var(--white);border-bottom:3px solid var(--red);padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .cna{font-family:'Poppins';font-weight:700;font-size:22px;color:var(--red);letter-spacing:.5px}
.brand .sub{font-family:'Poppins';font-weight:600;font-size:13px;color:var(--blue)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;max-width:100%;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}

/* ===== Menu hamburguer + gaveta (mobile) ===== */
.mbtn{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;align-items:center;justify-content:center;font-size:19px;color:var(--ink);line-height:1;flex:none}
.drawer{position:fixed;inset:0;z-index:120;visibility:hidden;transition:visibility 0s linear .24s}
.drawer.open{visibility:visible;transition-delay:0s}
.dbg{position:absolute;inset:0;background:rgba(26,26,26,.45);opacity:0;transition:opacity .24s ease}
.drawer.open .dbg{opacity:1}
.dpanel{position:absolute;top:0;left:0;bottom:0;width:min(80vw,320px);background:#fff;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .24s cubic-bezier(.32,.72,0,1);box-shadow:4px 0 24px rgba(26,26,26,.18);
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  padding-left:calc(14px + env(safe-area-inset-left))}
.drawer.open .dpanel{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:2px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.dhead .dinfo{display:flex;flex-direction:column;min-width:0}
.dhead .dinfo b{font-family:'Poppins';font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead .dinfo span{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.dhead .avatar{width:34px;height:34px;font-size:14px}
.dx{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:50%;width:32px;height:32px;font-size:14px;color:var(--gray);line-height:1;flex:none}
.dnav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0}
.dnav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:none;
  border-radius:11px;padding:13px 12px;font-family:'Poppins';font-weight:600;font-size:14.5px;color:var(--ink)}
.dnav button i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dnav button.on{background:var(--red);color:#fff}
.dnav button.on i{background:#fff}
.dfoot{border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.dfoot .btn{width:100%;padding:12px}
.tabs button{border:none;background:transparent;padding:7px 20px;border-radius:999px;font-family:'Poppins';font-weight:600;font-size:13px;color:var(--gray);flex:0 0 auto;white-space:nowrap}
.tabs button.on{background:var(--red);color:#fff}
.hright{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stats{display:flex;gap:16px}
.stat{text-align:center}
.stat b{display:block;font-family:'Poppins';font-size:17px;color:var(--blue);line-height:1.1}
.stat span{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.userbox{display:flex;align-items:center;gap:7px}
.userbox label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.userbox select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;font-weight:600;color:var(--blue)}
#logout{padding:5px 10px;font-size:12px}

/* ===== Toolbar ===== */
.toolbar{padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--gray)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.resp.on{background:var(--rc,var(--blue));border-color:var(--rc,var(--blue))}
.fbadge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:4px;display:inline-block}
#fbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
#fbtn.on .fbadge{background:#fff;color:var(--blue)}
.fpanel{display:none;margin:0 18px 10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;flex-wrap:wrap;gap:18px;align-items:flex-start}
.fpanel.open{display:flex}
.fgroup{display:flex;flex-direction:column;gap:7px;min-width:140px}
.fglabel{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.drange{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drange input[type=date]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;background:#fff;color:var(--ink)}
.drange input[type=date].on{border-color:var(--blue);background:#F0F4FD}
.drange span{font-size:11px;color:var(--gray)}
.factions{display:flex;align-items:flex-end;margin-left:auto}
.fsel{border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;background:#fff;color:var(--ink);min-width:150px}
.fsel.on{border-color:var(--blue);background:#F0F4FD;font-weight:600;color:var(--blue)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--redDark)}
.btn.danger{color:var(--redDark);border-color:#F1C2CC}
.btn.danger.confirm{background:var(--redDark);border-color:var(--redDark);color:#fff}

/* ===== Navegador de etapas (mobile) ===== */
.stagenav{display:none;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stagenav::-webkit-scrollbar{display:none}
.stagenav:empty{display:none}
.stagenav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--gray);white-space:nowrap;display:flex;align-items:center;gap:6px}
.stagenav button i{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--blue));display:block;flex:none}
.stagenav button b{font-weight:700;color:var(--ink)}
.stagenav button.on{border-color:var(--sc,var(--blue));background:var(--sc,var(--blue));color:#fff}
.stagenav button.on i{background:#fff}
.stagenav button.on b{color:#fff}

/* ===== Board ===== */
.board{flex:1;min-height:0;display:flex;gap:12px;padding:4px 18px 20px;overflow:auto;align-items:flex-start}
.board::-webkit-scrollbar{height:11px;width:11px}
.board::-webkit-scrollbar-thumb{background:#C4C4CB;border-radius:999px;border:2px solid var(--surface)}
.board::-webkit-scrollbar-thumb:hover{background:#A9A9B2}
.board::-webkit-scrollbar-track{background:transparent}
.col{background:#EFEFF2;border-radius:14px;min-width:262px;width:262px;flex:0 0 auto;display:flex;flex-direction:column;max-height:100%}
.colh{padding:11px 13px 9px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--cc,var(--blue));position:sticky;top:0;background:#EFEFF2;border-radius:14px 14px 0 0;z-index:1}
.colh h2{font-family:'Poppins';font-size:12.5px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.4px}
.colh .n{margin-left:auto;background:#fff;border-radius:999px;font-size:11px;font-weight:600;color:var(--gray);padding:2px 8px}
.cards{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0}
.col.drop{outline:2px dashed var(--blue);outline-offset:-3px;background:#F0F4FD}
.col.ok.drop{outline-color:var(--ok);background:#F0FAF4}

.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card[draggable=true]{cursor:grab}
.card.dragging{opacity:.45;cursor:grabbing}
.card .top{display:flex;align-items:flex-start;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:4px}
.dot.p1{background:var(--red)}.dot.p2{background:var(--blue)}.dot.p3{background:#B9B9BE}
.card h3{font-size:13.5px;font-weight:600;line-height:1.25;flex:1}
.avatar{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:'Poppins'}
.card .meta{font-size:11.5px;color:var(--gray);margin:5px 0 7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.card .meta .sep{color:#C9C9CE}
.tag{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:10.5px}
.acts{display:flex;gap:6px;align-items:center}
.acts a{text-decoration:none;font-size:11.5px;font-weight:600;border-radius:8px;padding:5px 9px;display:inline-flex;align-items:center;gap:4px}
.wa{background:#E8F7EE;color:var(--ok)}
.tel{background:#EDF2FB;color:var(--blue)}
.ig{background:#FDEEF2;color:var(--redDark)}
.mv{margin-left:auto;display:flex;gap:3px}
.mv button{border:1px solid var(--line);background:#fff;border-radius:7px;width:26px;height:26px;font-size:12px;color:var(--gray)}
.mv button:hover{background:var(--blue);color:#fff;border-color:var(--blue)}

.empty{color:var(--gray);font-size:12px;text-align:center;padding:14px 6px}
.col.res{min-width:min(100%,420px);width:min(100%,420px);flex:1 1 auto}
.stg{border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:600;color:#fff;background:var(--sc,#5A5A5A)}
.dupw{background:#FFF3D6;border:1px solid #E9C46A;color:#8A5A00;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:600}

/* ===== Modal ===== */
.ov{position:fixed;inset:0;background:rgba(26,26,26,.45);display:none;align-items:center;justify-content:center;padding:24px 14px;z-index:50}
.ov.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:680px;margin:0;display:flex;flex-direction:column;max-height:calc(100% - 8px)}
.mhead{padding:20px 20px 0;position:relative;flex:0 0 auto}
.mbody{padding:14px 20px 0;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.mx{display:none;position:absolute;top:14px;right:14px;border:1px solid var(--line);background:#fff;border-radius:50%;width:34px;height:34px;font-size:15px;color:var(--gray);line-height:1}
.modal h2{font-family:'Poppins';font-size:18px;color:var(--red);margin-bottom:2px;padding-right:40px}
.modal .msub{font-size:12px;color:var(--gray)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
.f label{display:block;font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.f textarea{min-height:64px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
.mfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:0 0 auto;padding:14px 20px 20px;border-top:1px solid var(--line)}
.savedmsg{color:var(--ok);font-weight:600;font-size:13px;display:none}

/* interações */
.ints{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.ints h3{font-family:'Poppins';font-size:14px;color:var(--blue);margin-bottom:10px}
.iadd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.iadd select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.iadd input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.ilist{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto}
.int{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.int .ih{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--gray);margin-bottom:3px}
.int .ih b{color:var(--blue);font-size:11px}
.int .itipo{background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.int p{font-size:13px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;z-index:99;display:none}

/* ===== Relatório de funil ===== */
.rmodal{max-width:760px}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rhead select{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;font-weight:600;color:var(--blue)}
.rkpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.rkpi{flex:1;min-width:110px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.rkpi b{display:block;font-family:'Poppins';font-size:22px;color:var(--blue);line-height:1.15}
.rkpi.ok b{color:var(--ok)}
.rkpi.bad b{color:var(--redDark)}
.rkpi span{font-size:10.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.rsec{margin-bottom:18px}
.rsec h3{font-family:'Poppins';font-size:13.5px;color:var(--red);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.fun{display:flex;flex-direction:column;gap:6px}
.frow{display:grid;grid-template-columns:150px 1fr 74px;gap:8px;align-items:center;font-size:12.5px}
.frow .fl{color:var(--ink);font-weight:600;text-align:right}
.frow .fb{background:var(--surface);border-radius:6px;height:20px;overflow:hidden}
.frow .fb i{display:block;height:100%;border-radius:6px;background:var(--bc,var(--blue));min-width:2px}
.frow .fn{color:var(--gray)}
.rtabw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.rtab{width:100%;border-collapse:collapse;font-size:12.5px;min-width:340px}
.rtab th{background:var(--blue);color:#fff;font-family:'Poppins';font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:7px 9px;text-align:left}
.rtab td{padding:7px 9px;border-bottom:1px solid var(--line)}
.rtab tr:nth-child(even) td{background:var(--surface)}
.rtab .num{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:640px){.frow{grid-template-columns:105px 1fr 64px}}

/* ===== Login ===== */
.login{position:fixed;inset:0;background:var(--surface);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.login.off{display:none}
.lbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 26px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(26,26,26,.08)}
.lbrand{display:flex;align-items:baseline;gap:8px;justify-content:center;margin-bottom:6px}
.lbrand .cna{font-family:'Poppins';font-weight:700;font-size:28px;color:var(--red)}
.lbrand .sub{font-family:'Poppins';font-weight:600;font-size:14px;color:var(--blue)}
.lmsg{font-size:13px;color:var(--gray);margin:10px 0 14px}
.lusers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.lusers button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-family:'Poppins';font-weight:600;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:7px}
.lusers button.on{border-color:var(--uc);background:var(--uc);color:#fff}
.lusers .ldot{width:10px;height:10px;border-radius:50%;background:var(--uc)}
.lusers button.on .ldot{background:#fff}
.lpin{display:flex;gap:8px;justify-content:center}
.lpin input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:120px;text-align:center;font-size:18px;letter-spacing:4px}
.lerr{color:var(--redDark);font-size:12.5px;min-height:16px;margin-top:10px;font-weight:600}

/* ===== Tela de relatórios ===== */
.rscreen{flex:1;overflow-y:auto;padding:4px 18px 30px}
.rwrap{max-width:860px;margin:0 auto}
.rtitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.rtitle h1{font-family:'Poppins';font-size:19px;color:var(--red)}
.rcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.rcard>h3{font-family:'Poppins';font-size:13.5px;color:var(--red);margin-bottom:12px;text-transform:uppercase;letter-spacing:.4px}
.fnl{display:flex;flex-direction:column}
.fnlrow{display:grid;grid-template-columns:1fr 190px;gap:12px;align-items:center}
.fnlbarwrap{display:flex;justify-content:center}
.fnlbar{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:'Poppins';min-width:70px}
.fnlbar b{font-size:15px;line-height:1.1}
.fnlbar span{font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;opacity:.92}
.fnlinfo{font-size:11.5px;color:var(--gray);line-height:1.45}
.fnlinfo b{color:var(--redDark)}
.fnlinfo i{font-style:normal;color:var(--blue);font-weight:600}
.mgrid{display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding-top:6px}
.mcol{flex:1;min-width:64px;text-align:center}
.mbars{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:110px}
.mbars i{display:block;width:20px;border-radius:4px 4px 0 0}
.mbars .ml{background:var(--blue)}
.mbars .mf{background:var(--ok)}
.mcol .mn{font-size:10.5px;color:var(--gray);margin-top:5px}
.mcol .mv{font-size:11px;font-weight:600;color:var(--ink)}
.mleg{display:flex;gap:14px;font-size:11px;color:var(--gray);margin-top:8px}
.mleg i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.alert{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.alert:last-child{border-bottom:none}
.alert .an{font-weight:600}
.alert .ad{color:var(--redDark);font-weight:600;white-space:nowrap}
@media(max-width:640px){.fnlrow{grid-template-columns:1fr 130px}}

/* ===== Análise do andamento ===== */
.acard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:14px;padding:16px;margin-bottom:14px}
.acard h3{font-family:'Poppins';font-size:13.5px;color:var(--blue);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.acard .asub{font-size:11px;color:var(--gray);margin-bottom:10px}
.acard ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.acard li{font-size:13px;line-height:1.5;padding-left:20px;position:relative}
.acard li:before{content:'';position:absolute;left:4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.acard li.pos:before{background:var(--ok)}
.acard li.neg:before{background:var(--red)}
.acard li b{color:var(--redDark)}
.acard li i{font-style:normal;font-weight:600;color:var(--blue)}

/* ===== Equipe ===== */

  opt=opt||{};
  const headers=Object.assign({
    'apikey':KEY,'Authorization':'Bearer '+KEY,
    'Content-Type':'application/json','Prefer':'return=representation'
  },opt.headers||{});

/* ================= Estado ================= */

const DATA={escolas:null,empresas:null,leads:null};
function emptyFilters(){return {q:'',prio:null,tipo:null,resp:null,ag:null,entradaDe:null,entradaAte:null,proxDe:null,proxAte:null};}
let filters=emptyFilters();
let editing=null;   // id em edição ou null (novo)
let dragId=null;
let DUPWA={};       // whatsapp (só dígitos) -> quantas vezes aparece na base

function safeGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},2600);}

let currentUser=null;
function SF(cfg){return cfg.statusField||'status';}
function NF(cfg){return cfg.nextField||'proximo_contato';}
function addDias(iso,n){const p=String(iso).split('-');const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function isMobile(){return window.matchMedia('(max-width:640px)').matches;}

/* Normaliza telefone pra busca: só dígitos, sem DDI 55 e sem zero de operadora */
function phoneKey(v){
  var d=String(v||'').replace(/\D/g,'');
  if(d.length>11&&d.slice(0,2)==='55')d=d.slice(2);
  if(d.length>11&&d.charAt(0)==='0')d=d.slice(1);
  return d;
}
/* true quando o que foi digitado parece um número de telefone */
function isPhoneQuery(q){
  return /^[\d\s()+.\-]+$/.test(q)&&q.replace(/\D/g,'').length>=4;
}
function TF(cfg){return cfg.tipoField||'tipo';}

/* ================= Carregamento ================= */
async function loadTab(force){
  const cfg=CFG[tab];
  if(DATA[tab]&&!force){render();return;}
  $('board').innerHTML='<div class="loading">Carregando dados do Supabase...</div>';
  try{
    DATA[tab]=await api('/'+cfg.table+'?select=*&order=nome.asc');
    if(tab==='leads')await loadTarefas();
    render();
  }catch(e){
    $('board').innerHTML='<div class="loading">Não foi possível carregar os dados. Verifique a conexão e toque em ↻ para tentar de novo.<br><small>'+esc(e.message).slice(0,180)+'</small></div>';
  }
}

/* ================= Render ================= */
function phone(v){return String(v||'').replace(/\D/g,'');}
function waLink(v){
  let d=phone(v);
  if(!d)return null;
  if((d.length===10||d.length===11)&&d.slice(0,2)!=='55')d='55'+d;
  return 'https://wa.me/'+d;
}
function igLink(v){
  if(!v)return null;
  v=String(v).trim();
  if(v.indexOf('http')===0)return v;
  return 'https://instagram.com/'+v.replace(/^@/,'');
}

function matches(s){
  const cfg=CFG[tab];
  if(filters.prio&&s[cfg.prioField]!==filters.prio)return false;
  if(filters.tipo&&s[TF(cfg)]!==filters.tipo)return false;
  if(filters.resp&&(s.responsavel||'')!==filters.resp)return false;
  if(filters.entradaDe&&(s.data_entrada||'')<filters.entradaDe)return false;
  if(filters.entradaAte&&(s.data_entrada||'9999-99-99')>filters.entradaAte)return false;
  const _nf=NF(CFG[tab]);
  if(filters.proxDe&&(s[_nf]||'')<filters.proxDe)return false;
  if(filters.proxAte&&(s[_nf]||'9999-99-99')>filters.proxAte)return false;
  if(filters.ag){
    const _d=s[_nf]||'',_h=hojeISO();
    if(filters.ag==='atrasado'&&!(_d&&_d<_h))return false;
    if(filters.ag==='hoje'&&_d!==_h)return false;
    if(filters.ag==='semana'&&!(_d&&_d<=addDias(_h,7)))return false;
    if(filters.ag==='sem'&&_d)return false;
  }
  if(filters.q){
    // busca por número: compara só os dígitos, ignorando (), -, espaço e o DDI 55
    if(isPhoneQuery(filters.q)){
      const qk=phoneKey(filters.q);
      const alvo=[s.whatsapp,s.telefone].map(phoneKey);
      if(alvo.some(function(d){return d&&d.indexOf(qk)>-1;}))return true;
    }
    const blob=Object.keys(s).map(function(k){return s[k];}).join(' ').toLowerCase();
    if(blob.indexOf(filters.q)===-1)return false;
  }
  return true;
}

function render(){
  const cfg=CFG[tab];
  const list=(DATA[tab]||[]).filter(matches);

  // stats
  const all=DATA[tab]||[];
  const fechadas=all.filter(function(s){const st=cfg.stages.find(function(x){return x.id===s[SF(cfg)];});return st&&st.ok;}).length;
  const andamento=all.filter(function(s){const st=cfg.stages.find(function(x){return x.id===s[SF(cfg)];});return st&&!st.ok&&!st.off&&s[SF(cfg)]!==cfg.stages[0].id;}).length;
  $('stats').innerHTML=
    '<div class="stat"><b>'+all.length+'</b><span>'+cfg.plural+'</span></div>'+
    '<div class="stat"><b>'+andamento+'</b><span>Em andamento</span></div>'+
    '<div class="stat"><b>'+fechadas+'</b><span>Fechadas</span></div>';

  // WhatsApp repetido (só faz sentido na base de leads)
  DUPWA={};
  if(tab==='leads'){
    const cont={};
    all.forEach(function(s){const k=phoneKey(s.whatsapp);if(k.length>=8)cont[k]=(cont[k]||0)+1;});
    Object.keys(cont).forEach(function(k){if(cont[k]>1)DUPWA[k]=cont[k];});
  }

  const board=$('board');
  board.innerHTML='';

  // No celular, buscar num kanban de 7 colunas é sofrível:
  // com busca ativa mostramos uma lista única de resultados.
  if(isMobile()&&filters.q){
    renderStageNav(null);
    const col=document.createElement('div');
    col.className='col res';
    col.style.setProperty('--cc','#19408B');
    const rot=isPhoneQuery(filters.q)?'Resultados por WhatsApp':'Resultados da busca';
    col.innerHTML='<div class="colh"><h2>'+rot+'</h2><span class="n">'+list.length+'</span></div>';
    const wrap=document.createElement('div');
    wrap.className='cards';
    if(!list.length){wrap.innerHTML='<div class="empty">Nada encontrado para “'+esc(filters.q)+'”.<br>Tente só os 8 últimos dígitos do número.</div>';}
    list.forEach(function(s){
      const st=cfg.stages.find(function(x){return x.id===(s[SF(cfg)]||cfg.stages[0].id);})||cfg.stages[0];
      wrap.appendChild(cardEl(s,st,true));
    });
    col.appendChild(wrap);
    board.appendChild(col);
    return;
  }

  cfg.stages.forEach(function(st){
    const col=document.createElement('div');
    col.className='col'+(st.ok?' ok':'');
    col.dataset.s=st.id;
    col.style.setProperty('--cc',st.c);
    const items=list.filter(function(s){return (s[SF(cfg)]||cfg.stages[0].id)===st.id;});
    col.innerHTML='<div class="colh"><h2>'+esc(st.n)+'</h2><span class="n">'+items.length+'</span></div>';
    const wrap=document.createElement('div');
    wrap.className='cards';
    if(!items.length){wrap.innerHTML='<div class="empty">Nenhum registro</div>';}
    items.forEach(function(s){wrap.appendChild(cardEl(s,st));});
    col.appendChild(wrap);

    // drop target
    col.addEventListener('dragover',function(e){e.preventDefault();col.classList.add('drop');});
    col.addEventListener('dragleave',function(){col.classList.remove('drop');});
    col.addEventListener('drop',function(e){
      e.preventDefault();col.classList.remove('drop');
      if(dragId)moveTo(dragId,st.id);
    });
    board.appendChild(col);
  });

  renderStageNav(list);
}

/* Navegador de etapas — só aparece no celular, onde o kanban rola na horizontal */
function renderStageNav(list){
  const nav=$('stagenav');
  if(!list){nav.innerHTML='';nav.style.display='none';return;}
  const cfg=CFG[tab];
  nav.style.display='';
  nav.innerHTML=cfg.stages.map(function(st,i){
    const n=list.filter(function(s){return (s[SF(cfg)]||cfg.stages[0].id)===st.id;}).length;
    return '<button data-i="'+i+'" style="--sc:'+st.c+'"><i></i>'+esc(st.n)+' <b>'+n+'</b></button>';
  }).join('');
  nav.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      const col=$('board').children[+b.dataset.i];
      if(col)$('board').scrollTo({left:col.offsetLeft-12,behavior:'smooth'});
    };
  });
  syncStageNav();
}

function syncStageNav(){
  const nav=$('stagenav');
  if(!nav.children.length)return;
  const board=$('board');
  const x=board.scrollLeft+board.clientWidth/2;
  let best=0,bd=Infinity;
  for(let i=0;i<board.children.length;i++){
    const c=board.children[i];
    const d=Math.abs(c.offsetLeft+c.offsetWidth/2-x);
    if(d<bd){bd=d;best=i;}
  }
  Array.prototype.forEach.call(nav.children,function(b,i){b.classList.toggle('on',i===best);});
  const at=nav.children[best];
  if(at)nav.scrollTo({left:at.offsetLeft-nav.clientWidth/2+at.offsetWidth/2,behavior:'smooth'});
}

function cardEl(s,st,showStage){

  var agTag='';
  if(_pd){

    else if(_pd===_hj)agTag='<span class="agt today">&#9200; hoje</span>';
    else agTag='<span class="agt soon">&#9200; '+brDate(_pd).slice(0,5)+'</span>';
  }
  var pvTag='';
  if(tab==='leads'){const _pv=pvStatus(s);if(_pv)pvTag='<span class="agt '+_pv.cls+'">&#127891; '+esc(_pv.txt)+'</span>';}
  c.className='card'+(_pd&&_pd<_hj?' late':'');

  const ig=igLink(s.instagram);

  const idx=cfg.stages.findIndex(function(x){return x.id===st.id;});
  const prev=idx>0?cfg.stages[idx-1]:null;
  const next=idx<cfg.stages.length-1?cfg.stages[idx+1]:null;

  c.innerHTML=
    '<div class="top"><span class="dot '+pr[2]+'" title="'+esc(pr[1])+'"></span><h3>'+esc(s.nome)+'</h3>'+av+'</div>'+
    '<div class="meta">'+
      (sub?'<span>'+esc(sub)+'</span>':'')+
      (dec?'<span class="sep">·</span><span>'+esc(dec)+'</span>':'')+
      (s.rating?'<span class="sep">·</span><span>★ '+esc(s.rating)+'</span>':'')+
      '<span class="tag">'+esc((cfg.tipos.find(function(t){return t[0]===s[TF(cfg)];})||['',s[TF(cfg)]||''])[1])+'</span>'+
      (showStage?'<span class="stg" style="--sc:'+st.c+'">'+esc(st.n)+'</span>':'')+
      (dup?'<span class="dupw" title="Esse WhatsApp aparece em '+dup+' cadastros">⚠ '+dup+'x mesmo zap</span>':'')+
      agTag+pvTag+
    '</div>'+
    '<div class="acts">'+
      (wa?'<a class="wa" target="_blank" rel="noopener" href="'+wa+'">WhatsApp</a>':(telD?'<a class="tel" href="tel:+'+(telD.length<=11?'55':'')+telD+'">Ligar</a>':''))+
      (ig?'<a class="ig" target="_blank" rel="noopener" href="'+esc(ig)+'">Insta</a>':'')+
      '<div class="mv">'+
        (prev?'<button title="Voltar para '+esc(prev.n)+'" data-mv="'+prev.id+'">◀</button>':'')+
        (next?'<button title="Avançar para '+esc(next.n)+'" data-mv="'+next.id+'">▶</button>':'')+
      '</div>'+
    '</div>';

  c.addEventListener('dragstart',function(e){
    dragId=s.id;c.classList.add('dragging');

  });
  c.addEventListener('dragend',function(){c.classList.remove('dragging');dragId=null;});
  c.addEventListener('click',function(e){
    const mv=e.target.getAttribute&&e.target.getAttribute('data-mv');

/* ================= Pós-venda (matrícula fechada) ================= */
const NIVEIS=['Yard 1','Yard 2','Garden 1','Garden 2','Garden 3','Garden 4',
  'Fun 1','Fun 2','Fun 3','Fun 4','Kids 1','Kids 2','Kids 3','Kids 4',
  'Teen Up 1','Teen Up 2','Teen Up 3','Teen Up 4','Teen Up 5','Teen Up 6',
  'Fly','Progression','Expansion','Gold','Platinum','Senior','Turbo','ACC',
  'En Contacto 1','En Contacto 2','En Contacto 3','En Contacto 4','En Contacto 5','CAC'];

/* off = dias em relação ao início das aulas · dir = para onde empurrar se cair em fim de semana */
const PV=[
  {tipo:'pos_venda_vespera',n:'Véspera do início',off:-1,dir:-1},
  {tipo:'pos_venda_d7',n:'7 dias de aula',off:7,dir:1},
  {tipo:'pos_venda_d14',n:'14 dias de aula',off:14,dir:1}
];
const PV_RESULT={ok:'Tudo certo',com_ressalva:'Com ressalva',risco_cancelamento:'Risco de cancelamento'};
const PV_CANAL={ligacao:'Ligação',whatsapp:'WhatsApp',presencial:'Presencial'};
let TAREFAS={};   /* lead_id -> [tarefa] */

function pvNome(t){const x=PV.find(function(p){return p.tipo===t;});return x?x.n:'Pós-venda';}
function dowISO(iso){const p=String(iso).split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay();}
function ajustaFDS(iso,dir){
  var d=iso,n=0;
  while((dowISO(d)===0||dowISO(d)===6)&&n<3){d=addDias(d,dir>0?1:-1);n++;}
  return d;
}
function calcPosVenda(inicio){
  return PV.map(function(p){return {tipo:p.tipo,data:ajustaFDS(addDias(inicio,p.off),p.dir)};});
}

async function loadTarefas(){
  try{
    const rows=await api('/crm_tarefas?select=*&order=data_prevista.asc');
    const m={};
    (rows||[]).forEach(function(t){(m[t.lead_id]=m[t.lead_id]||[]).push(t);});
    TAREFAS=m;
  }catch(e){TAREFAS={};}
}

/* Cria ou realinha as tarefas do lead. Idempotente: unique (lead_id,tipo) no banco. */
async function syncPosVenda(lead){
  if(!lead||lead.etapa!=='fechado'||!lead.data_inicio_aulas)return;
  const alvo=calcPosVenda(lead.data_inicio_aulas);
  const atuais=TAREFAS[lead.id]||[];
  const hoje=hojeISO();
  for(var i=0;i<alvo.length;i++){
    const a=alvo[i];
    const ex=atuais.find(function(t){return t.tipo===a.tipo;});
    if(ex){
      if(ex.status==='concluida')continue;                 /* feita fica com a data original */
      if(ex.status==='pendente'&&ex.data_prevista===a.data)continue;
      try{
        const r=await api('/crm_tarefas?id=eq.'+ex.id,{method:'PATCH',body:JSON.stringify({
          status:'pendente',data_prevista:a.data,responsavel:ex.responsavel||lead.responsavel||currentUser,
          updated_at:new Date().toISOString()})});
        if(r&&r[0])Object.assign(ex,r[0]);
      }catch(e){}
      continue;
    }
    /* a véspera só nasce se ainda estiver no futuro */
    if(a.tipo==='pos_venda_vespera'&&a.data<hoje)continue;
    try{
      const r=await api('/crm_tarefas',{method:'POST',body:JSON.stringify({
        lead_id:lead.id,tipo:a.tipo,data_prevista:a.data,
        responsavel:lead.responsavel||currentUser,status:'pendente'})});
      if(r&&r[0])atuais.push(r[0]);
    }catch(e){}
  }
  TAREFAS[lead.id]=atuais;
}

/* Lead saiu de "Matrícula fechada": pendências deixam de fazer sentido. */
async function cancelPosVenda(lead){
  if(!lead)return;
  const atuais=(TAREFAS[lead.id]||[]).filter(function(t){return t.status==='pendente';});
  for(var i=0;i<atuais.length;i++){
    try{
      await api('/crm_tarefas?id=eq.'+atuais[i].id,{method:'PATCH',body:JSON.stringify({status:'cancelada',updated_at:new Date().toISOString()})});
      atuais[i].status='cancelada';
    }catch(e){}
  }
}

/* Sub-status mostrado no card da coluna Matrícula fechada */
function pvStatus(lead){
  if(!lead||lead.etapa!=='fechado')return null;
  if(!lead.data_inicio_aulas)return {txt:'Definir início das aulas',cls:'late'};
  const ts=(TAREFAS[lead.id]||[]).filter(function(t){return t.status==='pendente';})
    .sort(function(a,b){return a.data_prevista<b.data_prevista?-1:1;});
  if(!ts.length)return {txt:'Pós-venda concluído',cls:'done'};
  const t=ts[0],hj=hojeISO();
  return {txt:pvNome(t.tipo)+' · '+brDate(t.data_prevista).slice(0,5),
          cls:t.data_prevista<hj?'late':(t.data_prevista===hj?'today':'soon')};
}

function renderPV(lead){
  const box=$('pvbox');
  if(!box)return;
  if(!lead||lead.etapa!=='fechado'){box.style.display='none';box.innerHTML='';return;}
  box.style.display='';
  if(!lead.data_inicio_aulas){
    box.innerHTML='<h4>Pós-venda</h4><p class="pvsub">Preencha <b>Início das aulas</b>, <b>Nível</b> e <b>Turma</b> acima e salve. '
      +'Os três contatos (véspera, 7 e 14 dias) são agendados automaticamente.</p>';
    return;
  }
  const ts=(TAREFAS[lead.id]||[]).slice().sort(function(a,b){return a.data_prevista<b.data_prevista?-1:1;});
  const hj=hojeISO();
  const linhas=ts.filter(function(t){return t.status!=='cancelada';}).map(function(t){
    const done=t.status==='concluida';
    const cls=done?'ok':(t.data_prevista<hj?'late':'');
    return '<div class="pvi '+cls+'"><b>'+esc(pvNome(t.tipo))+'</b>'
      +(done?'<span class="pvr">'+esc(PV_RESULT[t.resultado]||'feito')+'</span>':'')
      +(done&&t.canal?'<span class="pvr">'+esc(PV_CANAL[t.canal]||t.canal)+'</span>':'')
      +'<span class="pvd">'+brDate(t.data_prevista)+'</span></div>';
  }).join('');
  const prox=ts.filter(function(t){return t.status==='pendente';})[0];
  var form='';
  if(prox){
    form='<div class="pvform" data-tid="'+esc(prox.id)+'">'
      +'<div class="pvrow"><b style="flex:0 0 100%;font-size:13px">Registrar: '+esc(pvNome(prox.tipo))+'</b></div>'
      +'<div class="pvrow">'
      +'<select id="pvres"><option value="">Como foi?</option>'
      +'<option value="ok">Tudo certo</option>'
      +'<option value="com_ressalva">Com ressalva</option>'
      +'<option value="risco_cancelamento">Risco de cancelamento</option></select>'
      +'<select id="pvcanal"><option value="">Canal (opcional)</option>'
      +'<option value="ligacao">Ligação</option><option value="whatsapp">WhatsApp</option>'
      +'<option value="presencial">Presencial</option></select>'
      +'</div>'
      +'<textarea id="pvobs" placeholder="O que o aluno falou? (obrigatório quando não for tudo certo)"></textarea>'
      +'<div class="pvrow"><button class="btn primary" id="pvok">Registrar contato</button></div>'
      +'</div>';
  }
  box.innerHTML='<h4>Pós-venda</h4>'
    +'<p class="pvsub">Início das aulas '+brDate(lead.data_inicio_aulas)
    +(lead.nivel?' · '+esc(lead.nivel):'')+(lead.turma?' · turma '+esc(lead.turma):'')
    +' · responsável '+esc((ts[0]&&ts[0].responsavel)||lead.responsavel||'—')+'</p>'
    +'<div class="pvlist">'+(linhas||'<div class="pvi">Nenhuma tarefa aberta</div>')+'</div>'
    +(form||'<p class="pvsub" style="margin:10px 0 0">Pós-venda concluído.</p>');
  if(prox){$('pvok').onclick=function(){pvConcluir(lead,prox.id);};}
}

async function pvConcluir(lead,tid){
  const btn=$('pvok');
  if(!btn||btn.disabled)return;
  const res=$('pvres').value,canal=$('pvcanal').value,obs=$('pvobs').value.trim();
  if(!res){toast('Escolha como foi o contato.');return;}
  if(res!=='ok'&&!obs){toast('Descreva o que aconteceu antes de registrar.');return;}
  btn.disabled=true;const lbl=btn.textContent;btn.textContent='Registrando…';
  const t=(TAREFAS[lead.id]||[]).find(function(x){return x.id===tid;});
  try{
    const r=await api('/crm_tarefas?id=eq.'+tid,{method:'PATCH',body:JSON.stringify({
      status:'concluida',resultado:res,canal:canal||null,observacao:obs||null,
      concluida_em:new Date().toISOString(),concluida_por:currentUser,
      updated_at:new Date().toISOString()})});
    if(t&&r&&r[0])Object.assign(t,r[0]);
    /* o histórico do lead continua sendo a fonte única de verdade */
    try{
      await api('/crm_leads_interacoes',{method:'POST',body:JSON.stringify({
        lead_id:lead.id,data:hojeISO(),autor:currentUser,tipo:canal==='presencial'?'visita':(canal||'nota'),
        efetivo:true,nota:'Pós-venda ('+pvNome(t?t.tipo:'')+') · '+(PV_RESULT[res]||res)+(obs?' · '+obs:'')})});
      loadInts(lead.id);
    }catch(e){}
    if(res==='risco_cancelamento')toast('Risco de cancelamento registrado. Avise a coordenação hoje.');
    else toast('Pós-venda registrado.');
    renderPV(lead);render();loadAlerts();
  }catch(e){
    toast('Não foi possível registrar. Tente de novo.');
  }finally{if($('pvok')){$('pvok').disabled=false;$('pvok').textContent=lbl;}}
}

/* ================= Ações ================= */
function logEtapa(leadId,etapa){
  api('/crm_leads_etapas',{method:'POST',body:JSON.stringify({lead_id:leadId,etapa:etapa,autor:currentUser})})
    .catch(function(){/* histórico é acessório, não bloqueia */});
}

async function moveTo(id,stage){
  const cfg=CFG[tab];
  const sf=SF(cfg);
  const s=(DATA[tab]||[]).find(function(x){return x.id===id;});
  if(!s||s[sf]===stage)return;
  const old=s[sf];
  const oldFech=s.data_fechamento;
  s[sf]=stage;
  const body={updated_at:new Date().toISOString()};
  body[sf]=stage;
  if(tab==='leads'){
    const st=cfg.stages.find(function(x){return x.id===stage;});
    body.data_fechamento=(st&&(st.ok||st.off))?new Date().toISOString().slice(0,10):null;
    s.data_fechamento=body.data_fechamento;
  }
  render();
  try{
    await api('/'+cfg.table+'?id=eq.'+id,{method:'PATCH',body:JSON.stringify(body)});
    if(tab==='leads')logEtapa(id,stage);
    if(tab==='leads'){
      if(stage==='fechado'){
        if(!s.data_inicio_aulas){toast('Informe início das aulas, nível e turma para abrir o pós-venda.');openModal(id);}
        else{await syncPosVenda(s);render();}
      }else if(old==='fechado'){await cancelPosVenda(s);render();}
    }
    if(tab==='leads'&&stage==='perdido'&&!s.motivo_perda){
      toast('Registre o motivo da perda na ficha.');
      openModal(id);
    }
  }catch(e){
    s[sf]=old;s.data_fechamento=oldFech;render();toast('Não foi possível mover. Tente de novo.');
  }
}

function openModal(id){
  const cfg=CFG[tab];
  editing=id;
  const s=id?(DATA[tab]||[]).find(function(x){return x.id===id;}):null;
  $('mtitle').textContent=s?s.nome:('Nova '+cfg.one);
  $('msub').textContent=tab==='escolas'?'CNA na Escola · Taquara':(tab==='empresas'?'CNA na Empresa e parcerias · Taquara':'Cliente B2C · funil de matrícula');
  const form=$('form');
  form.innerHTML='';
  cfg.fields.forEach(function(f){
    const d=document.createElement('div');
    d.className='f'+(f.full?' full':'');
    let inner='<label>'+esc(f.l)+'</label>';
    const v=s?(s[f.k]==null?'':s[f.k]):'';
    if(f.t==='textarea'){
      inner+='<textarea data-k="'+f.k+'">'+esc(v)+'</textarea>';
    }else if(f.t==='select'||f.t==='stage'){
      const opts=f.t==='stage'?cfg.stages.map(function(x){return [x.id,x.n];}):(typeof f.opts==='function'?f.opts():f.opts);
      inner+='<select data-k="'+f.k+'">'+opts.map(function(o){
        const dv=v||(f.t==='stage'?cfg.stages[0].id:(f.k==='responsavel'?currentUser:o[0]));
        return '<option value="'+esc(o[0])+'"'+(String(dv)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';
      }).join('')+'</select>';
    }else if(f.t==='date'){
      const dv=v||(s?'':(f.def?f.def():''));
      inner+='<input type="date" data-k="'+f.k+'" value="'+esc(dv)+'">';
    }else{
      inner+='<input data-k="'+f.k+'" value="'+esc(v)+'">';
    }
    d.innerHTML=inner;
    form.appendChild(d);
  });
  $('del').style.display=s?'':'none';
  $('del').classList.remove('confirm');$('del').textContent='Excluir';
  $('savedmsg').style.display='none';
  $('ints').style.display=s?'':'none';

  if(s)loadInts(s.id);

  document.body.classList.add('modal-open');
  const mb=document.querySelector('.mbody');
  if(mb)mb.scrollTop=0;
}

function closeModal(){

  document.body.classList.remove('modal-open');

}

function resetIntPanes(){

async function loadInts(id){
  const cfg=CFG[tab];
  const it=cfg.intTable||'crm_interacoes';
  const tx=cfg.intText||'resumo';
  $('ilist').innerHTML='<div class="empty">Carregando...</div>';
  try{
    const ints=await api('/'+it+'?'+cfg.fk+'=eq.'+id+'&select=*&order='+(cfg.intOrder||'data.desc'));
    if(!ints.length){$('ilist').innerHTML='<div class="empty">Nenhum contato registrado ainda</div>';return;}
    var seq=0;
    for(var k=0;k<ints.length;k++){if(ints[k].efetivo===false)seq++;else break;}
    var head='';
    if(seq>=2){
      head='<div class="nestreak'+(seq>=4?' hot':'')+'">'+seq+' tentativas seguidas sem contato efetivo'
        +(seq>=4?' · vale avisar a coordenação antes de insistir de novo':'')+'</div>';
    }
    $('ilist').innerHTML=head+ints.map(function(i){
      let ds;
      if(cfg.intDateOnly){
        ds=String(i.data||'').split('-').reverse().join('/');
      }else{
        const dt=new Date(i.data);
        ds=dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      }

let USERS=[];
let loginSel=null;

function sha256js(ascii){
  function rr(v,c){return (v>>>c)|(v<<(32-c));}
  var mw=Math.pow(2,32),i,j,result='';
  var words=[],len=ascii.length*8;
  var hash=sha256js.h=sha256js.h||[],k=sha256js.k=sha256js.k||[],pc=k.length;
  var isC={};
  for(var cand=2;pc<64;cand++){
    if(!isC[cand]){
      for(i=0;i<313;i+=cand)isC[i]=true;
      hash[pc]=(Math.pow(cand,.5)*mw)|0;
      k[pc++]=(Math.pow(cand,1/3)*mw)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    j=ascii.charCodeAt(i);
    if(j>>8)return'';
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(len/mw)|0;
  words[words.length]=len;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oh=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^(~e&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){
    var b=(hash[i]>>(j*8))&255;
    result+=((b<16)?0:'')+b.toString(16);
  }
  return result;
}
async function sha256(txt){
  if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
    try{
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    }catch(e){}
  }
  return sha256js(unescape(encodeURIComponent(txt)));
}

      +'&responsavel=eq.'+encodeURIComponent(currentUser)+'&order=data_prevista.asc';
    var tr=null,emb=true;
    try{ tr=await api('/crm_tarefas?select=*,crm_leads(nome,whatsapp,etapa)&'+qs); }
    catch(e){ emb=false; }
    if(!emb){
      /* fallback: se o embed do PostgREST nao estiver disponivel, resolve os leads a parte */
      tr=await api('/crm_tarefas?select=*&'+qs);
      const ids=(tr||[]).map(function(t){return t.lead_id;});
      var mp={};
      if(ids.length){
        const lds=await api('/crm_leads?select=id,nome,whatsapp,etapa&id=in.('+ids.join(',')+')');
        (lds||[]).forEach(function(l){mp[l.id]=l;});
      }
      (tr||[]).forEach(function(t){t.crm_leads=mp[t.lead_id]||null;});
    }
    (tr||[]).forEach(function(t){
      const L=t.crm_leads||{};
      if(L.etapa!=='fechado')return;
      const item={tab:'leads',id:t.lead_id,nome:L.nome||'Lead',whatsapp:L.whatsapp,
        data:t.data_prevista,rot:'Pós-venda',etapa:pvNome(t.tipo)};
      if(t.data_prevista<hoje)at.push(item);else if(t.data_prevista===hoje)hj.push(item);else px.push(item);
    });
  }catch(e){}
  at.sort(function(a,b){return a.data<b.data?-1:1;});
  ALERTS={atrasados:at,hoje:hj,proximos:px,total:at.length+hj.length};
  renderAlertBadge();
}

  b.title=ALERTS.atrasados.length+' atrasado(s) · '+ALERTS.hoje.length+' para hoje · '+prox+' nos próximos 3 dias';
}

const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function mesLabel(ym){const p=ym.split('-');return MESES[parseInt(p[1],10)-1]+' '+p[0];}
function mesCurto(ym){const p=ym.split('-');return MESES[parseInt(p[1],10)-1].slice(0,3)+'/'+p[0].slice(2);}
function pct(a,b){return b?(100*a/b).toFixed(1).replace('.',',')+'%':'—';}
let ETAPAS_HIST=null;

async function openReports(){
  $('board').innerHTML='<div class="loading">Montando os relatórios...</div>';
  try{
    if(!DATA.leads)DATA.leads=await api('/crm_leads?select=*&order=nome.asc');
    ETAPAS_HIST=await api('/crm_leads_etapas?select=lead_id,etapa,data');
  }catch(e){
    if(!DATA.leads){$('board').innerHTML='<div class="loading">Não foi possível carregar os dados dos relatórios.</div>';return;}
    ETAPAS_HIST=ETAPAS_HIST||[];
  }

}

/* índice do funil: até onde cada lead chegou */
const FUNIL=[
  {id:'novo',n:'Novo lead',c:'#8A8A8E'},
  {id:'contato_feito',n:'Contato feito',c:'#19408B'},
  {id:'respondeu',n:'Respondeu',c:'#2C5AB5'},
  {id:'experimental',n:'Experimental / Teste',c:'#B87500'},
  {id:'negociacao',n:'Negociação',c:'#E6143C'},
  {id:'fechado',n:'Matrícula fechada',c:'#1E7A46'}
];
const FIDX={novo:0,contato_feito:1,respondeu:2,experimental:3,negociacao:4,fechado:5};
const PERDA_IDX={'Sem retorno':1,'Contato inválido':1,'Fora da região':2,'Só robótica':2,'Preço':4,'Outro':1};

function maxIdx(s,histMap){
  let m=0;
  if(s.etapa==='perdido'){
    m=PERDA_IDX[s.motivo_perda]!=null?PERDA_IDX[s.motivo_perda]:1;
  }else{
    m=FIDX[s.etapa]!=null?FIDX[s.etapa]:0;
  }
  const hs=histMap[s.id];
  if(hs)hs.forEach(function(e){if(FIDX[e]!=null&&FIDX[e]>m)m=FIDX[e];});
  return m;
}

function renderReports(){
  const board=$('board');
  const all=DATA.leads||[];
  const meses={};
  all.forEach(function(s){if(s.data_entrada)meses[s.data_entrada.slice(0,7)]=1;});
  const listaMeses=Object.keys(meses).sort().reverse();
  const per=window._rper||'';

  const leads=all.filter(function(s){return !per||(s.data_entrada||'').slice(0,7)===per;});
  const histMap={};
  (ETAPAS_HIST||[]).forEach(function(e){(histMap[e.lead_id]=histMap[e.lead_id]||[]).push(e.etapa);});

  const total=leads.length;
  const fech=leads.filter(function(s){return s.etapa==='fechado';});
  const perd=leads.filter(function(s){return s.etapa==='perdido';});
  const ativos=total-fech.length-perd.length;

  // tempo médio de fechamento
  let tmed='—';
  const dias=fech.filter(function(s){return s.data_entrada&&s.data_fechamento;}).map(function(s){
    return Math.max(0,(new Date(s.data_fechamento)-new Date(s.data_entrada))/86400000);
  });
  if(dias.length)tmed=Math.round(dias.reduce(function(a,b){return a+b;},0)/dias.length)+' dias';

  // funil real: quantos chegaram a cada etapa
  const reached=FUNIL.map(function(f,i){
    return leads.filter(function(s){return maxIdx(s,histMap)>=i;}).length;
  });
  const atAtivo=FUNIL.map(function(f,i){
    return leads.filter(function(s){return s.etapa!=='perdido'&&s.etapa!=='fechado'&&FIDX[s.etapa]===i;}).length;
  });
  const perdAt=FUNIL.map(function(f,i){
    return perd.filter(function(s){return maxIdx(s,histMap)===i;}).length;
  });
  const mx=Math.max(reached[0],1);

  let funil='<div class="fnl">'+FUNIL.map(function(f,i){
    const w=Math.max(100*reached[i]/mx,10);
    const wn=i<FUNIL.length-1?Math.max(100*reached[i+1]/mx,10):w;
    const inset=w>0?Math.max(0,(w-wn)/2/w*100):0;
    const clip=i<FUNIL.length-1?'clip-path:polygon(0 0,100% 0,'+(100-inset)+'% 100%,'+inset+'% 100%);':'border-radius:0 0 10px 10px;';
    const info=[];
    if(atAtivo[i])info.push('<i>'+atAtivo[i]+' aguardando aqui</i>');
    if(perdAt[i])info.push('<b>'+perdAt[i]+' perdidos aqui</b>');
    return '<div class="fnlrow">'+
      '<div class="fnlbarwrap"><div class="fnlbar" style="width:'+w+'%;background:'+f.c+';'+clip+'">'+
        '<b>'+reached[i]+'</b><span>'+esc(f.n)+'</span></div></div>'+
      '<div class="fnlinfo">'+pct(reached[i],total)+' chegaram até aqui'+(info.length?'<br>'+info.join(' · '):'')+'</div>'+
    '</div>';
  }).join('')+'</div>';

  // evolução mensal
  const evAsc=Object.keys(meses).sort();
  let evo='';
  if(evAsc.length){
    const em=evAsc.map(function(m){
      const ls=all.filter(function(s){return (s.data_entrada||'').slice(0,7)===m;});
      return {m:m,n:ls.length,f:ls.filter(function(s){return s.etapa==='fechado';}).length};
    });
    const emx=Math.max.apply(null,em.map(function(x){return x.n;}).concat([1]));
    evo='<div class="rcard"><h3>Evolução mensal · leads x matrículas</h3><div class="mgrid">'+em.map(function(x){
      return '<div class="mcol"><div class="mv">'+x.n+' · '+x.f+'</div><div class="mbars">'+
        '<i class="ml" style="height:'+Math.max(100*x.n/emx,3)+'%"></i>'+
        '<i class="mf" style="height:'+Math.max(100*x.f/emx,3)+'%"></i>'+
        '</div><div class="mn">'+mesCurto(x.m)+'</div></div>';
    }).join('')+'</div><div class="mleg"><span><i style="background:var(--blue)"></i>Leads</span><span><i style="background:var(--ok)"></i>Matrículas</span></div></div>';
  }

  // tabelas de grupo
  function grupo(campo,titulo,rotulo){
    const g={};
    leads.forEach(function(s){
      const k=s[campo]||'—';
      if(!g[k])g[k]={n:0,f:0};
      g[k].n++;if(s.etapa==='fechado')g[k].f++;
    });
    const ks=Object.keys(g).sort(function(a,b){return g[b].n-g[a].n;});
    if(!ks.length)return '';
    return '<div class="rcard"><h3>'+titulo+'</h3><div class="rtabw"><table class="rtab">'+
      '<tr><th>'+rotulo+'</th><th class="num">Leads</th><th class="num">Matrículas</th><th class="num">Conversão</th></tr>'+
      ks.map(function(k){
        return '<tr><td>'+esc(k)+'</td><td class="num">'+g[k].n+'</td><td class="num">'+g[k].f+'</td><td class="num">'+pct(g[k].f,g[k].n)+'</td></tr>';
      }).join('')+'</table></div></div>';
  }

  // motivos de perda
  let motivos='';
  const gm={};
  perd.forEach(function(s){const k=s.motivo_perda||'Não informado';gm[k]=(gm[k]||0)+1;});
  const km=Object.keys(gm).sort(function(a,b){return gm[b]-gm[a];});
  if(km.length){
    const mm=Math.max.apply(null,km.map(function(k){return gm[k];}));
    motivos='<div class="rcard"><h3>Motivos de perda</h3><div class="fun">'+km.map(function(k){
      return '<div class="frow"><span class="fl">'+esc(k)+'</span>'+
        '<span class="fb"><i style="--bc:#B9B9BE;width:'+(100*gm[k]/mm)+'%"></i></span>'+
        '<span class="fn">'+gm[k]+' · '+pct(gm[k],perd.length)+'</span></div>';
    }).join('')+'</div></div>';
  }

  // leads esquecidos (sempre situação atual, ignora o período)
  const hoje=new Date();
  const esq=all.filter(function(s){
    if(s.etapa==='fechado'||s.etapa==='perdido')return false;
    if(!s.ultimo_contato)return true;
    return (hoje-new Date(s.ultimo_contato))/86400000>7;
  }).map(function(s){
    const d=s.ultimo_contato?Math.floor((hoje-new Date(s.ultimo_contato))/86400000):null;
    return {s:s,d:d};
  }).sort(function(a,b){return (b.d==null?9999:b.d)-(a.d==null?9999:a.d);});
  let alerta='';
  if(esq.length){
    alerta='<div class="rcard"><h3>⚠️ Precisam de follow-up · sem contato há mais de 7 dias</h3>'+esq.slice(0,15).map(function(x){
      const wa=waLink(x.s.whatsapp);
      return '<div class="alert"><span class="an">'+esc(x.s.nome)+' <span class="tag">'+esc(x.s.responsavel||'—')+'</span></span>'+
        '<span class="ad">'+(x.d==null?'nunca contatado':x.d+' dias')+'</span>'+
        (wa?'<a class="wa" style="font-size:11.5px;font-weight:600;border-radius:8px;padding:5px 9px;text-decoration:none" target="_blank" rel="noopener" href="'+wa+'">WhatsApp</a>':'<span></span>')+
      '</div>';
    }).join('')+(esq.length>15?'<div class="empty">+ '+(esq.length-15)+' outros — use o kanban pra ver todos</div>':'')+'</div>';
  }

  $('stats').innerHTML='';
  board.innerHTML='<div class="rscreen"><div class="rwrap">'+
    '<div class="rtitle"><h1>Relatórios · Clientes B2C</h1><div class="spacer"></div>'+
      '<select id="rperiodo" class="btn" style="font-weight:600;color:var(--blue)">'+
        '<option value="">Todos os períodos</option>'+
        listaMeses.map(function(m){return '<option value="'+m+'"'+(per===m?' selected':'')+'>'+mesLabel(m)+'</option>';}).join('')+
      '</select></div>'+
    buildAnalise(all,histMap)+
    '<div class="rkpis">'+
      '<div class="rkpi"><b>'+total+'</b><span>Leads</span></div>'+
      '<div class="rkpi"><b>'+ativos+'</b><span>Ativos</span></div>'+
      '<div class="rkpi ok"><b>'+fech.length+'</b><span>Matrículas</span></div>'+
      '<div class="rkpi bad"><b>'+perd.length+'</b><span>Perdidos</span></div>'+
      '<div class="rkpi"><b>'+pct(fech.length,total)+'</b><span>Conversão</span></div>'+
      '<div class="rkpi"><b>'+tmed+'</b><span>Tempo até matrícula</span></div>'+
    '</div>'+
    '<div class="rcard"><h3>Funil · até onde os leads chegam</h3>'+funil+'</div>'+
    alerta+evo+
    grupo('responsavel','Conversão por consultor','Consultor')+
    grupo('origem','Leads por origem','Origem')+
    grupo('curso','Cursos procurados','Curso')+
    motivos+
  '</div></div>';
  const sel=document.getElementById('rperiodo');
  if(sel)sel.onchange=function(){window._rper=sel.value;renderReports();};
}


/* ================= Análise do andamento ================= */
function buildAnalise(all,histMap){
  const hoje=new Date();
  function diasAtras(n){const d=new Date(hoje);d.setDate(d.getDate()-n);return d;}
  function entreDatas(campo,d1,d2){
    return all.filter(function(s){
      if(!s[campo])return false;
      const d=new Date(s[campo]);
      return d>=d1&&d<d2;
    });
  }
  const itens=[];

  // 1. ritmo de captação (últimos 7 dias vs 7 anteriores)
  const n7=entreDatas('data_entrada',diasAtras(7),hoje).length;
  const n14=entreDatas('data_entrada',diasAtras(14),diasAtras(7)).length;
  if(n7===0&&n14===0){
    itens.push({c:'neg',t:'<b>Nenhum lead novo nas últimas duas semanas.</b> A captação está parada — vale checar se os anúncios estão rodando e se os leads estão sendo registrados aqui no CRM.'});
  }else if(n7>n14){
    itens.push({c:'pos',t:'<i>'+n7+' leads novos nos últimos 7 dias</i>, acima dos '+n14+' da semana anterior. Captação acelerando.'});
  }else if(n7<n14){
    itens.push({c:'neg',t:'<i>'+n7+' leads novos nos últimos 7 dias</i>, contra '+n14+' na semana anterior. Ritmo de captação caindo.'});
  }else{
    itens.push({c:'',t:'<i>'+n7+' leads novos nos últimos 7 dias</i>, mesmo ritmo da semana anterior.'});
  }

  // 2. matrículas recentes
  const f30=entreDatas('data_fechamento',diasAtras(30),hoje).filter(function(s){return s.etapa==='fechado';}).length;
  if(f30>0)itens.push({c:'pos',t:'<i>'+f30+' matrícula'+(f30>1?'s':'')+'</i> fechada'+(f30>1?'s':'')+' nos últimos 30 dias.'});
  else itens.push({c:'neg',t:'<b>Nenhuma matrícula nos últimos 30 dias.</b>'});

  // 3. mês atual vs anterior
  const ym=hoje.toISOString().slice(0,7);
  const prev=new Date(hoje.getFullYear(),hoje.getMonth()-1,1).toISOString().slice(0,7);
  const lm=all.filter(function(s){return (s.data_entrada||'').slice(0,7)===ym;});
  const lp=all.filter(function(s){return (s.data_entrada||'').slice(0,7)===prev;});
  if(lm.length||lp.length){
    itens.push({c:lm.length>=lp.length?'':'neg',t:'Este mês: <i>'+lm.length+' leads</i> e <i>'+lm.filter(function(s){return s.etapa==='fechado';}).length+' matrículas</i>'+(lp.length?' (mês passado: '+lp.length+' leads, '+lp.filter(function(s){return s.etapa==='fechado';}).length+' matrículas)':'')+'.'});
  }

  // 4. atividade da equipe (movimentações registradas)
  const mov7=(ETAPAS_HIST||[]).filter(function(e){return e.data&&new Date(e.data)>=diasAtras(7);}).length;
  if(mov7>0)itens.push({c:'',t:'<i>'+mov7+' movimentaç'+(mov7>1?'ões':'ão')+' de etapa</i> registradas no funil nos últimos 7 dias.'});

  // 5. onde o funil mais vaza
  const perdTotal=all.filter(function(s){return s.etapa==='perdido';});
  if(perdTotal.length>=5){
    const porEtapa={};
    perdTotal.forEach(function(s){const i=maxIdx(s,histMap);porEtapa[i]=(porEtapa[i]||0)+1;});
    const pior=Object.keys(porEtapa).sort(function(a,b){return porEtapa[b]-porEtapa[a];})[0];
    itens.push({c:'neg',t:'Maior vazamento do funil: <b>'+porEtapa[pior]+' leads perdidos na etapa "'+FUNIL[pior].n+'"</b> ('+pct(porEtapa[pior],perdTotal.length)+' das perdas).'});
    const gm={};
    perdTotal.forEach(function(s){const k=s.motivo_perda||'Não informado';gm[k]=(gm[k]||0)+1;});
    const km=Object.keys(gm).sort(function(a,b){return gm[b]-gm[a];})[0];
    itens.push({c:'',t:'Principal motivo de perda: <b>'+esc(km)+'</b> ('+gm[km]+' leads). '+(km==='Sem retorno'?'Vale testar variações da primeira mensagem e um segundo toque mais cedo.':'')});
  }

  // 6. follow-up pendente
  const pend=all.filter(function(s){
    if(s.etapa==='fechado'||s.etapa==='perdido')return false;
    if(!s.ultimo_contato)return true;
    return (hoje-new Date(s.ultimo_contato))/86400000>7;
  });
  if(pend.length>0){
    itens.push({c:'neg',t:'<b>'+pend.length+' leads ativos sem contato há mais de 7 dias</b> — lista completa no bloco de follow-up abaixo. Lead esfriado raramente volta sozinho.'});
  }else{
    const at=all.filter(function(s){return s.etapa!=='fechado'&&s.etapa!=='perdido';}).length;
    if(at>0)itens.push({c:'pos',t:'Todos os '+at+' leads ativos tiveram contato na última semana. Funil em dia.'});
  }

  // 7. melhor origem (com volume mínimo)
  const go={};
  all.forEach(function(s){const k=s.origem||'—';if(!go[k])go[k]={n:0,f:0};go[k].n++;if(s.etapa==='fechado')go[k].f++;});
  const origens=Object.keys(go).filter(function(k){return go[k].n>=8;});
  if(origens.length>1){
    origens.sort(function(a,b){return (go[b].f/go[b].n)-(go[a].f/go[a].n);});
    const top=origens[0];
    if(go[top].f>0)itens.push({c:'pos',t:'Origem que melhor converte: <i>'+esc(top)+'</i> ('+pct(go[top].f,go[top].n)+' de '+go[top].n+' leads). Considere reforçar esse canal.'});
  }

  const agora=hoje.toLocaleDateString('pt-BR')+' às '+hoje.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return '<div class="acard"><h3>Análise do andamento</h3><div class="asub">Gerada agora, com a foto atual do funil · '+agora+'</div><ul>'+
    itens.map(function(x){return '<li class="'+x.c+'">'+x.t+'</li>';}).join('')+'</ul></div>';
}

/* ================= Mural (promoções, avisos e FAQ) ================= */
let MURAL={avisos:null,faq:null};
let faqQ='';
let mEdit=null;   /* {tipo:'aviso'|'faq', id:null|uuid} */

function hojeISO(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function brDate(s){return s?s.split('-').reverse().join('/'):'';}
function vigente(a){
  const h=hojeISO();
  if(!a.ativo)return false;
  if(a.vigencia_inicio&&a.vigencia_inicio>h)return false;
  if(a.vigencia_fim&&a.vigencia_fim<h)return false;
  return true;
}

async function openMural(){
  $('stats').innerHTML='';
  $('board').innerHTML='<div class="loading">Carregando mural...</div>';
  try{
    const r=await Promise.all([
      api('/crm_avisos?select=*&order=destaque.desc,ordem.asc,criado_em.desc'),
      api('/crm_faq?select=*&order=categoria.asc,ordem.asc')
    ]);
    MURAL.avisos=r[0]||[];MURAL.faq=r[1]||[];
  }catch(e){
    $('board').innerHTML='<div class="loading">Não foi possível carregar o mural.</div>';return;
  }
  mEdit=null;renderMural();
}

function renderMural(){
  const adm=isAdmin();
  const avisos=MURAL.avisos.filter(function(a){return adm||vigente(a);});
  const q=faqQ.trim().toLowerCase();
  const faq=MURAL.faq.filter(function(f){
    if(!adm&&!f.ativo)return false;
    if(!q)return true;
    return (f.pergunta+' '+f.resposta+' '+f.categoria+' '+(f.tags||[]).join(' ')).toLowerCase().indexOf(q)>-1;
  });

  let h='<div class="pane">';

  /* --- Promoções e avisos --- */
  h+='<div class="rcard"><div class="paneh"><h3>Promoções e avisos do período</h3>'+
     (adm?'<button class="btn primary" id="addAviso">+ Nova</button>':'')+'</div>';
  if(!avisos.length){
    h+='<div style="color:var(--gray);font-size:13px;padding:6px 0">Nenhuma promoção ou aviso no ar agora.</div>';
  }else{
    avisos.forEach(function(a){
      const fora=!vigente(a);
      h+='<div class="promo'+(a.destaque?' hot':'')+'" style="'+(fora?'opacity:.55':'')+'">'+
        '<div class="pt">'+esc(a.titulo)+
          (a.tipo==='promocao'?'<span class="tag red">Promoção</span>':'<span class="tag">Aviso</span>')+
          (fora?'<span class="tag gray">'+(a.ativo?'Fora de vigência':'Inativo')+'</span>':'')+
        '</div>'+
        (a.corpo?'<div class="pb">'+esc(a.corpo)+'</div>':'')+
        '<div class="pv">Vigência: '+brDate(a.vigencia_inicio)+(a.vigencia_fim?' até '+brDate(a.vigencia_fim):' · sem prazo')+'</div>'+
        (adm?'<div class="pbtns"><button class="btn" data-ea="'+a.id+'">Editar</button>'+
             '<button class="btn danger" data-da="'+a.id+'">Excluir</button></div>':'')+
      '</div>';
    });
  }
  if(adm&&mEdit&&mEdit.tipo==='aviso')h+=formAviso();
  h+='</div>';

  /* --- FAQ --- */
  h+='<div class="rcard"><div class="paneh"><h3>Dúvidas frequentes</h3>'+
     (adm?'<button class="btn primary" id="addFaq">+ Nova</button>':'')+'</div>'+
     '<input id="faqq" type="search" placeholder="Buscar por palavra-chave: material, trancamento, reposição..." '+
     'value="'+esc(faqQ)+'" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:6px">';
  if(!faq.length){
    h+='<div style="color:var(--gray);font-size:13px;padding:10px 0">'+(q?'Nada encontrado para essa busca.':'Nenhuma pergunta cadastrada ainda.')+'</div>';
  }else{
    let cat='';
    faq.forEach(function(f){
      if(f.categoria!==cat){cat=f.categoria;h+='<div class="faqcat">'+esc(cat)+'</div>';}
      h+='<div class="faqq" data-fq="'+f.id+'">'+
        '<button type="button"><span>'+esc(f.pergunta)+(f.ativo?'':' <span class="tag gray">Inativa</span>')+'</span><span class="ar">▾</span></button>'+
        '<div class="fa">'+esc(f.resposta)+
          (adm?'<div class="pbtns"><button class="btn" data-ef="'+f.id+'">Editar</button>'+
               '<button class="btn danger" data-df="'+f.id+'">Excluir</button></div>':'')+
        '</div></div>';
    });
  }
  if(adm&&mEdit&&mEdit.tipo==='faq')h+=formFaq();
  h+='</div></div>';

  $('board').innerHTML=h;
  wireMural();
}

      '<option value="promocao"'+(g('tipo','promocao')==='promocao'?' selected':'')+'>Promoção</option>'+
      '<option value="aviso"'+(g('tipo','promocao')==='aviso'?' selected':'')+'>Aviso</option></select></div>'+
    '<div><label>Ordem</label><input id="av_ordem" type="number" value="'+g('ordem',0)+'"></div>'+
    '<div class="full"><label>Texto</label><textarea id="av_corpo">'+esc(g('corpo',''))+'</textarea></div>'+

function formFaq(){

  const g=function(k,d){return f&&f[k]!=null?f[k]:d;};

    '<div><label>Ordem</label><input id="fq_ordem" type="number" value="'+g('ordem',0)+'"></div>'+
    '<div class="full"><label>Pergunta</label><input id="fq_perg" value="'+esc(g('pergunta',''))+'"></div>'+
    '<div class="full"><label>Resposta</label><textarea id="fq_resp">'+esc(g('resposta',''))+'</textarea></div>'+
    '<div class="full"><label>Palavras-chave (separadas por vírgula)</label><input id="fq_tags" value="'+esc((g('tags',[])||[]).join(', '))+'"></div>'+
    '<div class="full row"><label style="margin:0"><input type="checkbox" id="fq_ativo"'+(g('ativo',true)?' checked':'')+'> Ativa</label></div>'+

      '<button class="btn" id="fq_cancel">Cancelar</button><span id="fq_msg" style="font-size:12px;color:var(--ok)"></span></div>'+

function wireMural(){
  const fq=$('faqq');
  if(fq){
    fq.oninput=function(e){
      faqQ=e.target.value;
      const pos=e.target.selectionStart;
      renderMural();
      const n=$('faqq');if(n){n.focus();n.setSelectionRange(pos,pos);}
    };
  }
  document.querySelectorAll('.faqq>button').forEach(function(b){
    b.onclick=function(){b.parentNode.classList.toggle('open');};
  });
  if($('addAviso'))$('addAviso').onclick=function(){mEdit={tipo:'aviso',id:null};renderMural();};
  if($('addFaq'))$('addFaq').onclick=function(){mEdit={tipo:'faq',id:null};renderMural();};
  document.querySelectorAll('[data-ea]').forEach(function(b){
    b.onclick=function(){mEdit={tipo:'aviso',id:b.dataset.ea};renderMural();};
  });
  document.querySelectorAll('[data-ef]').forEach(function(b){
    b.onclick=function(e){e.stopPropagation();mEdit={tipo:'faq',id:b.dataset.ef};renderMural();};
  });
  document.querySelectorAll('[data-da]').forEach(function(b){
    b.onclick=async function(){
      if(!confirm('Excluir este item do mural?'))return;
      await api('/crm_avisos?id=eq.'+b.dataset.da,{method:'DELETE'});
      MURAL.avisos=MURAL.avisos.filter(function(x){return x.id!==b.dataset.da;});
      mEdit=null;renderMural();
    };
  });
  document.querySelectorAll('[data-df]').forEach(function(b){
    b.onclick=async function(e){
      e.stopPropagation();
      if(!confirm('Excluir esta pergunta?'))return;
      await api('/crm_faq?id=eq.'+b.dataset.df,{method:'DELETE'});
      MURAL.faq=MURAL.faq.filter(function(x){return x.id!==b.dataset.df;});
      mEdit=null;renderMural();
    };
  });

  if($('av_cancel'))$('av_cancel').onclick=function(){mEdit=null;renderMural();};
  if($('fq_cancel'))$('fq_cancel').onclick=function(){mEdit=null;renderMural();};

  if($('av_save'))$('av_save').onclick=async function(){
    const btn=$('av_save');if(btn.disabled)return;btn.disabled=true;
    try{
      const body={
        titulo:$('av_titulo').value.trim(),
        tipo:$('av_tipo').value,
        corpo:$('av_corpo').value,
        destaque:$('av_destaque').checked,
        ativo:$('av_ativo').checked,
        ordem:parseInt($('av_ordem').value||'0',10),
        vigencia_inicio:$('av_ini').value||hojeISO(),
        vigencia_fim:$('av_fim').value||null,
        atualizado_em:new Date().toISOString()
      };
      if(!body.titulo){alert('Coloque um título.');btn.disabled=false;return;}
      if(body.vigencia_fim&&body.vigencia_fim<body.vigencia_inicio){alert('A data final é anterior à inicial.');btn.disabled=false;return;}
      if(mEdit.id){
        const r=await api('/crm_avisos?id=eq.'+mEdit.id,{method:'PATCH',body:JSON.stringify(body)});
        const i=MURAL.avisos.findIndex(function(x){return x.id===mEdit.id;});
        if(i>-1&&r&&r[0])MURAL.avisos[i]=r[0];
      }else{
        body.criado_por=currentUser;
        const r=await api('/crm_avisos',{method:'POST',body:JSON.stringify(body)});
        if(r&&r[0])MURAL.avisos.unshift(r[0]);
      }
      mEdit=null;renderMural();
    }catch(e){alert('Erro ao salvar: '+(e&&e.message?e.message:e));btn.disabled=false;}
  };

  if($('fq_save'))$('fq_save').onclick=async function(){
    const btn=$('fq_save');if(btn.disabled)return;btn.disabled=true;
    try{
      const body={
        categoria:$('fq_cat').value.trim()||'Geral',
        pergunta:$('fq_perg').value.trim(),
        resposta:$('fq_resp').value,
        tags:$('fq_tags').value.split(',').map(function(s){return s.trim();}).filter(Boolean),
        ativo:$('fq_ativo').checked,
        ordem:parseInt($('fq_ordem').value||'0',10),
        atualizado_em:new Date().toISOString()
      };
      if(!body.pergunta){alert('Escreva a pergunta.');btn.disabled=false;return;}
      if(mEdit.id){
        const r=await api('/crm_faq?id=eq.'+mEdit.id,{method:'PATCH',body:JSON.stringify(body)});
        const i=MURAL.faq.findIndex(function(x){return x.id===mEdit.id;});
        if(i>-1&&r&&r[0])MURAL.faq[i]=r[0];
      }else{
        body.criado_por=currentUser;
        const r=await api('/crm_faq',{method:'POST',body:JSON.stringify(body)});
        if(r&&r[0])MURAL.faq.push(r[0]);
      }
      MURAL.faq.sort(function(a,b){return a.categoria===b.categoria?a.ordem-b.ordem:(a.categoria<b.categoria?-1:1);});
      mEdit=null;renderMural();
    }catch(e){alert('Erro ao salvar: '+(e&&e.message?e.message:e));btn.disabled=false;}
  };
}

/* ================= Calculadora de valores ================= */
const ANO_PRECOS=2026;
const PARCELAS=[12,11,10,9,1];
let PRECOS={niveis:null,materiais:null,certs:null};
let CALC={n1:'',d1:0,dois:true,n2:'',d2:0,mat:true,dm1:0,dm2:0,
          parcC:12,parcM:12,matricula:15000,validade:''};

function fmtNum(c){
  const v=(Math.abs(Math.round(c))/100).toFixed(2).split('.');
  return v[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+v[1];
}
function money(c){return (c<0?'-':'')+'R$ '+fmtNum(c);}
/* mascara de moeda: le so os digitos e reposiciona o cursor no fim */
function maskMoeda(el){
  const d=String(el.value).replace(/\D/g,'');
  const cents=d?parseInt(d,10):0;
  el.value=fmtNum(cents);
  try{const n=el.value.length;el.setSelectionRange(n,n);}catch(e){}
  return cents;
}
function nivelBy(cod){return (PRECOS.niveis||[]).find(function(x){return x.codigo===cod;})||null;}
function matBy(cod){return cod?((PRECOS.materiais||[]).find(function(x){return x.codigo===cod;})||null):null;}
function maisDias(n){
  const d=new Date();d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function openCalc(){
  $('stats').innerHTML='';
  if(!PRECOS.niveis){
    $('board').innerHTML='<div class="loading">Carregando tabela de preços '+ANO_PRECOS+'...</div>';
    try{
      const r=await Promise.all([
        api('/crm_precos_niveis?select=*&ativo=eq.true&ano=eq.'+ANO_PRECOS+'&order=ordem.asc'),
        api('/crm_precos_materiais?select=*&ativo=eq.true&ano=eq.'+ANO_PRECOS+'&order=ordem.asc'),
        api('/crm_precos_certificacoes?select=*&ativo=eq.true&ano=eq.'+ANO_PRECOS+'&order=ordem.asc')
      ]);
      PRECOS.niveis=r[0]||[];PRECOS.materiais=r[1]||[];PRECOS.certs=r[2]||[];
    }catch(e){
      $('board').innerHTML='<div class="loading">Não foi possível carregar a tabela de preços.</div>';return;
    }
  }
  if(!CALC.n1&&PRECOS.niveis.length)CALC.n1=PRECOS.niveis[0].codigo;
  if(!CALC.n2)CALC.n2=CALC.n1;
  if(!CALC.validade)CALC.validade=maisDias(7);
  renderCalc();
}

function calcular(){
  const n1=nivelBy(CALC.n1);
  const n2=CALC.dois?(nivelBy(CALC.n2)||n1):null;
  /* fonte de verdade e o valor de 2 periodos; o periodo e metade dele
     (pode ter fracao de centavo). Arredonda uma vez so, no total. */
  const p1=n1?n1.valor_2periodos_cents/2:0;
  const p2=n2?n2.valor_2periodos_cents/2:0;
  const c1=p1*(1-CALC.d1/100);
  const c2=p2*(1-CALC.d2/100);
  const m1=CALC.mat?matBy(n1&&n1.material_codigo):null;
  const m2=CALC.mat&&n2?matBy(n2.material_codigo):null;
  const mc1=m1?m1.valor_cents:0, mc2=m2?m2.valor_cents:0;
  const md1=m1?mc1*(1-CALC.dm1/100):0;
  const md2=m2?mc2*(1-CALC.dm2/100):0;
  const cursoCheio=Math.round(p1+p2), cursoDesc=Math.round(c1+c2);
  const matCheio=mc1+mc2, matDesc=Math.round(md1+md2);
  const taxa=CALC.matricula||0;
  return {
    n1:n1,n2:n2,m1:m1,m2:m2,p1:p1,p2:p2,c1:c1,c2:c2,
    mc1:mc1,mc2:mc2,md1:md1,md2:md2,
    cursoCheio:cursoCheio,cursoDesc:cursoDesc,matCheio:matCheio,matDesc:matDesc,
    taxa:taxa,
    totalCheio:cursoCheio+matCheio+taxa,
    totalDesc:cursoDesc+matDesc+taxa,
    economia:(cursoCheio+matCheio)-(cursoDesc+matDesc),
    parcCurso:cursoDesc/CALC.parcC,
    parcMat:matDesc/CALC.parcM,
    mesmaParc:CALC.parcC===CALC.parcM,
    somaParc:(cursoDesc/CALC.parcC)+(matDesc/CALC.parcM)
  };
}

function optsNivel(sel){
  let ing='',esp='';
  (PRECOS.niveis||[]).forEach(function(n){
    const o='<option value="'+n.codigo+'"'+(n.codigo===sel?' selected':'')+'>'+esc(n.nome)+' · '+money(n.valor_2periodos_cents/2)+'</option>';
    if(n.idioma==='espanhol')esp+=o;else ing+=o;
  });
  return '<optgroup label="Inglês">'+ing+'</optgroup><optgroup label="Espanhol">'+esp+'</optgroup>';
}
function optsDesc(sel){
  let o='';
  for(let i=0;i<=100;i+=5)o+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+i+'%</option>';
  return o;
}
function optsParc(sel){
  return PARCELAS.map(function(n){
    return '<option value="'+n+'"'+(n===sel?' selected':'')+'>'+(n===1?'À vista':n+'x')+'</option>';
  }).join('');
}

function renderCalc(){
  const foco=document.activeElement?document.activeElement.id:null;
  const selStart=(document.activeElement&&document.activeElement.selectionStart!=null)?document.activeElement.selectionStart:null;
  const R=calcular();
  let h='<div class="pane">';

  /* ---------- ENTRADA ---------- */
  h+='<div class="rcard"><div class="paneh"><h3>Calculadora de valores · tabela '+ANO_PRECOS+'</h3></div>';
  h+='<div class="cgrid">';

  h+='<div class="cbox"><h4>1º período</h4>'+
     '<div class="cf"><label>Nível</label><select id="c_n1">'+optsNivel(CALC.n1)+'</select></div>'+
     '<div class="cf"><label>Desconto</label><select id="c_d1">'+optsDesc(CALC.d1)+'</select>'+
     '<div class="hint">'+money(R.p1)+' → <b>'+money(R.c1)+'</b></div></div></div>';

  h+='<div class="cbox"><h4>2º período</h4>'+
     '<label class="cchk"><input type="checkbox" id="c_dois"'+(CALC.dois?' checked':'')+'> Incluir 2º período</label>';
  if(CALC.dois){
    h+='<div class="cf"><label>Nível</label><select id="c_n2">'+optsNivel(CALC.n2)+'</select></div>'+
       '<div class="cf"><label>Desconto</label><select id="c_d2">'+optsDesc(CALC.d2)+'</select>'+
       '<div class="hint">'+money(R.p2)+' → <b>'+money(R.c2)+'</b></div></div>';
  }else{
    h+='<div class="hint" style="font-size:12px;color:var(--gray)">Matrícula de um período só.</div>';
  }
  h+='</div>';

  h+='<div class="cbox"><h4>Material didático</h4>'+
     '<label class="cchk"><input type="checkbox" id="c_mat"'+(CALC.mat?' checked':'')+'> Incluir material</label>';
  if(CALC.mat){
    h+='<div class="cf"><label>1º material'+(R.m1?' · '+esc(R.m1.nome):'')+'</label><select id="c_dm1">'+optsDesc(CALC.dm1)+'</select>'+
       '<div class="hint">'+(R.m1?money(R.mc1)+' → <b>'+money(R.md1)+'</b>':'Este nível não tem material vinculado.')+'</div></div>';
    if(CALC.dois){
      h+='<div class="cf"><label>2º material'+(R.m2?' · '+esc(R.m2.nome):'')+'</label><select id="c_dm2">'+optsDesc(CALC.dm2)+'</select>'+
         '<div class="hint">'+(R.m2?money(R.mc2)+' → <b>'+money(R.md2)+'</b>':'Sem material vinculado.')+'</div></div>';
    }
  }
  h+='</div>';

  h+='<div class="cbox"><h4>Parcelamento e condições</h4>'+
     '<div class="cf"><label>Parcelamento do curso</label><select id="c_parcC">'+optsParc(CALC.parcC)+'</select></div>'+
     '<div class="cf"><label>Parcelamento do material</label><select id="c_parcM">'+optsParc(CALC.parcM)+'</select></div>'+
     '<div class="cf"><label>Taxa de matrícula</label>'+
       '<div class="cmoney"><span>R$</span><input id="c_taxa" type="text" inputmode="numeric" autocomplete="off" value="'+fmtNum(CALC.matricula)+'"></div></div>'+
     '<div class="cf"><label>Proposta válida até</label><input id="c_val" type="date" value="'+esc(CALC.validade)+'"></div></div>';

  h+='<div class="rcard"><div class="paneh"><h3>Resultado</h3></div>'+

  if((PRECOS.certs||[]).length){

      h+='<div class="certrow"><span class="cn">'+esc(c.exame)+' · '+esc(c.modalidade)+'</span>'+
         (c.descricao?'<span class="cd">'+esc(c.descricao)+'</span>':'')+
         '<span class="cval">'+money(c.valor_cents)+'</span></div>';
