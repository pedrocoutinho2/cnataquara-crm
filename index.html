<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM CNA Taquara · Escolas, Empresas e Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* == CNA-DS v1.0 INICIO - sincronize do cna-ds.css, nao edite a mao == */
  --red:#E6143C; --redDark:#A30E2A; --blue:#19408B; --blueDark:#142F66;
  --white:#FFFFFF; --ink:#1A1A1A; --gray:#5A5A5A; --line:#E4E4E7; --surface:#F7F7F9;
  --pastelRed:#FDECEF; --pastelBlue:#EAF0FA; --yellow:#FFC800;
  --ok:#1B7A3D; --okBg:#E7F5EC; --warn:#B45309; --warnBg:#FEF3E2;
  --danger:#A30E2A; --dangerBg:#FDECEF; --dangerLine:#F1C2CC; --muted:#8A8A8E;
  --onColor:#FFFFFF; --onColorLine:rgba(255,255,255,.28);
  --onColorHover:rgba(0,0,0,.10); --onColorActive:rgba(0,0,0,.20);
  --display:'Poppins',system-ui,-apple-system,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --r-sm:8px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:32px;
  --shadow-1:0 1px 2px rgba(26,26,26,.04); --shadow-2:0 2px 10px rgba(26,26,26,.06);
  --shadow-3:0 8px 30px rgba(26,26,26,.08); --shadow-drawer:4px 0 24px rgba(26,26,26,.18);
  --focus:#19408B;
  /* == CNA-DS v1.0 FIM == */
  /* especificos do CRM */
  --off:#8A8A8E; --colBg:#EFEFF2; --tintRed:#FFF7F9; --grayLine:#E4E4E7;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
@supports(height:100dvh){html,body{height:100dvh}}
body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--ink);font-size:14px;display:flex;flex-direction:column;max-width:100vw}
html,body{overflow-x:hidden}
@supports(overflow:clip){html,body{overflow-x:clip}}
body.modal-open{overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* ===== Foco visivel (CNA-DS) ===== */
:is(a,button,input,select,textarea,[tabindex]):focus-visible{
  outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm);
}
.dnav button.on:focus-visible,.tabs button.on:focus-visible{outline-color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.num,.stat b,td.n,th.n{font-variant-numeric:tabular-nums}

/* ===== Header ===== */
header{background:var(--white);border-bottom:3px solid var(--red);padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px}
.logoImg{width:104px;display:block;flex:none}
.logoImg.big{width:150px;margin:0 auto 10px}
.brand .cna{font-family:'Poppins';font-weight:700;font-size:22px;color:var(--red);letter-spacing:.5px}
.brand .sub{font-family:'Poppins';font-weight:600;font-size:13px;color:var(--blue)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;gap:3px;max-width:100%;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}

/* ===== Menu hamburguer + gaveta (mobile) ===== */
.mbtn{display:none;border:1px solid var(--line);background:var(--white);border-radius:var(--r-md);width:40px;height:40px;align-items:center;justify-content:center;font-size:19px;color:var(--ink);line-height:1;flex:none}
.drawer{position:fixed;inset:0;z-index:120;visibility:hidden;transition:visibility 0s linear .24s}
.drawer.open{visibility:visible;transition-delay:0s}
.dbg{position:absolute;inset:0;background:rgba(26,26,26,.45);opacity:0;transition:opacity .24s ease}
.drawer.open .dbg{opacity:1}
.dpanel{position:absolute;top:0;left:0;bottom:0;width:min(80vw,320px);background:var(--white);display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .24s cubic-bezier(.32,.72,0,1);box-shadow:4px 0 24px rgba(26,26,26,.18);
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  padding-left:calc(14px + env(safe-area-inset-left))}
.drawer.open .dpanel{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:2px 2px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.dhead .dinfo{display:flex;flex-direction:column;min-width:0}
.dhead .dinfo b{font-family:'Poppins';font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dhead .dinfo span{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.dhead .avatar{width:34px;height:34px;font-size:14px}
.dx{margin-left:auto;border:1px solid var(--line);background:var(--white);border-radius:50%;width:32px;height:32px;font-size:14px;color:var(--gray);line-height:1;flex:none}
.dnav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;min-height:0}
.dnav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:none;
  border-radius:var(--r-md);padding:13px 12px;font-family:'Poppins';font-weight:600;font-size:14.5px;color:var(--ink)}
.dnav button i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dnav button.on{background:var(--red);color:var(--white)}
.dnav button.on i{background:var(--white)}
.dfoot{border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.dfoot .btn{width:100%;padding:12px}
.tabs button{border:none;background:transparent;padding:7px 20px;border-radius:var(--r-pill);font-family:'Poppins';font-weight:600;font-size:13px;color:var(--gray);flex:0 0 auto;white-space:nowrap}
.tabs button.on{background:var(--red);color:var(--white)}
.hright{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stats{display:flex;gap:16px}
.stat{text-align:center}
.stat b{display:block;font-family:'Poppins';font-size:17px;color:var(--blue);line-height:1.1}
.stat span{font-size:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.userbox{display:flex;align-items:center;gap:7px}
.userbox label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.userbox select{border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;background:var(--white);font-weight:600;color:var(--blue)}
#logout{padding:5px 10px;font-size:12px}

/* ===== Toolbar ===== */
.toolbar{padding:12px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:180px;max-width:520px;border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px;background:var(--white)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--white);border-radius:var(--r-pill);padding:6px 12px;font-size:12px;color:var(--gray)}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--white)}
.chip.resp.on{background:var(--rc,var(--blue));border-color:var(--rc,var(--blue))}
.fbadge{background:var(--red);color:var(--white);border-radius:var(--r-pill);font-size:11px;font-weight:700;padding:1px 7px;margin-left:4px;display:inline-block}
#fbtn.on{background:var(--blue);border-color:var(--blue);color:var(--white)}
#fbtn.on .fbadge{background:var(--white);color:var(--blue)}
.fpanel{display:none;margin:0 18px 10px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;flex-wrap:wrap;gap:18px;align-items:flex-start}
.fpanel.open{display:flex}
.fgroup{display:flex;flex-direction:column;gap:7px;min-width:140px}
.fglabel{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.drange{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drange input[type=date]{border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;font-size:12px;background:var(--white);color:var(--ink)}
.drange input[type=date].on{border-color:var(--blue);background:var(--pastelBlue)}
.drange span{font-size:11px;color:var(--gray)}
.factions{display:flex;align-items:flex-end;margin-left:auto}
.fsel{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 8px;font-size:13px;background:var(--white);color:var(--ink);min-width:150px}
.fsel.on{border-color:var(--blue);background:var(--pastelBlue);font-weight:600;color:var(--blue)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--white);border-radius:var(--r-md);padding:9px 14px;font-weight:600;font-size:13px;color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--white)}
.btn.primary:hover{background:var(--redDark)}
.btn.danger{color:var(--redDark);border-color:var(--dangerLine)}
.btn.danger.confirm{background:var(--redDark);border-color:var(--redDark);color:var(--white)}

/* ===== Navegador de etapas (mobile) ===== */
.stagenav{display:none;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stagenav::-webkit-scrollbar{display:none}
.stagenav:empty{display:none}
.stagenav button{flex:0 0 auto;border:1px solid var(--line);background:var(--white);border-radius:var(--r-pill);padding:7px 12px;font-size:12px;font-weight:600;color:var(--gray);white-space:nowrap;display:flex;align-items:center;gap:6px}
.stagenav button i{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--blue));display:block;flex:none}
.stagenav button b{font-weight:700;color:var(--ink)}
.stagenav button.on{border-color:var(--sc,var(--blue));background:var(--sc,var(--blue));color:var(--white)}
.stagenav button.on i{background:var(--white)}
.stagenav button.on b{color:var(--white)}

/* ===== Board ===== */
.board{flex:1;min-height:0;display:flex;gap:14px;padding:4px 22px 20px;overflow:auto;align-items:flex-start}
.board::-webkit-scrollbar{height:11px;width:11px}
.board::-webkit-scrollbar-thumb{background:#C4C4CB;border-radius:var(--r-pill);border:2px solid var(--surface)}
.board::-webkit-scrollbar-thumb:hover{background:#A9A9B2}
.board::-webkit-scrollbar-track{background:transparent}
.col{background:var(--colBg);border-radius:var(--r-lg);min-width:262px;width:262px;flex:0 0 auto;display:flex;flex-direction:column;max-height:100%}
.colh{padding:11px 13px 9px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--cc,var(--blue));position:sticky;top:0;background:var(--colBg);border-radius:14px 14px 0 0;z-index:1}
.colh h2{font-family:'Poppins';font-size:12.5px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.4px}
.colh .n{margin-left:auto;background:var(--white);border-radius:var(--r-pill);font-size:11px;font-weight:600;color:var(--gray);padding:2px 8px}
.cards{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0}
.col.drop{outline:2px dashed var(--blue);outline-offset:-3px;background:var(--pastelBlue)}
.col.ok.drop{outline-color:var(--ok);background:#F0FAF4}

.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 11px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card[draggable=true]{cursor:grab}
.card.dragging{opacity:.45;cursor:grabbing}
.card .top{display:flex;align-items:flex-start;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:4px}
.dot.p1{background:var(--red)}.dot.p2{background:var(--blue)}.dot.p3{background:#B9B9BE}
.card h3{font-size:13.5px;font-weight:600;line-height:1.25;flex:1}
.avatar{width:22px;height:22px;border-radius:50%;color:var(--white);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:'Poppins'}
.card .meta{font-size:11.5px;color:var(--gray);margin:5px 0 7px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.card .meta .sep{color:#C9C9CE}
.tag{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 6px;font-size:10.5px}
.acts{display:flex;gap:6px;align-items:center}
.acts a{text-decoration:none;font-size:11.5px;font-weight:600;border-radius:var(--r-sm);padding:5px 9px;display:inline-flex;align-items:center;gap:4px}
.wa{background:#E8F7EE;color:var(--ok)}
.waico{width:15px;height:15px;fill:currentColor;display:block;flex:none}
.acts a.wa,.aga .wa{display:inline-flex;align-items:center;justify-content:center}
.f label .waico{width:16px;height:16px}
.itipo .waico{width:12px;height:12px;display:inline-block;vertical-align:-2px}
.tel{background:#EDF2FB;color:var(--blue)}
.ig{background:#FDEEF2;color:var(--redDark)}
.mv{margin-left:auto;display:flex;gap:3px}
.mv button{border:1px solid var(--line);background:var(--white);border-radius:7px;width:26px;height:26px;font-size:12px;color:var(--gray)}
.mv button:hover{background:var(--blue);color:var(--white);border-color:var(--blue)}

.empty{color:var(--gray);font-size:12px;text-align:center;padding:14px 6px}
.col.res{min-width:min(100%,420px);width:min(100%,420px);flex:1 1 auto}
.stg{border-radius:var(--r-sm);padding:1px 6px;font-size:10.5px;font-weight:600;color:var(--white);background:var(--sc,var(--gray))}
.dupw{background:#FFF3D6;border:1px solid #E9C46A;color:var(--warn);border-radius:var(--r-sm);padding:1px 6px;font-size:10.5px;font-weight:600}

/* ===== Modal ===== */
.ov{position:fixed;inset:0;background:rgba(26,26,26,.45);display:none;align-items:center;justify-content:center;padding:24px 14px;z-index:50}
.ov.open{display:flex}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:860px;margin:0;display:flex;flex-direction:column;max-height:calc(100% - 8px)}
.mhead{padding:20px 20px 0;position:relative;flex:0 0 auto}
.mbody{padding:14px 20px 0;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.mx{display:none;position:absolute;top:14px;right:14px;border:1px solid var(--line);background:var(--white);border-radius:50%;width:34px;height:34px;font-size:15px;color:var(--gray);line-height:1}
.modal h2{font-family:'Poppins';font-size:18px;color:var(--red);margin-bottom:2px;padding-right:40px}
.modal .msub{font-size:12px;color:var(--gray)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
.f label{display:block;font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;background:var(--white)}
.f textarea{min-height:64px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
.mfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:0 0 auto;padding:14px 20px 20px;border-top:1px solid var(--line)}
.savedmsg{color:var(--ok);font-weight:600;font-size:13px;display:none}

/* interações */
.ints{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.ints h3{font-family:'Poppins';font-size:14px;color:var(--blue);margin-bottom:10px}
.iadd{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.iadd select{border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;background:var(--white)}
.iadd input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px}
.ilist{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto}
.int{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 11px}
.int .ih{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--gray);margin-bottom:3px}
.int .ih b{color:var(--blue);font-size:11px}
.int .itipo{background:var(--white);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.int p{font-size:13px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);border-radius:var(--r-md);padding:10px 18px;font-size:13px;z-index:99;display:none}

/* ===== Relatório de funil ===== */
.rmodal{max-width:1100px}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rhead select{border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;background:var(--white);font-weight:600;color:var(--blue)}
.rkpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.rkpi{flex:1;min-width:110px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;text-align:center}
.rkpi b{display:block;font-family:'Poppins';font-size:22px;color:var(--blue);line-height:1.15}
.rkpi.ok b{color:var(--ok)}
.rkpi.bad b{color:var(--redDark)}
.rkpi span{font-size:10.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.4px}
.rsec{margin-bottom:18px}
.rsec h3{font-family:'Poppins';font-size:13.5px;color:var(--red);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.fun{display:flex;flex-direction:column;gap:6px}
.frow{display:grid;grid-template-columns:150px 1fr 74px;gap:8px;align-items:center;font-size:12.5px}
.frow .fl{color:var(--ink);font-weight:600;text-align:right}
.frow .fb{background:var(--surface);border-radius:var(--r-sm);height:20px;overflow:hidden}
.frow .fb i{display:block;height:100%;border-radius:var(--r-sm);background:var(--bc,var(--blue));min-width:2px}
.frow .fn{color:var(--gray)}
.rtabw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.rtab{width:100%;border-collapse:collapse;font-size:12.5px;min-width:340px}
.rtab th{background:var(--blue);color:var(--white);font-family:'Poppins';font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:7px 9px;text-align:left}
.rtab td{padding:7px 9px;border-bottom:1px solid var(--line)}
.rtab tr:nth-child(even) td{background:var(--surface)}
.rtab .num{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:640px){.frow{grid-template-columns:105px 1fr 64px}}

/* ===== Login ===== */
.login{position:fixed;inset:0;background:var(--surface);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.login.off{display:none}
.lbox{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:28px 26px;width:100%;max-width:360px;text-align:center;box-shadow:0 8px 30px rgba(26,26,26,.08)}
.lbrand{display:flex;flex-direction:column;align-items:center;margin-bottom:6px}
.lbrand .cna{font-family:'Poppins';font-weight:700;font-size:28px;color:var(--red)}
.lbrand .sub{font-family:'Poppins';font-weight:600;font-size:14px;color:var(--blue)}
.lmsg{font-size:13px;color:var(--gray);margin:10px 0 14px}
.lusers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.lusers button{border:1.5px solid var(--line);background:var(--white);border-radius:var(--r-pill);padding:8px 14px;font-family:'Poppins';font-weight:600;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:7px}
.lusers button.on{border-color:var(--uc);background:var(--uc);color:var(--white)}
.lusers .ldot{width:10px;height:10px;border-radius:50%;background:var(--uc)}
.lusers button.on .ldot{background:var(--white)}
.lpin{display:flex;gap:8px;justify-content:center}
.lpin input{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;width:120px;text-align:center;font-size:18px;letter-spacing:4px}
.lerr{color:var(--redDark);font-size:12.5px;min-height:16px;margin-top:10px;font-weight:600}

/* ===== Tela de relatórios ===== */
.rscreen{flex:1;overflow-y:auto;padding:4px 18px 30px}
.rwrap{max-width:1320px;margin:0 auto}
.rtitle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.rtitle h1{font-family:'Poppins';font-size:19px;color:var(--red)}
.rsub{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;gap:3px}

/* ===== Análise do andamento ===== */
.acard{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:var(--r-lg);padding:16px;margin-bottom:14px}
.acard h3{font-family:'Poppins';font-size:13.5px;color:var(--blue);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}

.acard li{font-size:13px;line-height:1.5;padding-left:20px;position:relative}
.acard li:before{content:'';position:absolute;left:4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.acard li.pos:before{background:var(--ok)}
.acard li.neg:before{background:var(--red)}
.acard li b{color:var(--redDark)}
.acard li i{font-style:normal;font-weight:600;color:var(--blue)}

/* ===== Agendamentos e alertas ===== */
.abtn{position:relative;border:1px solid var(--line);background:var(--white);border-radius:var(--r-md);padding:6px 11px 6px 9px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;line-height:1}

.abtn.late b{background:var(--red)}

.amodal{max-width:780px}

.aggrp.late h4{color:var(--redDark)}
.aggrp.late h4 span{background:var(--pastelRed);color:var(--redDark)}

.agi{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:7px;cursor:pointer;background:var(--white)}
.agi:hover{border-color:var(--blue);background:var(--surface)}
.aggrp.late .agi{border-left:3px solid var(--red)}
.aggrp.today .agi{border-left:3px solid var(--warn)}
.agn{flex:1;min-width:0}
.agn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agr{font-size:11.5px;color:var(--gray)}
.agd{font-size:12px;font-weight:700;color:var(--blue);white-space:nowrap}
.aga{display:flex;gap:6px;align-items:center}
.aga .wa{background:var(--ok);color:var(--white);border-radius:var(--r-sm);padding:6px 11px;font-size:11.5px;font-weight:600;text-decoration:none}

.isub{display:flex;gap:6px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:8px}

.iadd.ne{align-items:flex-end}
.iadd.ne select,.iadd.ne input{border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;background:var(--white)}
.nesched{display:flex;flex-direction:column;gap:4px}
.nesched label{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);font-weight:700}

.nesched input{border:1px solid var(--red)!important;background:var(--pastelRed)!important}
.nesched input.ok{border-color:var(--line)!important;background:var(--white)!important}
.dtwrap{display:flex;gap:6px}

.dica{margin-top:6px;font-size:11.5px;line-height:1.45;color:var(--blue);background:var(--pastelBlue);border-radius:var(--r-md);padding:6px 9px}

.nestreak.hot{background:var(--pastelRed);border-color:var(--dangerLine);color:var(--redDark)}
/* tag de agenda no card */
.agt{border-radius:var(--r-pill);padding:1px 7px;font-size:10.5px;font-weight:700;white-space:nowrap}
.agt.late{background:var(--pastelRed);color:var(--redDark)}
.agt.today{background:var(--warnBg);color:var(--warn)}

.pvbox{border:1px solid var(--grayLine);border-radius:var(--r-md);padding:12px;margin:14px 0 0}

.pvi .pvd{margin-left:auto;color:var(--gray);font-size:12px;white-space:nowrap}
.pvi.late{background:var(--pastelRed)}
.pvi.ok{background:#E9F5EE}
.pvi .pvr{font-size:11px;font-weight:700;padding:1px 7px;border-radius:var(--r-pill);background:var(--white)}
.pvform{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.pvform .pvrow{display:flex;gap:8px;flex-wrap:wrap}
.pvform select,.pvform input,.pvform textarea{flex:1;min-width:140px;font-size:16px;padding:9px 10px;border:1px solid var(--grayLine);border-radius:var(--r-sm);font-family:inherit}

@media(max-width:860px){

/* ================= Estado ================= */
let tab='escolas';
const DATA={escolas:null,empresas:null,leads:null};
/* Presets de periodo da aba B2C. O recorte e' sobre a DATA DE CADASTRO do lead. */
const PERIODOS=[['hoje','Hoje'],['7','Últimos 7 dias'],['15','Últimos 15 dias'],['30','Últimos 30 dias'],['mes','Mês atual'],['custom','Período específico'],['tudo','Todo o histórico']];
function fimDoMes(iso){const y=+iso.slice(0,4),m=+iso.slice(5,7);const d=new Date(Date.UTC(y,m,0));return d.toISOString().slice(0,10);}
function periodoRange(pp){
  const h=hojeISO();
  if(pp==='hoje')return [h,h];
  if(pp==='7')return [addDias(h,-6),h];
  if(pp==='15')return [addDias(h,-14),h];
  if(pp==='30')return [addDias(h,-29),h];
  if(pp==='mes')return [h.slice(0,8)+'01',fimDoMes(h)];
  return [null,null];
}
function emptyFilters(){
  const f={q:'',prio:null,tipo:null,resp:null,ag:null,per:null,entradaDe:null,entradaAte:null,proxDe:null,proxAte:null};
  if(tab==='leads'){const r=periodoRange('mes');f.per='mes';f.entradaDe=r[0];f.entradaAte=r[1];}
  return f;
}
let filters=emptyFilters();
let editing=null;   // id em edição ou null (novo)
let dragId=null;
let DUPWA={};       // whatsapp (só dígitos) -> quantas vezes aparece na base

function safeGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},2600);}

let currentUser=null;
function SF(cfg){return cfg.statusField||'status';}
function NF(cfg){return cfg.nextField||'proximo_contato';}
function addDias(iso,n){const p=String(iso).split('-');const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function isMobile(){return window.matchMedia('(max-width:640px)').matches;}

/* Normaliza telefone pra busca: só dígitos, sem DDI 55 e sem zero de operadora */
function phoneKey(v){
  var d=String(v||'').replace(/\D/g,'');
  if(d.length>11&&d.slice(0,2)==='55')d=d.slice(2);
  if(d.length>11&&d.charAt(0)==='0')d=d.slice(1);
  return d;
}
/* true quando o que foi digitado parece um número de telefone */
function isPhoneQuery(q){
  return /^[\d\s()+.\-]+$/.test(q)&&q.replace(/\D/g,'').length>=4;
}
function TF(cfg){return cfg.tipoField||'tipo';}

/* ================= Carregamento ================= */
async function loadTab(force){
  const cfg=CFG[tab];
  if(DATA[tab]&&!force){render();return;}
  $('board').innerHTML='<div class="loading">Carregando dados do Supabase...</div>';
  try{
    DATA[tab]=await api('/'+cfg.table+'?select=*&order=nome.asc');
    if(tab==='leads')await loadTarefas();
    render();
  }catch(e){
    $('board').innerHTML='<div class="loading">Não foi possível carregar os dados. Verifique a conexão e toque em ↻ para tentar de novo.<br><small>'+esc(e.message).slice(0,180)+'</small></div>';
  }
}

/* ================= Render ================= */
function phone(v){return String(v||'').replace(/\D/g,'');}
function waLink(v){
  let d=phone(v);
  if(!d)return null;
  if((d.length===10||d.length===11)&&d.slice(0,2)!=='55')d='55'+d;
  return 'https://wa.me/'+d;
}
function igLink(v){
  if(!v)return null;
  v=String(v).trim();
  if(v.indexOf('http')===0)return v;
  return 'https://instagram.com/'+v.replace(/^@/,'');
}

function matches(s){
  const cfg=CFG[tab];
  if(filters.prio&&s[cfg.prioField]!==filters.prio)return false;
  if(filters.tipo&&s[TF(cfg)]!==filters.tipo)return false;
  if(filters.resp&&(s.responsavel||'')!==filters.resp)return false;
  if(filters.entradaDe&&(s.data_entrada||'')<filters.entradaDe)return false;
  if(filters.entradaAte&&(s.data_entrada||'9999-99-99')>filters.entradaAte)return false;
  const _nf=NF(CFG[tab]);
  if(filters.proxDe&&(s[_nf]||'')<filters.proxDe)return false;
  if(filters.proxAte&&(s[_nf]||'9999-99-99')>filters.proxAte)return false;
  if(filters.ag){
    const _d=s[_nf]||'',_h=hojeISO();
    if(filters.ag==='atrasado'&&!(_d&&_d<_h))return false;
    if(filters.ag==='hoje'&&_d!==_h)return false;
    if(filters.ag==='semana'&&!(_d&&_d<=addDias(_h,7)))return false;
    if(filters.ag==='sem'&&_d)return false;
  }
  if(filters.q){
    // busca por número: compara só os dígitos, ignorando (), -, espaço e o DDI 55
    if(isPhoneQuery(filters.q)){
      const qk=phoneKey(filters.q);
      const alvo=[s.whatsapp,s.telefone].map(phoneKey);
      if(alvo.some(function(d){return d&&d.indexOf(qk)>-1;}))return true;
    }
    const blob=Object.keys(s).map(function(k){return s[k];}).join(' ').toLowerCase();
    if(blob.indexOf(filters.q)===-1)return false;
  }
  return true;
}

function render(){
  const cfg=CFG[tab];
  const list=(DATA[tab]||[]).filter(matches);

  // stats
  const all=DATA[tab]||[];
  const fechadas=all.filter(function(s){const st=cfg.stages.find(function(x){return x.id===s[SF(cfg)];});return st&&st.ok;}).length;
  const andamento=all.filter(function(s){const st=cfg.stages.find(function(x){return x.id===s[SF(cfg)];});return st&&!st.ok&&!st.off&&s[SF(cfg)]!==cfg.stages[0].id;}).length;
  $('stats').innerHTML=
    '<div class="stat"><b>'+all.length+'</b><span>'+cfg.plural+'</span></div>'+
    '<div class="stat"><b>'+andamento+'</b><span>Em andamento</span></div>'+
    '<div class="stat"><b>'+fechadas+'</b><span>Fechadas</span></div>';

  // Numero repetido (só faz sentido na base de leads)
  DUPWA={};
  if(tab==='leads'){
    const cont={};
    all.forEach(function(s){const k=phoneKey(s.whatsapp);if(k.length>=8)cont[k]=(cont[k]||0)+1;});
    Object.keys(cont).forEach(function(k){if(cont[k]>1)DUPWA[k]=cont[k];});
  }

  const board=$('board');
  board.innerHTML='';

  // No celular, buscar num kanban de 7 colunas é sofrível:
  // com busca ativa mostramos uma lista única de resultados.
  if(isMobile()&&filters.q){
    renderStageNav(null);
    const col=document.createElement('div');
    col.className='col res';
    col.style.setProperty('--cc','#19408B');
    const rot=isPhoneQuery(filters.q)?'Resultados por número':'Resultados da busca';
    col.innerHTML='<div class="colh"><h2>'+rot+'</h2><span class="n">'+list.length+'</span></div>';
    const wrap=document.createElement('div');
    wrap.className='cards';
    if(!list.length){wrap.innerHTML='<div class="empty">Nada encontrado para “'+esc(filters.q)+'”.<br>Tente só os 8 últimos dígitos do número.</div>';}
    list.forEach(function(s){
      const st=cfg.stages.find(function(x){return x.id===(s[SF(cfg)]||cfg.stages[0].id);})||cfg.stages[0];
      wrap.appendChild(cardEl(s,st,true));
    });
    col.appendChild(wrap);
    board.appendChild(col);
    return;
  }

  cfg.stages.forEach(function(st){
    const col=document.createElement('div');
    col.className='col'+(st.ok?' ok':'');
    col.dataset.s=st.id;
    col.style.setProperty('--cc',st.c);
    const items=list.filter(function(s){return (s[SF(cfg)]||cfg.stages[0].id)===st.id;});
    col.innerHTML='<div class="colh"><h2>'+esc(st.n)+'</h2><span class="n">'+items.length+'</span></div>';
    const wrap=document.createElement('div');
    wrap.className='cards';
    if(!items.length){wrap.innerHTML='<div class="empty">Nenhum registro</div>';}
    items.forEach(function(s){wrap.appendChild(cardEl(s,st));});
    col.appendChild(wrap);

    // drop target
    col.addEventListener('dragover',function(e){e.preventDefault();col.classList.add('drop');});
    col.addEventListener('dragleave',function(){col.classList.remove('drop');});
    col.addEventListener('drop',function(e){
      e.preventDefault();col.classList.remove('drop');
      if(dragId)moveTo(dragId,st.id);
    });
    board.appendChild(col);
  });

  renderStageNav(list);
}

/* Navegador de etapas — só aparece no celular, onde o kanban rola na horizontal */
function renderStageNav(list){
  const nav=$('stagenav');
  if(!list){nav.innerHTML='';nav.style.display='none';return;}
  const cfg=CFG[tab];
  nav.style.display='';
  nav.innerHTML=cfg.stages.map(function(st,i){
    const n=list.filter(function(s){return (s[SF(cfg)]||cfg.stages[0].id)===st.id;}).length;
    return '<button data-i="'+i+'" style="--sc:'+st.c+'"><i></i>'+esc(st.n)+' <b>'+n+'</b></button>';
  }).join('');
  nav.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      const col=$('board').children[+b.dataset.i];
      if(col)$('board').scrollTo({left:col.offsetLeft-12,behavior:'smooth'});
    };
  });
  syncStageNav();
}

function syncStageNav(){
  const nav=$('stagenav');
  if(!nav.children.length)return;
  const board=$('board');
  const x=board.scrollLeft+board.clientWidth/2;
  let best=0,bd=Infinity;
  for(let i=0;i<board.children.length;i++){
    const c=board.children[i];
    const d=Math.abs(c.offsetLeft+c.offsetWidth/2-x);
    if(d<bd){bd=d;best=i;}
  }
  Array.prototype.forEach.call(nav.children,function(b,i){b.classList.toggle('on',i===best);});
  const at=nav.children[best];
  if(at)nav.scrollTo({left:at.offsetLeft-nav.clientWidth/2+at.offsetWidth/2,behavior:'smooth'});
}

function cardEl(s,st,showStage){
  const cfg=CFG[tab];
  const wk=phoneKey(s.whatsapp);
  const dup=wk&&DUPWA[wk]?DUPWA[wk]:0;
  const c=document.createElement('div');
  const _pd=s[NF(cfg)]||'',_hj=hojeISO();
  var agTag='';
  if(_pd){
    if(_pd<_hj)agTag='<span class="agt late">&#9200; atrasado '+brDate(_pd)+'</span>';
    else if(_pd===_hj)agTag='<span class="agt today">&#9200; hoje</span>';
    else agTag='<span class="agt soon">&#9200; '+brDate(_pd).slice(0,5)+'</span>';
  }
  var pvTag='';
  if(tab==='leads'){const _pv=pvStatus(s);if(_pv)pvTag='<span class="agt '+_pv.cls+'">&#127891; '+esc(_pv.txt)+'</span>';}
  c.className='card'+(_pd&&_pd<_hj?' late':'');
  c.draggable=true;
  const pr=cfg.prios.find(function(p){return p[0]===s[cfg.prioField];})||cfg.prios[1];
  const resp=s.responsavel;
  const av=resp?'<span class="avatar" title="Responsável: '+esc(resp)+'" style="background:'+(RESPC[resp]||'#5A5A5A')+'">'+esc(resp[0])+'</span>':'';
  const sub=cfg.sub(s);
  const dec=s.decisor||s.contato_nome;
  const wa=waLink(s.whatsapp||s.telefone);
  const telD=phone(s.telefone);
  const ig=igLink(s.instagram);

  const idx=cfg.stages.findIndex(function(x){return x.id===st.id;});
  const prev=idx>0?cfg.stages[idx-1]:null;
  const next=idx<cfg.stages.length-1?cfg.stages[idx+1]:null;

  c.innerHTML=
    '<div class="top"><span class="dot '+pr[2]+'" title="'+esc(pr[1])+'"></span><h3>'+esc(s.nome)+'</h3>'+av+'</div>'+
    '<div class="meta">'+
      (sub?'<span>'+esc(sub)+'</span>':'')+
      (dec?'<span class="sep">·</span><span>'+esc(dec)+'</span>':'')+
      (s.rating?'<span class="sep">·</span><span>★ '+esc(s.rating)+'</span>':'')+
      '<span class="tag">'+esc((cfg.tipos.find(function(t){return t[0]===s[TF(cfg)];})||['',s[TF(cfg)]||''])[1])+'</span>'+
      (showStage?'<span class="stg" style="--sc:'+st.c+'">'+esc(st.n)+'</span>':'')+
      (dup?'<span class="dupw" title="Esse número aparece em '+dup+' cadastros">⚠ '+dup+'x mesmo número</span>':'')+
      agTag+pvTag+
    '</div>'+
    '<div class="acts">'+
      (wa?'<a class="wa" aria-label="WhatsApp" target="_blank" rel="noopener" href="'+wa+'">'+WAICO+'</a>':(telD?'<a class="tel" href="tel:+'+(telD.length<=11?'55':'')+telD+'">Ligar</a>':''))+
      (ig?'<a class="ig" target="_blank" rel="noopener" href="'+esc(ig)+'">Insta</a>':'')+
      '<div class="mv">'+
        (prev?'<button title="Voltar para '+esc(prev.n)+'" data-mv="'+prev.id+'">◀</button>':'')+
        (next?'<button title="Avançar para '+esc(next.n)+'" data-mv="'+next.id+'">▶</button>':'')+
      '</div>'+
    '</div>';

  c.addEventListener('dragstart',function(e){
    dragId=s.id;c.classList.add('dragging');
    try{e.dataTransfer.setData('text/plain',s.id);e.dataTransfer.effectAllowed='move';}catch(_){}
  });
  c.addEventListener('dragend',function(){c.classList.remove('dragging');dragId=null;});
  c.addEventListener('click',function(e){
    const mv=e.target.getAttribute&&e.target.getAttribute('data-mv');
    if(mv){moveTo(s.id,mv);return;}
    if(e.target.tagName==='A')return;
    openModal(s.id);
  });
  return c;
}


/* ================= Pós-venda (matrícula fechada) ================= */
const NIVEIS=['Yard 1','Yard 2','Garden 1','Garden 2','Garden 3','Garden 4',
  'Fun 1','Fun 2','Fun 3','Fun 4','Kids 1','Kids 2','Kids 3','Kids 4',
  'Teen Up 1','Teen Up 2','Teen Up 3','Teen Up 4','Teen Up 5','Teen Up 6',
  'Fly','Progression','Expansion','Gold','Platinum','Senior','Turbo','ACC',
  'En Contacto 1','En Contacto 2','En Contacto 3','En Contacto 4','En Contacto 5','CAC'];

/* off = dias em relação ao início das aulas · dir = para onde empurrar se cair em fim de semana */
const PV=[
  {tipo:'pos_venda_vespera',n:'Véspera do início',off:-1,dir:-1},
  {tipo:'pos_venda_d7',n:'7 dias de aula',off:7,dir:1},
  {tipo:'pos_venda_d14',n:'14 dias de aula',off:14,dir:1}
];
const PV_RESULT={ok:'Tudo certo',com_ressalva:'Com ressalva',risco_cancelamento:'Risco de cancelamento'};
const PV_CANAL={ligacao:'Ligação',whatsapp:WAICO,presencial:'Presencial'};
let TAREFAS={};   /* lead_id -> [tarefa] */

function pvNome(t){const x=PV.find(function(p){return p.tipo===t;});return x?x.n:'Pós-venda';}
function dowISO(iso){const p=String(iso).split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay();}
function ajustaFDS(iso,dir){
  var d=iso,n=0;
  while((dowISO(d)===0||dowISO(d)===6)&&n<3){d=addDias(d,dir>0?1:-1);n++;}
  return d;
}
function calcPosVenda(inicio){
  return PV.map(function(p){return {tipo:p.tipo,data:ajustaFDS(addDias(inicio,p.off),p.dir)};});
}

async function loadTarefas(){
  try{
    const rows=await api('/crm_tarefas?select=*&order=data_prevista.asc');
    const m={};
    (rows||[]).forEach(function(t){(m[t.lead_id]=m[t.lead_id]||[]).push(t);});
    TAREFAS=m;
  }catch(e){TAREFAS={};}
}

/* Cria ou realinha as tarefas do lead. Idempotente: unique (lead_id,tipo) no banco. */
async function syncPosVenda(lead){
  if(!lead||lead.etapa!=='fechado'||!lead.data_inicio_aulas)return;
  const alvo=calcPosVenda(lead.data_inicio_aulas);
  const atuais=TAREFAS[lead.id]||[];
  const hoje=hojeISO();
  for(var i=0;i<alvo.length;i++){
    const a=alvo[i];
    const ex=atuais.find(function(t){return t.tipo===a.tipo;});
    if(ex){
      if(ex.status==='concluida')continue;                 /* feita fica com a data original */
      if(ex.status==='pendente'&&ex.data_prevista===a.data)continue;
      try{
        const r=await api('/crm_tarefas?id=eq.'+ex.id,{method:'PATCH',body:JSON.stringify({
          status:'pendente',data_prevista:a.data,responsavel:ex.responsavel||lead.responsavel||currentUser,
          updated_at:new Date().toISOString()})});
        if(r&&r[0])Object.assign(ex,r[0]);
      }catch(e){}
      continue;
    }
    /* a véspera só nasce se ainda estiver no futuro */
    if(a.tipo==='pos_venda_vespera'&&a.data<hoje)continue;
    try{
      const r=await api('/crm_tarefas',{method:'POST',body:JSON.stringify({
        lead_id:lead.id,tipo:a.tipo,data_prevista:a.data,
        responsavel:lead.responsavel||currentUser,status:'pendente'})});
      if(r&&r[0])atuais.push(r[0]);
    }catch(e){}
  }
  TAREFAS[lead.id]=atuais;
}

/* Lead saiu de "Matrícula fechada": pendências deixam de fazer sentido. */
async function cancelPosVenda(lead){
  if(!lead)return;
  const atuais=(TAREFAS[lead.id]||[]).filter(function(t){return t.status==='pendente';});
  for(var i=0;i<atuais.length;i++){
    try{
      await api('/crm_tarefas?id=eq.'+atuais[i].id,{method:'PATCH',body:JSON.stringify({status:'cancelada',updated_at:new Date().toISOString()})});
      atuais[i].status='cancelada';
    }catch(e){}
  }
}

/* Sub-status mostrado no card da coluna Matrícula fechada */
function pvStatus(lead){
  if(!lead||lead.etapa!=='fechado')return null;
  if(!lead.data_inicio_aulas)return {txt:'Definir início das aulas',cls:'late'};
  const ts=(TAREFAS[lead.id]||[]).filter(function(t){return t.status==='pendente';})
    .sort(function(a,b){return a.data_prevista<b.data_prevista?-1:1;});
  if(!ts.length)return {txt:'Pós-venda concluído',cls:'done'};
  const t=ts[0],hj=hojeISO();
  return {txt:pvNome(t.tipo)+' · '+brDate(t.data_prevista).slice(0,5),
          cls:t.data_prevista<hj?'late':(t.data_prevista===hj?'today':'soon')};
}

function renderPV(lead){
  const box=$('pvbox');
  if(!box)return;
  if(!lead||lead.etapa!=='fechado'){box.style.display='none';box.innerHTML='';return;}
  box.style.display='';
  if(!lead.data_inicio_aulas){
    box.innerHTML='<h4>Pós-venda</h4><p class="pvsub">Preencha <b>Início das aulas</b>, <b>Nível</b> e <b>Turma</b> acima e salve. '
      +'Os três contatos (véspera, 7 e 14 dias) são agendados automaticamente.</p>';
    return;

      +'<div class="pvrow"><button class="btn primary" id="pvok">Registrar contato</button></div>'
      +'</div>';
  }
  box.innerHTML='<h4>Pós-venda</h4>'
    +'<p class="pvsub">Início das aulas '+brDate(lead.data_inicio_aulas)
    +(lead.nivel?' · '+esc(lead.nivel):'')+(lead.turma?' · turma '+esc(lead.turma):'')
    +' · responsável '+esc((ts[0]&&ts[0].responsavel)||lead.responsavel||'—')+'</p>'

    +(form||'<p class="pvsub" style="margin:10px 0 0">Pós-venda concluído.</p>');
  if(prox){$('pvok').onclick=function(){pvConcluir(lead,prox.id);};}
}

async function pvConcluir(lead,tid){
  const btn=$('pvok');
  if(!btn||btn.disabled)return;
  const res=$('pvres').value,canal=$('pvcanal').value,obs=$('pvobs').value.trim();
  if(!res){toast('Escolha como foi o contato.');return;}
  if(res!=='ok'&&!obs){toast('Descreva o que aconteceu antes de registrar.');return;}
  btn.disabled=true;const lbl=btn.textContent;btn.textContent='Registrando…';
  const t=(TAREFAS[lead.id]||[]).find(function(x){return x.id===tid;});
  try{
    const r=await api('/crm_tarefas?id=eq.'+tid,{method:'PATCH',body:JSON.stringify({
      status:'concluida',resultado:res,canal:canal||null,observacao:obs||null,
      concluida_em:new Date().toISOString(),concluida_por:currentUser,
      updated_at:new Date().toISOString()})});
    if(t&&r&&r[0])Object.assign(t,r[0]);
    /* o histórico do lead continua sendo a fonte única de verdade */
    try{
      await api('/crm_leads_interacoes',{method:'POST',body:JSON.stringify({
        lead_id:lead.id,data:hojeISO(),autor:currentUser,tipo:canal==='presencial'?'visita':(canal||'nota'),
        efetivo:true,nota:'Pós-venda ('+pvNome(t?t.tipo:'')+') · '+(PV_RESULT[res]||res)+(obs?' · '+obs:'')})});
      loadInts(lead.id);
    }catch(e){}
    if(res==='risco_cancelamento')toast('Risco de cancelamento registrado. Avise a coordenação hoje.');
    else toast('Pós-venda registrado.');
    renderPV(lead);render();loadAlerts();
  }catch(e){
    toast('Não foi possível registrar. Tente de novo.');
  }finally{if($('pvok')){$('pvok').disabled=false;$('pvok').textContent=lbl;}}
}

async function moveTo(id,stage){
  const cfg=CFG[tab];
  const sf=SF(cfg);
  const s=(DATA[tab]||[]).find(function(x){return x.id===id;});
  if(!s||s[sf]===stage)return;
  const old=s[sf];
  const oldFech=s.data_fechamento;
  s[sf]=stage;
  const body={updated_at:new Date().toISOString()};
  body[sf]=stage;
  if(tab==='leads'){
    const st=cfg.stages.find(function(x){return x.id===stage;});
    body.data_fechamento=(st&&(st.ok||st.off))?new Date().toISOString().slice(0,10):null;
    s.data_fechamento=body.data_fechamento;
  }
  render();
  try{
    await api('/'+cfg.table+'?id=eq.'+id,{method:'PATCH',body:JSON.stringify(body)});
    if(tab==='leads')logEtapa(id,stage);
    if(tab==='leads'){
      if(stage==='fechado'){
        if(!s.data_inicio_aulas){toast('Informe início das aulas, nível e turma para abrir o pós-venda.');openModal(id);}
        else{await syncPosVenda(s);render();}
      }else if(old==='fechado'){await cancelPosVenda(s);render();}
    }
    if(tab==='leads'&&stage==='perdido'&&!s.motivo_perda){
      toast('Registre o motivo da perda na ficha.');
      openModal(id);
    }
  }catch(e){
    s[sf]=old;s.data_fechamento=oldFech;render();toast('Não foi possível mover. Tente de novo.');
  }
}

/* Faixa etaria -> estagio de entrada. O mapa de turmas usa a grafia do CNA Box
   (A1.1/FLY 1, PADV 1, YOUNG KIDS 3/FUN 3), entao o casamento e' por faixa, nao por nome exato. */
function faixaIdade(n){
  if(n<3)return {cedo:true};
  if(n<=4)return {f:'Yard',ent:'Yard 1'};
  if(n<=6)return {f:'Garden',ent:'Garden 1'};
  if(n<=8)return {f:'Fun',ent:'Fun 1'};
  if(n<=10)return {f:'Kids',ent:'Kids 1'};
  if(n<=12)return {f:'Teen Up',ent:'Teen Up 1'};
  if(n<50)return {f:'Jovens e adultos',ent:'Fly'};
  return {f:'Senior',ent:'Senior',tb:'Jovens e adultos'};
}
function faixaTurma(c){
  const u=String(c||'').toUpperCase();
  if(u.indexOf('CONTACTO')>=0||u.indexOf('CAC')>=0)return 'Espanhol';
  if(u.indexOf('YARD')>=0)return 'Yard';
  if(u.indexOf('GARDEN')>=0)return 'Garden';
  if(u.indexOf('FUN')>=0)return 'Fun';
  if(u.indexOf('TEEN')>=0)return 'Teen Up';
  if(u.indexOf('KIDS')>=0)return 'Kids';
  if(u.indexOf('SENIOR')>=0)return 'Senior';
  if(/FLY|QUEST|PROGRESS|EXPANS|PADV|ADV|MASTER|GOLD|PLATIN|A1\.|A2\.|B1|B2/.test(u))return 'Jovens e adultos';
  return '';
}
function vagasTurma(t){return t.sem_vaga?0:Math.max(0,(t.capacidade||16)-(t.alunos||0));}
/* Dica ao lado da idade: estagio de entrada + turmas do mapa com vaga naquela faixa */
async function syncFaixa(){
  const w=$('fIdade');
  if(!w)return;
  let el=w.querySelector('.dica');
  if(!el){el=document.createElement('div');el.className='dica';w.appendChild(el);}
  const n=idadeForm();
  if(n===null||n<1||n>120){el.style.display='none';return;}
  el.style.display='';el.classList.remove('alerta');
  const selC=document.querySelector('#form [data-k=curso]');
  const curso=selC?selC.value:'';
  if(curso==='Espanhol'){
    if(n<13){el.classList.add('alerta');el.innerHTML='En Contacto começa aos 13 anos. Nessa idade o caminho é o inglês.';}
    else el.innerHTML='Entrada em <b>En Contacto 1</b>.';
    return;
  }
  const fx=faixaIdade(n);
  if(fx.cedo){el.classList.add('alerta');el.innerHTML='O CNA Yard começa aos 3 anos.';return;}
  el.innerHTML='Faixa <b>'+esc(fx.f)+'</b> · entrada em <b>'+esc(fx.ent)+'</b>';
  let rows=[];
  try{rows=(await turmasCache())||[];}catch(e){return;}
  if(idadeForm()!==n)return;   /* a idade mudou enquanto o mapa carregava */
  const sem=(typeof tSemestre!=='undefined'&&tSemestre)?tSemestre:null;
  const alvo={};alvo[fx.f]=1;if(fx.tb)alvo[fx.tb]=1;
  const nomes=[];
  rows.forEach(function(t){
    if(sem&&t.semestre!==sem)return;
    if(!alvo[faixaTurma(t.curso)])return;
    if(vagasTurma(t)<=0)return;
    const c=String(t.curso||'').toUpperCase();
    if(nomes.indexOf(c)<0)nomes.push(c);
  });
  nomes.sort();
  const lista=nomes.slice(0,5).join(', ')+(nomes.length>5?' e mais '+(nomes.length-5):'');
  el.innerHTML+=nomes.length
    ?'<br>Com vaga hoje: <b>'+esc(lista)+'</b>'
    :'<br>Nenhuma turma dessa faixa com vaga no mapa.';
}

/* Lista de turmas do mapa, agrupada por nivel, para o campo Turma da ficha do lead */
var TCACHE=null;
async function turmasCache(){
  if(TCACHE)return TCACHE;
  try{
    TCACHE=await api('/crm_turmas?select=curso,dias,horario,sala,professor,alunos,capacidade,sem_vaga,semestre'
      +'&ativa=eq.true&order=curso.asc,dias.asc,horario.asc')||[];
  }catch(e){TCACHE=[];}
  return TCACHE;
}
function turmaValor(t){
  return (t.curso||'?')+' · '+(t.dias||'')+' '+(t.horario||'')+' · '+(t.sala||'');
}
async function fillTurmas(sel,atual){
  if(!sel)return;
  const rows=await turmasCache();
  const sem=(typeof tSemestre!=='undefined'&&tSemestre)?tSemestre:null;
  const lista=rows.filter(function(t){return !sem||t.semestre===sem;});
  const grupos={},ordem=[];
  lista.forEach(function(t){
    const g=String(t.curso||'Sem nível').toUpperCase();
    if(!grupos[g]){grupos[g]=[];ordem.push(g);}
    grupos[g].push(t);
  });
  ordem.sort(function(a,b){return a.localeCompare(b,'pt-BR');});
  var achou=false,h='<option value="">— sem turma —</option>';
  ordem.forEach(function(g){
    h+='<optgroup label="'+esc(g)+'">';
    grupos[g].forEach(function(t){
      const val=turmaValor(t);
      if(val===atual)achou=true;
      const vg=t.sem_vaga?0:Math.max(0,(t.capacidade||16)-(t.alunos||0));
      const rot=(t.dias||'')+' '+(t.horario||'')+' · '+(t.sala||'')
        +(t.professor?' · '+t.professor:'')
        +' · '+(vg>0?vg+(vg>1?' vagas':' vaga'):'sem vaga');
      h+='<option value="'+esc(val)+'"'+(val===atual?' selected':'')+'>'+esc(rot)+'</option>';
    });
    h+='</optgroup>';
  });
  if(atual&&!achou)h='<option value="'+esc(atual)+'" selected>'+esc(atual)+' (fora do mapa)</option>'+h;
  sel.innerHTML=h;
}

async function loadInts(id){

    for(var k=0;k<ints.length;k++){if(ints[k].efetivo===false)seq++;else break;}

        +(ne?'<span class="itipo nef">Não efetivo'+(i.motivo_nao_efetivo?' · '+esc(MOTIVOS_NE[i.motivo_nao_efetivo]||i.motivo_nao_efetivo):'')+'</span>':'')
        +'<span>'+ds+'</span></div>'
        +'<p>'+(txt||'<i>sem observação</i>')+'</p>'
        +(i.proximo_contato?'<div class="iprox">&#9200; Próximo contato agendado: '+brDate(i.proximo_contato)+(i.proximo_contato_hora?' às '+String(i.proximo_contato_hora).slice(0,5):'')+(i.proximo_canal?' · '+esc(canalNome(i.proximo_canal)):'')+'</div>':'')

/* O canal do proximo contato herda o canal do contato que acabou de ser registrado,
   ate alguem trocar na mao. Fricao zero no caso comum. */
var canalTocado={ef:false,ne:false};
function espelhaCanal(origem,destino,flag){
  const o=$(origem),d=$(destino);
  if(!o||!d)return;
  o.addEventListener('change',function(){
    if(canalTocado[flag])return;
    if(CANAIS[o.value])d.value=o.value;
  });
  d.addEventListener('change',function(){canalTocado[flag]=true;});
}

$('save').onclick=async function(){
  const sbtn=$('save');
  if(sbtn.disabled)return; // trava anti duplo-envio
  const cfg=CFG[tab];
  const body={};
  document.querySelectorAll('#form [data-k]').forEach(function(el){
    body[el.getAttribute('data-k')]=el.value.trim()===''?null:el.value.trim();
  });
  if(!body.nome){toast('O nome é obrigatório.');return;}
  if(tab==='leads'){
    if(body.etapa!=='perdido')body.motivo_perda=null;
    else if(!body.motivo_perda){toast('Escolha o motivo da perda.');syncPerda();return;}
    if(body.idade!=null){
      const idn=parseInt(body.idade,10);
      if(isNaN(idn)||idn<1||idn>120){toast('Idade inválida. Informe um número entre 1 e 120.');return;}
      body.idade=idn;
      if(idn<18&&!body.responsavel_legal){
        syncResp(true);
        const rl=document.querySelector('#form [data-k=responsavel_legal]');
        if(rl)rl.focus();
        toast('Aluno menor de 18 anos: informe o nome do responsável pelo aluno.');
        return;
      }
    }
  }
  var semHora=null;
  cfg.fields.forEach(function(f){
    if(f.t!=='datetime')return;
    if(!body[f.k]){body[f.hk]=null;return;}
    if(!body[f.hk])semHora=f.l;
  });
  if(semHora){
    document.querySelectorAll('#form .dtwrap').forEach(function(w){
      const di=w.querySelector('input[type=date]'),hi=w.querySelector('input[type=time]');
      hi.classList.toggle('need',!!di.value&&!hi.value);
    });
    toast('Informe a hora de "'+semHora+'". O alerta dispara na data e hora marcadas.');
    return;
  }
  // Checagem de numero duplicado (só na criação de lead)
  if(tab==='leads'&&!editing&&body.whatsapp){
    const dig=function(v){return String(v||'').replace(/\D/g,'');};
    const w=dig(body.whatsapp);
    if(w.length>=8){
      const dup=(DATA.leads||[]).find(function(x){return dig(x.whatsapp)===w;});
      if(dup){toast('Já existe um lead com esse número: '+dup.nome+'. Abra o card existente para editar.');return;}
    }
  }
  if(tab==='leads'){
    const stFin=body.etapa==='fechado'||body.etapa==='perdido';
    const cur=editing?(DATA.leads||[]).find(function(x){return x.id===editing;}):null;
    body.data_fechamento=stFin?((cur&&cur.data_fechamento)||new Date().toISOString().slice(0,10)):null;
    if(body.etapa!=='perdido')body.motivo_perda=null;
  }
  sbtn.disabled=true;
  const sbl=sbtn.textContent;
  sbtn.textContent='Salvando…';
  try{
    if(editing){
      const antes=(DATA[tab]||[]).find(function(x){return x.id===editing;});
      const etapaAntes=antes?antes[SF(cfg)]:null;
      body.updated_at=new Date().toISOString();
      const res=await api('/'+cfg.table+'?id=eq.'+editing,{method:'PATCH',body:JSON.stringify(body)});
      const idx=DATA[tab].findIndex(function(x){return x.id===editing;});
      if(idx>-1&&res&&res[0])DATA[tab][idx]=res[0];
      if(tab==='leads'&&body.etapa&&body.etapa!==etapaAntes)logEtapa(editing,body.etapa);
    }else{
      const res=await api('/'+cfg.table,{method:'POST',body:JSON.stringify(body)});
      if(res&&res[0]){DATA[tab].push(res[0]);editing=res[0].id;$('ints').style.display='';loadInts(editing);$('del').style.display='';
        if(tab==='leads')logEtapa(editing,res[0].etapa||'novo');}
    }
    if(tab==='leads'&&editing){
      const cur=(DATA.leads||[]).find(function(x){return x.id===editing;});
      if(cur){
        if(cur.etapa==='fechado')await syncPosVenda(cur);else await cancelPosVenda(cur);
        renderPV(cur);loadAlerts();
      }
    }
    render();
    $('savedmsg').style.display='inline';
    setTimeout(function(){$('savedmsg').style.display='none';},1800);
  }catch(e){toast('Erro ao salvar: '+e.message.slice(0,120));}
  finally{sbtn.disabled=false;sbtn.textContent=sbl;}
};

let USERS=[];
let loginSel=null;

function sha256js(ascii){
  function rr(v,c){return (v>>>c)|(v<<(32-c));}
  var mw=Math.pow(2,32),i,j,result='';
  var words=[],len=ascii.length*8;
  var hash=sha256js.h=sha256js.h||[],k=sha256js.k=sha256js.k||[],pc=k.length;
  var isC={};
  for(var cand=2;pc<64;cand++){
    if(!isC[cand]){
      for(i=0;i<313;i+=cand)isC[i]=true;
      hash[pc]=(Math.pow(cand,.5)*mw)|0;
      k[pc++]=(Math.pow(cand,1/3)*mw)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    j=ascii.charCodeAt(i);
    if(j>>8)return'';
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(len/mw)|0;
  words[words.length]=len;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oh=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^(~e&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0;
  }
  for(i=0;i<8;i++)for(j=3;j+1;j--){
    var b=(hash[i]>>(j*8))&255;
    result+=((b<16)?0:'')+b.toString(16);
  }
  return result;
}
async function sha256(txt){
  if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
    try{
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    }catch(e){}
  }
  return sha256js(unescape(encodeURIComponent(txt)));
}

async function tryLogin(){
  try{
    if(!loginSel){$('lerr').textContent='Escolha seu nome.';return;}
    const pin=$('pin').value.trim();
    if(!pin){$('lerr').textContent='Digite seu PIN.';return;}
    const u=USERS.find(function(x){return x.nome===loginSel;});
    const hash=await sha256(pin);
    if(!hash){$('lerr').textContent='Não foi possível validar o PIN neste navegador.';return;}
    if(!u||hash!==u.pin_hash){$('lerr').textContent='PIN incorreto.';$('pin').value='';return;}
    currentUser=u.nome;
    safeSet('crmAuth',u.nome);
    entrar();
  }catch(e){
    $('lerr').textContent='Erro ao entrar: '+(e&&e.message?e.message:e);
  }
}

async function loadAlerts(){
  if(!currentUser)return;
  /* funil olha 3 dias a frente; pos-venda e' agendado semanas antes, entao tem janela propria */
  const hoje=hojeISO(),limite=addDias(hoje,3),limitePV=addDias(hoje,30);
  const itens=[];
  const keys=Object.keys(AGCFG);
  for(var i=0;i<keys.length;i++){

    try{
      const rows=await api('/'+ac.table+'?select=id,nome,whatsapp,'+(ac.tel?'telefone,':'')+'responsavel,proximo_canal,'+ac.nf+','+ac.nf+'_hora,'+ac.sf
        +'&'+ac.nf+'=lte.'+limite
        +'&responsavel=eq.'+encodeURIComponent(currentUser)
        +'&order='+ac.nf+'.asc');
      rows.forEach(function(r){
        const st=cfg.stages.find(function(x){return x.id===r[ac.sf];});
        if(st&&(st.ok||st.off))return;   // fechado / perdido não entra na fila
        const d=r[ac.nf];
        if(!d)return;
        itens.push({tab:k,id:r.id,nome:r.nome,whatsapp:r.whatsapp||r.telefone,data:d,
          hora:hhmm(r[ac.nf+'_hora'])||'09:00',rot:ac.rot,etapa:st?st.n:'',canal:r.proximo_canal||''});
      });
    }catch(e){}
  }
  try{
    const qs='status=eq.pendente&data_prevista=lte.'+limitePV
      +(PVTODOS&&isAdmin()?'':'&responsavel=eq.'+encodeURIComponent(currentUser))
      +'&order=data_prevista.asc';
    var tr=null,emb=true;
    try{ tr=await api('/crm_tarefas?select=*,crm_leads(nome,whatsapp,etapa)&'+qs); }
    catch(e){ emb=false; }
    if(!emb){
      /* fallback: se o embed do PostgREST nao estiver disponivel, resolve os leads a parte */
      tr=await api('/crm_tarefas?select=*&'+qs);
      const ids=(tr||[]).map(function(t){return t.lead_id;});
      var mp={};
      if(ids.length){
        const lds=await api('/crm_leads?select=id,nome,whatsapp,etapa&id=in.('+ids.join(',')+')');
        (lds||[]).forEach(function(l){mp[l.id]=l;});
      }
      (tr||[]).forEach(function(t){t.crm_leads=mp[t.lead_id]||null;});
    }
    (tr||[]).forEach(function(t){
      const L=t.crm_leads||{};
      if(L.etapa!=='fechado')return;
      itens.push({tab:'leads',id:t.lead_id,nome:L.nome||'Lead',whatsapp:L.whatsapp,
        data:t.data_prevista,hora:hhmm(t.hora_prevista)||'09:00',rot:'Pós-venda',
        etapa:pvNome(t.tipo)+(t.responsavel&&t.responsavel!==currentUser?' · '+t.responsavel:''),pv:true});
    });
  }catch(e){}
  AGITENS=itens;
  bucketAlerts();
}

/* Reparte a fila em atrasado / na hora / ainda hoje / proximos, comparando data E hora */
function bucketAlerts(){
  const hoje=hojeISO(),hm=agoraHM();
  const at=[],ag=[],hj=[],px=[],pv=[];
  AGITENS.forEach(function(it){
    const h=it.hora||'09:00';
    if(it.data<hoje)at.push(it);
    else if(it.data===hoje){if(h<=hm)ag.push(it);else hj.push(it);}
    else if(it.pv&&it.data>addDias(hoje,3))pv.push(it);   /* pos-venda distante tem lista propria */
    else px.push(it);
  });
  const ord=function(a,b){const ka=a.data+' '+(a.hora||'09:00'),kb=b.data+' '+(b.hora||'09:00');return ka<kb?-1:1;};
  at.sort(ord);ag.sort(ord);hj.sort(ord);px.sort(ord);pv.sort(ord);
  ALERTS={atrasados:at,agora:ag,hoje:hj,proximos:px,posvenda:pv,total:at.length+ag.length};
  renderAlertBadge();
  const novos=[];
  ag.forEach(function(it){
    const k=it.tab+':'+it.id+':'+it.data+' '+(it.hora||'09:00');
    if(AGVISTOS[k])return;
    AGVISTOS[k]=1;novos.push(it);
  });
  if(AGBOOT&&novos.length){
    toast(novos.length===1
      ?('\u23F0 '+novos[0].hora+' · hora de falar com '+novos[0].nome)
      :('\u23F0 '+novos.length+' contatos chegaram na hora agendada'));
  }
  AGBOOT=true;
}

}
